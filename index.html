erve", "Orient", "Decide", "Act"], "a": 1, "e": "Steps 3 (Set Improvement Targets) and 4 (Determine Root Cause) map to Orient — which Boyd called the most important part of the loop."}]}, {"c": "Understand the steps for the 8-Step Practical Problem-Solving Method.", "t": "scn", "qs": [{"q": "Your team keeps \"fixing\" the same late-launch problem every few months, only for it to return. Which PPSM step was most likely done poorly?", "o": ["Step 1: Clarify and Validate the Problem", "Step 4: Determine Root Cause", "Step 6: See Countermeasures Through", "Step 3: Set Improvement Targets"], "a": 1, "e": "Problems recur when efforts target symptoms instead of root causes; incorrect root cause is the most common mistake in process improvement. Tools: brainstorming and the Five Whys."}, {"q": "Your team successfully reduced pharmacy wait times and is eager to move to the next project. What step is most commonly skipped, and what should you do?", "o": ["Step 1 — re-clarify and validate the problem before moving on", "Step 8 — standardize the successful processes", "Step 5 — develop additional countermeasures to improve further", "Step 3 — set new, more aggressive improvement targets"], "a": 1, "e": "Step 8 is the most commonly skipped step. Standardizing successful countermeasures greatly reduces the risk of the problem returning."}, {"q": "A team is weighing several possible solutions by asking whether each will achieve the target, whether it is possible given cost and resources, and whether it will create more problems than it solves. Which step are they in?", "o": ["Step 2: Break Down the Problem", "Step 4: Determine Root Cause", "Step 5: Develop Countermeasures", "Step 7: Confirm Results"], "a": 2, "e": "In Step 5, alternatives are analyzed for effectiveness, feasibility, and impact, and an action plan (what, who, when) is developed."}, {"q": "A leader wants to set improvement targets that are Balanced, Specific, Measurable, Attainable, Results focused, and Timely. Which PPSM step is she in?", "o": ["Step 1: Clarify and Validate the Problem", "Step 3: Set Improvement Targets", "Step 6: See Countermeasures Through", "Step 8: Standardize Successful Processes"], "a": 1, "e": "Step 3: targets should be challenging but achievable and have B-SMART characteristics; ideal-state and future-state mapping help."}, {"q": "Before committing resources, a team asks: \"Will solving this contribute to strategic goals? Is there a performance gap? Has anyone actually observed the problem?\" Which step is this?", "o": ["Step 1: Clarify and Validate the Problem", "Step 2: Break Down the Problem", "Step 5: Develop Countermeasures", "Step 7: Confirm Results"], "a": 0, "e": "Step 1 validates the problem and states it in clear, specific, objective, and measurable terms. Tools include SA&D, Voice of the Customer, and Go and See."}]}]}, {"lesson": "Critical Thinking", "csobs": [{"c": "Summarize the definition of critical thinking.", "t": "scn", "qs": [{"q": "During a heated planning meeting, an officer sets aside her personal dislike of a proposal and evaluates it strictly on its merits. Which definition from the reader does this behavior match?", "o": ["Confirmation bias", "Critical thinking", "System 1 thinking", "Deflection"], "a": 1, "e": "The reader defines critical thinking as \"the process of thinking carefully about a subject or idea, without allowing feelings or opinions to affect you.\""}, {"q": "A captain gathers relevant information, tests her conclusion against standards, considers alternative viewpoints and their assumptions, and then communicates her solution to the team. This best describes:", "o": ["A critical thinker", "Groupthink", "Belief perseverance", "A cognitive domain operation"], "a": 0, "e": "A critical thinker raises vital questions, gathers and assesses information, reaches well-reasoned conclusions tested against standards, thinks open-mindedly, and communicates effectively."}, {"q": "Adam Grant contrasts critical thinking with confirmation bias. Which scenario shows critical thinking?", "o": ["A lieutenant ignores data that contradicts his plan", "A lieutenant changes his assessment after new evidence shows his original belief was wrong", "A lieutenant searches only for articles supporting his view", "A lieutenant repeats a viral post without checking it"], "a": 1, "e": "Grant: \"Confirmation bias is twisting the facts to fit your beliefs. Critical thinking is bending your beliefs to fit the facts.\""}]}, {"c": "Discuss methods for evaluating information.", "t": "scn", "qs": [{"q": "A briefer says, \"Our new process is the best in the Air Force.\" Before evaluating it, what should a critical thinker first determine?", "o": ["Whether it is a statement (claim) or an argument that gives reasons for a conclusion", "Whether the briefer outranks them and should be trusted", "Whether the claim has been widely shared on social media", "Whether the slides follow the correct briefing format"], "a": 0, "e": "The first step in evaluating information is deciding whether it is a statement (claim) or an argument providing reasons for a conclusion."}, {"q": "\"The runway is 9,000 feet long\" versus \"The runway is too short for comfortable landings.\" How should these be classified?", "o": ["Both are opinions", "The first is an objective fact; the second is a subjective opinion", "The first is subjective; the second is objective", "Both are arguments"], "a": 1, "e": "A fact is objective and verifiable; an opinion is a subjective belief that cannot be verified. Objective claims are true or false independently of what people think."}, {"q": "A news article on a deployment is accurate but leaves out key details that would change your judgment. What do Browne and Keeley advise?", "o": ["Assume that any omitted information was irrelevant", "Remember that almost any information has a purpose and was organized to affect your thinking", "Only trust information that agrees with what you already believe", "Stop reading news coverage entirely to avoid bias"], "a": 1, "e": "Browne and Keeley: almost any information has a purpose, and its organization was selected to affect your thinking; consider what has been left out."}]}, {"c": "Explain the nine intellectual standards used in assessing one's thinking.", "t": "scn", "qs": [{"q": "A Senior NCO reports, \"It's really hot on the flightline today,\" and you ask, \"What's the actual temperature?\" Which intellectual standard are you applying?", "o": ["Clarity", "Precision", "Breadth", "Fairness"], "a": 1, "e": "Precision refines information; \"hot\" can mean many temperatures, so detail adds precision."}, {"q": "Before deciding on a policy, you deliberately seek out how other units, career fields, and stakeholders view the issue and its implications. Which standard is this?", "o": ["Depth", "Breadth", "Relevance", "Accuracy"], "a": 1, "e": "Breadth addresses various interpretations of an issue, including other points of view, the concepts involved, and implications."}, {"q": "A subordinate's request is so vague you can't tell whether it is accurate or relevant. Which standard does the reader call the \"gateway\" standard that must be addressed first?", "o": ["Logic", "Significance", "Clarity", "Depth"], "a": 2, "e": "Clarity is the gateway standard: if a statement is unclear, you cannot determine whether it is accurate, relevant, or logical."}, {"q": "Before finalizing a decision that benefits your own section, you pause to check whether ego, personal interests, or unjustified assumptions are influencing you. Which standard is this \"gut check\"?", "o": ["Fairness", "Significance", "Accuracy", "Logic"], "a": 0, "e": "Fairness is a \"gut check\" to avoid personal interests, ego, and unjustified assumptions."}]}, {"c": "Explain cognitive domain operations and their relationship to disinformation.", "t": "scn", "qs": [{"q": "An adversary uses AI-generated social media posts, psychological messaging, and cyber tools to spread false narratives that weaken US public trust. What does the reader call this?", "o": ["Electromagnetic warfare", "Cognitive domain operations", "Offensive counterair", "Strategic deterrence"], "a": 1, "e": "Cognitive domain operations blend information, psychological warfare, and cyberwarfare, with the help of AI and other technologies, to spread propaganda across the information domain (e.g., social media)."}, {"q": "According to NATO Review, why do personalized news feeds and search engines make people more vulnerable to disinformation?", "o": ["They are always factually wrong and easy to spot", "They serve results aligned with our preferences, increasing confirmation bias", "They encourage slow, deliberate thinking that delays action", "They only show official sources, which limits perspectives"], "a": 1, "e": "Feeds that match our preferences increase confirmation bias; rapid messaging induces recency bias; social proofing creates echo chambers. Together they encourage reflexive \"thinking fast.\""}, {"q": "You see a provocative, emotional social media post about a unit incident that is spreading fast. Which response best counters cognitive domain operations?", "o": ["Share it immediately so others are warned", "\"Think slow\" and verify it before reacting", "Assume it's true because many people shared it", "Respond quickly and emotionally to show support"], "a": 1, "e": "The reader warns against acting on half-truths or emotionally charged statements; confirmation bias plus provocative posts spreads misinformation rapidly."}]}, {"c": "Describe the elements of reasoning that are used in the critical thinking process.", "t": "scn", "qs": [{"q": "After a terrorist attack, leaders immediately concluded a particular group was responsible, but they were wrong. Which element of reasoning — and its common failure — does this illustrate?", "o": ["Concept — they were caught in a conceptual trap", "Inference — they jumped to conclusions", "Purpose — they were misled by a false purpose", "Point of view — their bias filtered the information"], "a": 1, "e": "An inference draws a conclusion from interpreting assumptions. The reader's example (Spain, 2004) shows incorrect inferences; critical thinkers evaluate assumptions before concluding."}, {"q": "Before 9/11, analysts could not imagine hijacked aircraft used as weapons because they thought of hijackings only as hostage situations. Which element of reasoning failed?", "o": ["Information — they lacked any warning indicators", "Concept — they were stuck in a conceptual trap", "Implication — they ignored the consequences", "Question — they asked a question of preference"], "a": 1, "e": "Concept is called the most powerful element; uncritical thinkers get stuck in incorrect concepts — a \"conceptual trap\" — as on 11 September 2001."}, {"q": "Which list shows the eight elements of reasoning presented in the reader?", "o": ["Purpose, Question, Information, Concept, Inference, Assumption, Point of View, Implications", "Clarity, Accuracy, Precision, Relevance, Depth, Breadth, Logic, Fairness", "Observe, Orient, Decide, Act, Plan, Prepare, Execute, Assess", "Trust, Information, Power, Options, Task, People, Time, Risk"], "a": 0, "e": "The eight elements of reasoning: Purpose, Question, Information, Concept, Inference, Assumption, Point of View, and Implications."}, {"q": "A strategic leader must decide \"how to protect civil liberties while maintaining security\" — a question with no single right answer that requires reasoning skills. Which type of question is this?", "o": ["Question of fact", "Question of preference", "Question of judgment", "Question of information"], "a": 2, "e": "Paul's three types of questions: fact (one right answer), preference (many answers), and judgment (require reasoning) — the hardest challenge for strategic leaders. Col Guillot calls questioning the most important element."}]}, {"c": "Discuss common thinking errors that can lead to faulty thinking.", "t": "scn", "qs": [{"q": "Because a new Airman was a star athlete at the Academy, his supervisor assumes he must also be an excellent writer and leader. Which thinking error is this?", "o": ["Belief perseverance", "Halo effect", "Deflection", "System 2 thinking"], "a": 1, "e": "The halo effect occurs when one thing you know about a person (good or bad) shapes how you see everything else about them."}, {"q": "When asked why a report is late, a lieutenant talks at length about how busy the office has been, never actually answering. Which thinking error is this?", "o": ["Asking the wrong questions", "Answering the wrong question — deflection", "Stereotyping", "Halo effect"], "a": 1, "e": "Deflection is answering a question with something that doesn't really answer it, causing the conversation to veer from its original intent."}, {"q": "Even after data clearly shows his plan failed, a major refuses to change his mind about it. Which cognitive bias is this?", "o": ["Halo effect", "Belief perseverance", "Recency bias", "Social proofing"], "a": 1, "e": "Belief perseverance is the difficulty of changing your mind even when proven wrong; critical thinking requires treating judgments as tentative and contextual."}, {"q": "A flight commander makes a snap staffing decision based on gut feeling and past patterns, without deliberate analysis, and it backfires. Which mode of thinking was she relying on?", "o": ["System 1 — fast, intuitive, emotional", "System 2 — slow, deliberate, logical", "Breadth", "Inference"], "a": 0, "e": "System 1 is fast and intuitive, which allows rapid responses but can lead to biases and errors. System 2 is slow, deliberate, and logical. \"Slow down!\""}]}]}, {"lesson": "Followership", "csobs": [{"c": "Summarize the five basic styles of followership.", "t": "scn", "qs": [{"q": "An Airman does exactly what she is told and then stops. She shows no initiative, rarely thinks critically about the task, and takes little responsibility. In Kelley's model, she is a:", "o": ["Sheep", "Yes Person", "Alienated Follower", "Survivor"], "a": 0, "e": "\"Sheep\" are passive and uncritical, lacking initiative and a sense of responsibility — they perform the tasks given and stop (low critical thinking, passive participation)."}, {"q": "A sharp NCO often criticizes unit decisions with insightful analysis but does only the minimum and has distanced himself from the mission after a bad experience. He is cynical. Which follower style is this?", "o": ["Effective Follower", "Alienated Follower", "Yes Person", "Sheep"], "a": 1, "e": "Alienated followers think critically and independently but fulfill their roles passively; something \"turned them off,\" and they often slide into disgruntled acquiescence."}, {"q": "A lieutenant energetically agrees with everything the commander says, depends on the boss for direction, and never offers independent ideas. Kelley would call him a:", "o": ["Yes Person", "Effective Follower", "Survivor", "Alienated Follower"], "a": 0, "e": "\"Yes People\" are livelier (active) but unenterprising and dependent on the leader for inspiration — sometimes aggressively deferential, even servile (low critical thinking, active)."}, {"q": "A civilian six months from retirement attends only mandatory events, finishes tasks exactly on time so as not to get more work, and agrees with every decision to keep the peace. Which style does this describe?", "o": ["Sheep", "Survivor", "Effective Follower", "Alienated Follower"], "a": 1, "e": "Survivors sit in the center of Kelley's model as \"shape-shifters\" who do the minimum to stay out of trouble and assess what the leader wants (\"R.O.A.D.\" — Retired on Active Duty)."}, {"q": "A captain thinks critically, courageously dissents when necessary, shares credit, admits mistakes, and actively leans into the mission. Which follower style is this?", "o": ["Yes Person", "Effective Follower", "Alienated Follower", "Survivor"], "a": 1, "e": "Effective followers are highly participative critical thinkers who courageously dissent when necessary, share credit, admit mistakes, and exercise superior judgment."}]}, {"c": "Distinguish between the characteristics of an effective follower.", "t": "scn", "qs": [{"q": "Kelley names two behavioral dimensions that determine follower effectiveness. A follower who scores high on both is effective. What are the two dimensions?", "o": ["Rank and experience", "Critical thinking and participation", "Loyalty and obedience", "Performance and popularity"], "a": 1, "e": "Kelley's two dimensions are critical thinking and participation. Effective followers are high on both."}, {"q": "A follower tells her boss an unpleasant truth about a flawed plan because it serves the organization, and she invites honest feedback in return. Which relationship-initiative competency is she showing?", "o": ["Seeing one's self as a resource", "Communicating courageously", "Embracing change", "Doing the job"], "a": 1, "e": "Communicating courageously means giving honest, timely feedback — telling unpleasant truths to serve the organization and seeking the same from others."}, {"q": "A Guardian is constantly looking for ways to reduce waste, improve processes, and lead by example during a reorganization. Which performance-initiative competency is this?", "o": ["Embracing change", "Identifying with the leader", "Building trust", "Adopting the leader's vision"], "a": 0, "e": "Embracing change: followers committed to constant improvement and waste reduction who act as change agents."}, {"q": "A highly productive, creative \"workhorse\" rarely invests in understanding the boss's perspective or building relationships. In the performance/relationship initiative model, which type is this, and what would make him a \"partner\"?", "o": ["Politician; improve his job performance and technical skill", "Contributor; build relationships to understand the boss's perspective", "Subordinate; follow orders more closely and ask fewer questions", "Partner already; no change is needed in his approach"], "a": 1, "e": "Contributors are high in performance initiative but low in relationship initiative. Partners blend exceptional performance with healthy relationships."}]}, {"c": "Explain the correlation between followership and leadership.", "t": "scn", "qs": [{"q": "A lieutenant asks why the Air Force cares about followership if she is training to be a leader. Which response best reflects the reader?", "o": ["Followership doesn't matter once you are commissioned", "Those who follow effectively usually transition to leadership positions", "Leadership and followership are unrelated skills", "Only enlisted members need followership"], "a": 1, "e": "The reader titles it \"Dynamic Followership: The Prerequisite for Effective Leadership\"; those able to follow effectively usually transition to formal leadership over time."}, {"q": "A commander surrounds himself with \"yes people\" because they're comfortable to work with. According to Kelley, what is the problem?", "o": ["Nothing — loyalty is the only follower trait that matters", "Leaders who embrace less effective followers neglect follower development", "Yes people are always disloyal", "Yes people should be promoted faster"], "a": 1, "e": "Kelley cautions that some leaders embrace \"yes people\"; follower development is a leader's utmost responsibility."}, {"q": "Meilinger notes we will all be followers more often than leaders. One of his rules is \"Fight with your boss if necessary, but do it in private.\" How does this connect followership and leadership?", "o": ["Disagree privately, then support the decision publicly", "It shows followers should never disagree with the boss", "It shows followers should go around the boss when they disagree", "It shows leadership matters more than followership"], "a": 0, "e": "Meilinger argues good followership enables good leadership — disagree privately, don't blame the boss for unpopular decisions, and support rather than undermine."}]}]}, {"lesson": "Full-Range Leadership", "csobs": [{"c": "Differentiate the characteristics of laissez-faire, transactional, and transformational leadership.", "t": "scn", "qs": [{"q": "A flight commander is rarely available, keeps delaying a decision on hiring a contractor, ignores subordinates' PME requirements, and avoids taking a stand on issues. Which approach is this?", "o": ["Transactional — MBE-Passive", "Laissez-faire", "Transformational — individualized consideration", "Transactional — contingent reward"], "a": 1, "e": "Laissez-faire is \"hands-off\" non-leadership: absence, avoiding decisions, abdicating responsibility, and not developing followers. It is linked to the lowest performance."}, {"q": "A supervisor promises Airmen an afternoon off if they complete an inspection-prep task by Thursday, and then follows through. This is an example of:", "o": ["Laissez-faire", "Contingent reward (transactional)", "Idealized influence (transformational)", "Management by exception — passive"], "a": 1, "e": "Contingent reward is a constructive transaction: a reward exchanged for meeting agreed-upon performance."}, {"q": "A captain only steps in after two careless Airmen cause an accident, following an \"if it ain't broke, don't fix it\" philosophy. Which behavior is this?", "o": ["Management by exception — active", "Management by exception — passive", "Contingent reward", "Intellectual stimulation"], "a": 1, "e": "MBE-P: the leader waits for problems before acting. It breeds low trust, fear, and complacency and is dangerous in high-risk military settings."}, {"q": "A colonel builds personal relationships with her people, raises their motivation and morality, and challenges them to accomplish more than they originally intended. Which leadership approach is this?", "o": ["Transactional", "Laissez-faire", "Transformational", "Management by exception — active"], "a": 2, "e": "Transformational leadership builds personal relationships that raise followers' motivation and morality and helps them reach their fullest potential — empirically the most effective style."}, {"q": "A MSgt immediately corrects an Airman for not saluting an officer and actively monitors the team for deviations from standards. Which behavior is this?", "o": ["Management by exception — active", "Management by exception — passive", "Individualized consideration", "Laissez-faire"], "a": 0, "e": "MBE-A is a corrective transaction in which the leader actively monitors and promptly corrects deviations. It is useful when safety is a factor, but overuse can become micromanagement."}]}, {"c": "Describe how to apply Full-Range Leadership.", "t": "scn", "qs": [{"q": "A Capt stays an extra hour after duty to help an Airman with a college course, listens attentively to her concerns, and tailors coaching to her goals. Which transformational behavior is he applying?", "o": ["Idealized influence", "Inspirational motivation", "Intellectual stimulation", "Individualized consideration"], "a": 3, "e": "Individualized consideration means coaching, mentoring, active listening, and treating each follower as an individual with different needs and aspirations."}, {"q": "Your maintainers keep using the same workaround for a recurring problem. You want them to question assumptions, reframe the problem, and try new approaches without fear of criticism. Which behavior should you apply?", "o": ["Intellectual stimulation", "Management by exception — active", "Contingent reward", "Idealized influence"], "a": 0, "e": "Intellectual stimulation fosters creativity and innovation by questioning assumptions and reframing problems; leaders focus on the \"what\" of a problem, not \"who\" to blame."}, {"q": "Before a major inspection, a squadron commander holds a commander's call, articulates a compelling vision, and expresses confidence that the unit can exceed expectations. Which behavior is this?", "o": ["Inspirational motivation", "Individualized consideration", "Laissez-faire", "MBE-passive"], "a": 0, "e": "Inspirational motivation uses enthusiasm, optimism, and a shared vision to energize followers to exert extra effort."}, {"q": "An officer consistently \"walks the talk\": she upholds high ethical standards, puts the group's needs ahead of her own, and is admired and trusted as a role model. Which behavior is this?", "o": ["Idealized influence", "Intellectual stimulation", "Contingent reward", "Inspirational motivation"], "a": 0, "e": "Idealized influence: leaders project themselves as positive role models who \"do the right thing\" and place group interests over personal ones. It aligns closely with the Air Force core values."}, {"q": "A new leader asks how to apply the Full-Range Leadership Model overall. Which guidance best reflects the reader?", "o": ["Use only transformational behaviors and never transactional ones, since transactions are negative", "Use transformational behaviors as the most effective approach, employ constructive transactional behaviors (CR, MBE-A when needed) to meet standards", "Use laissez-faire to empower followers and give them full independence", "Rely mainly on MBE-passive so you intervene only when standards are not met"], "a": 1, "e": "Transformational is most effective, transactional is necessary in military settings and not negative, and laissez-faire should be avoided. Leaders flex across the full range."}]}]}, {"lesson": "Professional and Unprofessional Relationships", "csobs": [{"c": "Describe professional and unprofessional relationships.", "t": "scn", "qs": [{"q": "A lieutenant seeks out a senior NCO from another squadron as a mentor and plays on a unit intramural softball team with members of various ranks. How should these relationships be characterized?", "o": ["Unprofessional — officers may not socialize with enlisted members", "Professional — these build morale and unit cohesion", "Fraternization — a violation of Article 134", "Prohibited — but only when the activities are off duty"], "a": 1, "e": "Professional relationships reflect the conduct standards expected of military members. Mentoring and participation in unit events, intramural sports, and similar activities are encouraged."}, {"q": "A supervisor regularly goes to lunch and golf with one subordinate, and coworkers begin to believe that subordinate receives the best assignments. Even if no favoritism is intended, why is this a concern?", "o": ["It isn't a concern — off-duty activities are always private matters", "Even a reasonable perception of favoritism makes it prohibited", "It's only a concern if the two members belong to different services", "It's only a concern if money or gifts are exchanged between them"], "a": 1, "e": "A relationship is prohibited if it causes an actual or reasonable perception of favoritism, partiality, or unfairness — even the appearance of a buddy-boss situation can create problems."}, {"q": "A civilian employee and a contractor employee develop a relationship that compromises the integrity of the supervisory chain on a contract. Can unprofessional relationships exist outside officer–enlisted pairs?", "o": ["No — only officer-enlisted relationships can be unprofessional", "Yes — they can exist among any members, including civilian and contractor personnel", "Only between members of different services", "Only during deployment"], "a": 1, "e": "Unprofessional relationships can exist between officers, between enlisted members, between officers and enlisted, and with civilian employees or contractor personnel."}]}, {"c": "Summarize the policy on professional and unprofessional relationships.", "t": "scn", "qs": [{"q": "A recruiter offers to drive a recruit home in his personal vehicle after a casual dinner where they shared drinks. Five months after the recruit graduates technical school and arrives at his first base, the recruiter invites him to play golf. What does policy say?", "o": ["All of this is fine once the recruit enlists", "These are prohibited activities", "Only the alcohol is prohibited", "Prohibitions end on the day of enlistment"], "a": 1, "e": "Recruiter/trainer prohibitions include social drinking, private vehicles, and personal sporting activities, from first contact until the later of six months after initial skills training or completing initial entry training at the first assignment."}, {"q": "A TSgt runs a side business and tries to sell products to Airmen junior to him in his flight. What does the policy say?", "o": ["It's allowed as long as the sales take place off duty and off base", "It's prohibited — members may not solicit sales to juniors or their families, on or off duty", "It's allowed as long as the prices are fair and no one feels pressured", "Only officers are restricted from making sales to junior members"], "a": 1, "e": "Limitation on solicited sales: members shall not knowingly solicit or make solicited sales to junior members or their families, on or off duty."}, {"q": "A commander learns that an unprofessional relationship in her unit is degrading morale. Which is often an effective first step, per the reader?", "o": ["Immediately refer both members to a court-martial", "Counseling — and if ineffective, lawfully ordering members to cease the relationship", "Ignore it unless one of the members files a complaint", "Begin administrative discharge of both members"], "a": 1, "e": "Commanders must act swiftly; counseling is often an effective first step. If it fails, commanders may lawfully order the relationship to cease. More serious cases may warrant NJP or court-martial."}]}, {"c": "Summarize the general and specific prohibitions relating to unprofessional relationships for officers.", "t": "scn", "qs": [{"q": "A second lieutenant and a staff sergeant from a different service begin dating. The lieutenant argues it isn't fraternization because they aren't in the same chain of command. Is he correct?", "o": ["Yes — fraternization only applies within the same chain of command", "No — it covers all officer–enlisted relationships, any service", "Yes — relationships between members of different services are exempt", "No — but only because they happen to be on duty together"], "a": 1, "e": "Fraternization (UCMJ Art. 134) extends to members of different services and components. Officers are specifically prohibited from dating or having sexual relations with enlisted members."}, {"q": "A captain borrows $500 from an Airman to cover a car payment and pays it back with interest. What does the policy say?", "o": ["It's acceptable because the loan was repaid in full with interest", "It's prohibited — officers will not lend to, borrow from, or become indebted to enlisted members", "It's only prohibited if the amount borrowed is over $1,000", "It's acceptable as long as the commander approves the loan in advance"], "a": 1, "e": "Specific prohibition: officers will not lend to, borrow from, or become indebted to enlisted members, with an exception only for infrequent, small, non-interest-bearing loans in exigent circumstances."}, {"q": "When fraternization occurs between an officer and an enlisted member, who is held primarily responsible?", "o": ["The enlisted member only, since they accepted the relationship", "Neither member, as long as the relationship was consensual", "The officer, who is the only member subject to disciplinary action for fraternization", "Both members equally under Article 134"], "a": 2, "e": "The officer is held primarily responsible and is the only one subject to discipline for fraternization; a consenting enlisted member can be disciplined under Article 92 for violating the instruction."}, {"q": "During a deployment, an officer must temporarily share living quarters with enlisted members because of military operational needs. Is this permitted?", "o": ["No — shared accommodations are never permitted under any circumstances", "Yes — it's allowed when required for a military operation", "Yes — but only with senior NCOs in the grade of E-7 and above", "Only with written approval from the Secretary of the Air Force"], "a": 1, "e": "Officers will not share living accommodations with enlisted members except when required to accomplish a military operation; commanders assess the military necessity."}]}, {"c": "Summarize the effects of unprofessional relationships on unit cohesiveness.", "t": "scn", "qs": [{"q": "A new flight commander becomes \"one of the guys\" with his Airmen. When his successor arrives and tries to enforce standards, the Airmen respond with mumbling instead of \"yes, sir.\" What effect does Col Kansala describe?", "o": ["Improved morale that lasts", "Undue familiarity undermines respect for authority", "No effect, because the first officer left", "Increased productivity"], "a": 1, "e": "Kansala: when a superior steps out of the leadership role through a boss-buddy relationship, subordinates lose respect and others' leadership authority is undermined."}, {"q": "In combat, a leader must give an order involving substantial risk. Why does Kansala argue professional relationships matter most here?", "o": ["Orders in combat are optional when the risk is high", "To execute orders effectively, the superior's integrity must be accepted without question", "Combat units are exempt from the professional relationships policy", "Junior members outrank seniors once combat begins"], "a": 1, "e": "In combat there isn't time to worry about compliance, loyalty, or the leader's motives — the superior's integrity must be accepted without question."}, {"q": "Why are unprofessional relationships that include sexual activity of particular concern to unit cohesion?", "o": ["They are the only type of relationship covered by the policy", "They have increased potential to significantly degrade unit cohesion, respect for authority", "They are always permitted as long as both members consent", "They affect only the two members involved, not the unit"], "a": 1, "e": "Sexual relationships fall under the same policy, but those that are unprofessional have increased potential to significantly degrade unit cohesion, respect for authority, and the mission."}]}]}, {"lesson": "Military Planning", "csobs": [{"c": "Explain why the military uses a formal planning process.", "t": "scn", "qs": [{"q": "In Operation EAGLE CLAW, an overly complex plan with insufficient rehearsals, weak weather contingencies, and no redundancy in helicopters failed at Desert One. How would a formal planning process have helped?", "o": ["It would have guaranteed the mission's success", "It would have forced a more realistic assessment of the risks", "It would have eliminated the need for rehearsals", "It would have removed the need for interservice coordination"], "a": 1, "e": "No framework guarantees success, but a structured process minimizes risk and maximizes the chance of success by forcing realistic assessment of challenges and risks."}, {"q": "A support officer says, \"I'm not a planner, so JPP doesn't matter to me.\" Which response best reflects the reader?", "o": ["Correct — JPP is used only by strategic-level planners on joint staffs", "JPP builds critical thinking useful in any role", "Correct — JPP applies only during wartime operations", "JPP replaces the commander's intent with a fixed checklist"], "a": 1, "e": "The reader calls JPP a powerful tool for fostering creativity and critical thinking in officers regardless of career field."}, {"q": "What major reform followed the failure of Operation EAGLE CLAW and mandated \"jointness\" in US military operations?", "o": ["The National Security Act of 1947", "The Goldwater-Nichols Act of 1986", "The UCMJ of 1950", "UN Security Council Resolution 678"], "a": 1, "e": "EAGLE CLAW exposed flaws in interservice cooperation and command structure, leading directly to the Goldwater-Nichols Act of 1986."}]}, {"c": "Summarize the seven steps of the Joint Planning Process (JPP).", "t": "scn", "qs": [{"q": "Your team has just been tasked to respond to a crisis. The first thing you do is write a clear, concise, fact-based problem statement addressing who, what, where, when, why, and how. Which JPP step are you in?", "o": ["Mission Analysis", "Planning Initiation", "COA Development", "Plan or Order Development"], "a": 1, "e": "Step 1, Planning Initiation, yields a well-defined problem statement and a planning team."}, {"q": "Planners identify specified and implied tasks, map constraints and restraints, separate facts from assumptions, analyze centers of gravity, and develop CCIRs, culminating in a restated mission statement. Which step — called \"arguably the most critical\" — is this?", "o": ["COA Comparison", "Mission Analysis", "COA Approval", "Planning Initiation"], "a": 1, "e": "Step 2, Mission Analysis, determines the command's true task and purpose and ends with the Mission Analysis Brief and the restated mission statement."}, {"q": "After the commander approves a COA, the team uses the commander's estimate to build the CONOPS, which is then refined into an OPORD for subordinate commanders. Which step is this?", "o": ["COA Approval", "COA Analysis and Wargaming", "Plan or Order Development", "Mission Analysis"], "a": 2, "e": "Step 7, Plan or Order Development, produces the CONOPS and the Operations Order (OPORD)."}, {"q": "Which sequence correctly lists the seven steps of the JPP?", "o": ["Planning Initiation, Mission Analysis, COA Development, COA Analysis & Wargaming, COA Comparison, COA Approval, Plan or Order Development", "Mission Analysis, Planning Initiation, COA Approval, COA Development, Wargaming, Comparison, Execution", "Observe, Orient, Decide, Act, Assess, Adjust, Execute", "Planning Initiation, COA Development, Mission Analysis, COA Approval, Wargaming, Comparison, OPORD"], "a": 0, "e": "The seven JPP steps, in order: Planning Initiation, Mission Analysis, COA Development, COA Analysis & Wargaming, COA Comparison, COA Approval, and Plan or Order Development."}]}, {"c": "Describe the attributes of a quality course of action (COA).", "t": "scn", "qs": [{"q": "A proposed COA would accomplish the objective, but the unit lacks the aircraft and time to execute it. Which COA attribute does it fail?", "o": ["Suitable", "Feasible", "Acceptable", "Distinguishable"], "a": 1, "e": "Feasible asks: is the COA executable within available time and space, with enough resources and the necessary skills?"}, {"q": "COA 2 is nearly identical to COA 1, with only minor wording differences. Which attribute does COA 2 fail?", "o": ["Complete", "Suitable", "Distinguishable", "Feasible"], "a": 2, "e": "Distinguishable asks how the COA differs from the others and whether it offers a unique approach."}, {"q": "A COA would likely liberate the objective quickly but would cause unacceptable civilian casualties and violate the commander's restraints. Which attribute does it fail?", "o": ["Acceptable", "Complete", "Distinguishable", "Feasible"], "a": 0, "e": "Acceptable weighs negative consequences — is the benefit worth the risk, and does it respect constraints and restraints?"}, {"q": "A COA briefs well but has no time estimates, sustainment concept, or mission success criteria. Which attribute is missing?", "o": ["Suitable", "Complete", "Acceptable", "Distinguishable"], "a": 1, "e": "Complete requires objectives, effects, tasks, time estimates, deployment/employment/sustainment concepts, and success criteria."}]}, {"c": "Summarize the different methods used to evaluate COAs.", "t": "scn", "qs": [{"q": "A planning team runs a tabletop exercise in which a Blue Team executes each friendly COA while a Red Team reacts and counters, in an action–reaction–counteraction sequence. Which evaluation method is this?", "o": ["COA comparison using an evaluation matrix", "Wargaming during COA Analysis", "Mission Analysis Brief", "Commander's estimate"], "a": 1, "e": "Wargaming is the primary mechanism of COA analysis: friendly COAs are evaluated against the most likely and most dangerous adversary COAs."}, {"q": "After wargaming, the staff rates each COA against criteria set during mission analysis, comparing them head-to-head in an evaluation matrix. Which step is this, and what does it produce?", "o": ["COA Development; a COA statement and sketch", "COA Comparison; a recommendation of the COA most likely to succeed", "COA Approval; the Operations Order (OPORD)", "Planning Initiation; a problem statement"], "a": 1, "e": "COA Comparison systematically rates COAs (often pairwise in an evaluation matrix) and recommends the COA with the highest probability of success that is acceptable."}, {"q": "During a wargame, the team discovers a major flaw in COA 1. What does the reader recommend?", "o": ["Discard all COAs and start mission analysis over", "Stop the wargame, revise the COA, and restart the wargame from the beginning", "Ignore the flaw and finish the wargame", "Present it to the commander as-is"], "a": 1, "e": "Leave the door open to refine COAs: stop, revise, and restart the wargame. The process is iterative."}]}, {"c": "Recall the purpose of wargaming.", "t": "def", "qs": [{"q": "What is the purpose of wargaming in the JPP?", "o": ["To build team morale and give the staff a break from routine planning tasks", "To reveal each COA's strengths and weaknesses against a thinking adversary", "To write the Operations Order and assign tasks to subordinate commanders", "To select the members of the planning team and assign their roles"], "a": 1, "e": "Wargaming provides a shared understanding of the OE and lets the team experience the consequences of its actions — including fog and friction — against a thinking adversary."}, {"q": "Which of the following is required for a wargame to be effective, per the reader?", "o": ["Developed COAs, human decisions, fairness, iteration", "Unlimited time, resources, and personnel", "Computer simulations with no human input", "A predetermined winner and fixed outcome"], "a": 0, "e": "An effective wargame requires well-developed COAs, human decision-making, a fair environment, and an iterative approach."}, {"q": "In wargaming, friendly COAs are evaluated against which adversary COAs?", "o": ["Only the least likely", "The most likely and most dangerous", "Only historical COAs", "None — adversaries are not modeled"], "a": 1, "e": "Planners evaluate each friendly COA against the most likely and most dangerous adversary COAs using action–reaction–counteraction."}]}]}];
</script>
<script>
(function(){
'use strict';
// ---------- data ----------
const ALL = [];
BANK.forEach((L, li) => L.csobs.forEach((c, ci) => c.qs.forEach((q, qi) => {
  ALL.push({id: li+'-'+ci+'-'+qi, li, lesson: L.lesson, csob: c.c, type: c.t, q: q.q, o: q.o, a: q.a, e: q.e});
})));
const EXAM_N = 50, EXAM_MIN = 120;
const app = document.getElementById('app');
const hdr = document.getElementById('hdrInfo');

// ---------- prefs (per viewer, optional) ----------
function load(k, d){ try{ const v = localStorage.getItem('as400q-'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem('as400q-'+k, JSON.stringify(v)); }catch(e){} }

let setup = Object.assign({mode:'practice', lessons: BANK.map((_, i) => i), type:'all', count:'all'}, load('setup', {}));
setup.lessons = (setup.lessons || []).filter(i => i < BANK.length);
let run = null; // active attempt
let timerId = null;

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a = a.slice(); for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function prep(q){ const order = shuffle([0,1,2,3]); return Object.assign({}, q, {order, pick: null, flag: false}); }
const KEYS = ['A','B','C','D'];
function fmt(s){ s = Math.max(0, s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+':' : '') + String(m).padStart(h?2:1,'0') + ':' + String(x).padStart(2,'0'); }

function poolFor(){
  return ALL.filter(q => setup.lessons.includes(q.li) && (setup.type === 'all' || q.type === setup.type));
}
function examDraw(){
  // 20% definition / 80% scenario. Every lesson still appears:
  // lessons with only definition questions get one definition slot each,
  // lessons with scenario questions get two scenario slots each, then each pool is filled at random.
  const nDef = Math.round(EXAM_N * 0.2), nScn = EXAM_N - nDef;
  const draw = (type, perLesson, onlyLessons, total) => {
    const pool = ALL.filter(q => q.type === type), picked = [], used = new Set();
    BANK.forEach((_, li) => { if(!onlyLessons(li)) return;
      shuffle(pool.filter(q => q.li === li)).slice(0, perLesson).forEach(q => { picked.push(q); used.add(q.id); }); });
    shuffle(pool.filter(q => !used.has(q.id))).slice(0, Math.max(0, total - picked.length)).forEach(q => picked.push(q));
    return shuffle(picked).slice(0, total);
  };
  const hasScn = li => ALL.some(q => q.li === li && q.type === 'scn');
  const defs = draw('def', 1, li => !hasScn(li), nDef);
  const scns = draw('scn', 2, hasScn, nScn);
  return shuffle(defs.concat(scns));
}

// ---------- views ----------
function viewSetup(){
  stopTimer(); hdr.hidden = true; run = null;
  const pool = poolFor();
  const counts = BANK.map((_, li) => ALL.filter(q => q.li === li).length);
  const isExam = setup.mode === 'exam';
  app.innerHTML = `
  <div class="stack">
    <section class="panel stack">
      <div><p class="eyebrow">Mission setup</p><h2>Choose how you want to study</h2>
      <p class="muted">${ALL.length} questions built from ${BANK.reduce((n,L)=>n+L.csobs.length,0)} CSOBs across ${BANK.length} lessons.</p></div>
      <div class="modes" role="group" aria-label="Quiz mode">
        <button class="mode" id="m-practice" aria-pressed="${!isExam}"><strong>Practice</strong><span>Pick lessons. Instant feedback and an explanation after every answer.</span></button>
        <button class="mode" id="m-exam" aria-pressed="${isExam}"><strong>Timed exam</strong><span>${EXAM_N} questions from every lesson (80% scenario, 20% definition), ${EXAM_MIN}-minute clock. Graded at the end.</span></button>
      </div>
    </section>
    <section class="panel stack" ${isExam ? 'hidden' : ''}>
      <fieldset>
        <legend class="bar" style="width:100%"><h3>Lessons</h3><span class="row"><button class="btn link" id="selAll">Select all</button><button class="btn link" id="selNone">Clear</button></span></legend>
        <div class="lessons">${BANK.map((L, i) => `<label for="ls-${i}"><input type="checkbox" id="ls-${i}" data-li="${i}" ${setup.lessons.includes(i) ? 'checked' : ''}><span>${esc(L.lesson)}</span><span class="n">${counts[i]}</span></label>`).join('')}</div>
      </fieldset>
      <div class="row" style="justify-content:space-between">
        <div class="row"><span class="muted">Question type</span>
          <span class="seg" role="group" aria-label="Question type">${[['all','All'],['def','Definition'],['scn','Scenario']].map(([v,t]) => `<button data-type="${v}" aria-pressed="${setup.type===v}">${t}</button>`).join('')}</span></div>
        <div class="row"><span class="muted">Length</span>
          <span class="seg" role="group" aria-label="Number of questions">${[['10','10'],['25','25'],['all','All']].map(([v,t]) => `<button data-count="${v}" aria-pressed="${setup.count===v}">${t}</button>`).join('')}</span></div>
      </div>
    </section>
    <section class="panel bar">
      <p id="summary" class="muted">${isExam ? `${EXAM_N} questions · ${EXAM_MIN} minutes · all ${BANK.length} lessons` : `${Math.min(pool.length, setup.count==='all' ? pool.length : +setup.count)} of ${pool.length} available questions`}</p>
      <button class="btn primary" id="start" ${!isExam && !pool.length ? 'disabled' : ''}>${isExam ? 'Start exam' : 'Start practice'}</button>
    </section>
  </div>
  <footer>Questions draw on the AS400 student readers, AFH 1 (Change Management, Team Building, Conflict Management), and the readings they cite. Answer order is shuffled on every attempt.</footer>`;
  const persist = () => save('setup', setup);
  app.querySelector('#m-practice').onclick = () => { setup.mode = 'practice'; persist(); viewSetup(); };
  app.querySelector('#m-exam').onclick = () => { setup.mode = 'exam'; persist(); viewSetup(); };
  app.querySelectorAll('[data-li]').forEach(cb => cb.onchange = () => {
    const i = +cb.dataset.li; setup.lessons = cb.checked ? [...new Set([...setup.lessons, i])] : setup.lessons.filter(x => x !== i); persist(); viewSetup();
  });
  const sa = app.querySelector('#selAll'), sn = app.querySelector('#selNone');
  if(sa){ sa.onclick = e => { e.preventDefault(); setup.lessons = BANK.map((_, i) => i); persist(); viewSetup(); };
          sn.onclick = e => { e.preventDefault(); setup.lessons = []; persist(); viewSetup(); }; }
  app.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { setup.type = b.dataset.type; persist(); viewSetup(); });
  app.querySelectorAll('[data-count]').forEach(b => b.onclick = () => { setup.count = b.dataset.count; persist(); viewSetup(); });
  app.querySelector('#start').onclick = () => isExam ? startExam() : startPractice(pool);
}

function startPractice(pool, label){
  let qs = shuffle(pool);
  if(!label && setup.count !== 'all') qs = qs.slice(0, +setup.count);
  run = {mode:'practice', qs: qs.map(prep), i: 0, label: label || 'Practice'};
  viewQuestion();
}
function startExam(){
  run = {mode:'exam', qs: examDraw().map(prep), i: 0, label: 'Timed exam', end: Date.now() + EXAM_MIN*60000, confirm: false};
  startTimer(); viewQuestion();
}

function startTimer(){
  stopTimer(); hdr.hidden = false;
  const tick = () => {
    if(!run || run.mode !== 'exam' || run.done){ stopTimer(); return; }
    const left = Math.round((run.end - Date.now())/1000);
    hdr.textContent = fmt(left) + ' left';
    hdr.classList.toggle('low', left <= 600);
    if(left <= 0){ finish(true); }
  };
  tick(); timerId = setInterval(tick, 1000);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

function viewQuestion(){
  const r = run, q = r.qs[r.i], n = r.qs.length, exam = r.mode === 'exam';
  const answered = q.pick !== null;
  const showFb = !exam && answered;
  const done = r.qs.filter(x => x.pick !== null).length;
  app.innerHTML = `
  <div class="stack">
    <div class="stack" style="gap:8px">
      <div class="bar"><p class="eyebrow" style="margin:0">${esc(r.label)} · Question ${r.i+1} of ${n}</p>
        <span class="muted" style="font-size:.9rem">${exam ? `${done} answered` : `${r.qs.filter(x => x.pick !== null && x.order[x.pick] === x.a).length} correct so far`}</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${(exam ? done : r.i + (answered?1:0))/n*100}%"></i></div>
    </div>
    <article class="panel stack">
      <div class="tags"><span class="tag">${esc(q.lesson)}</span><span class="tag ${q.type}">${q.type === 'def' ? 'Definition' : 'Scenario'}</span></div>
      <p class="csob"><span class="eyebrow" style="font-size:.7rem">CSOB</span><br>${esc(q.csob)}</p>
      <p class="qtext" id="qtext">${esc(q.q)}</p>
      <ul class="choices" role="list" aria-labelledby="qtext">
        ${q.order.map((oi, k) => {
          let cls = '';
          if(showFb){ if(oi === q.a) cls = 'right'; else if(k === q.pick) cls = 'wrong'; }
          else if(k === q.pick) cls = 'sel';
          return `<li><button class="choice ${cls}" data-k="${k}" ${showFb ? 'disabled' : ''} aria-pressed="${k === q.pick}"><span class="key">${KEYS[k]}</span><span>${esc(q.o[oi])}</span></button></li>`;
        }).join('')}
      </ul>
      ${showFb ? (() => { const ok = q.order[q.pick] === q.a; return `<div class="feedback ${ok ? 'ok' : 'no'}" role="status"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${ok ? '' : `The answer is ${KEYS[q.order.indexOf(q.a)]}. `}${esc(q.e)}</div>`; })() : ''}
      <div class="bar">
        <div class="row">
          ${exam ? `<button class="btn ghost" id="prev" ${r.i === 0 ? 'disabled' : ''}>Previous</button><button class="btn ghost" id="flag">${q.flag ? 'Unflag' : 'Flag for review'}</button>` : `<button class="btn ghost" id="quit">End session</button>`}
        </div>
        <div class="row">
          ${exam ? (r.i < n-1 ? `<button class="btn primary" id="next">Next</button>` : `<button class="btn primary" id="submit">Submit exam</button>`)
                 : `<button class="btn primary" id="next" ${answered ? '' : 'disabled'}>${r.i < n-1 ? 'Next question' : 'See results'}</button>`}
        </div>
      </div>
      ${exam && r.confirm ? confirmBox() : ''}
    </article>
    ${exam ? `<section class="panel stack"><div class="bar"><h3>Question map</h3><button class="btn link" id="submit2">Submit exam</button></div><div class="nav">${r.qs.map((x, i) => `<button data-go="${i}" class="${x.pick !== null ? 'ans' : ''} ${i === r.i ? 'cur' : ''} ${x.flag ? 'flag' : ''}" aria-label="Question ${i+1}${x.pick !== null ? ', answered' : ''}${x.flag ? ', flagged' : ''}">${i+1}</button>`).join('')}</div><p class="muted" style="font-size:.88rem">Shaded = answered · dot = flagged. You can change answers until you submit.</p></section>` : ''}
  </div>`;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if(!exam && q.pick !== null) return;
    q.pick = +b.dataset.k; viewQuestion();
  });
  const $ = s => app.querySelector(s);
  if($('#next')) $('#next').onclick = () => { if(r.i < n-1){ r.i++; r.confirm = false; viewQuestion(); window.scrollTo(0,0); } else finish(false); };
  if($('#prev')) $('#prev').onclick = () => { r.i--; r.confirm = false; viewQuestion(); };
  if($('#flag')) $('#flag').onclick = () => { q.flag = !q.flag; viewQuestion(); };
  if($('#quit')) $('#quit').onclick = () => { if(r.qs.some(x => x.pick !== null)) finish(false, true); else viewSetup(); };
  [$('#submit'), $('#submit2')].forEach(b => b && (b.onclick = () => { r.confirm = true; viewQuestion(); app.querySelector('.confirm').scrollIntoView({block:'center'}); }));
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { r.i = +b.dataset.go; r.confirm = false; viewQuestion(); });
  if($('#cancelSubmit')) $('#cancelSubmit').onclick = () => { r.confirm = false; viewQuestion(); };
  if($('#doSubmit')) $('#doSubmit').onclick = () => finish(false);
}
function confirmBox(){
  const r = run, un = r.qs.filter(x => x.pick === null).length, fl = r.qs.filter(x => x.flag).length;
  return `<div class="confirm" role="alertdialog" aria-label="Confirm submission"><p><b>Submit your exam?</b> ${un ? `${un} question${un>1?'s are':' is'} unanswered and will be marked wrong.` : 'All questions are answered.'}${fl ? ` ${fl} flagged for review.` : ''}</p><div class="row"><button class="btn primary" id="doSubmit">Submit and grade</button><button class="btn ghost" id="cancelSubmit">Keep working</button></div></div>`;
}

function finish(timeUp, early){
  const r = run; r.done = true; stopTimer();
  const used = r.mode === 'exam' ? Math.min(EXAM_MIN*60, Math.round((Date.now() - (r.end - EXAM_MIN*60000))/1000)) : null;
  const graded = early ? r.qs.filter(x => x.pick !== null) : r.qs;
  const right = graded.filter(x => x.pick !== null && x.order[x.pick] === x.a);
  const missed = graded.filter(x => !(x.pick !== null && x.order[x.pick] === x.a));
  const pct = graded.length ? Math.round(right.length/graded.length*100) : 0;
  const by = {};
  graded.forEach(x => { by[x.lesson] = by[x.lesson] || {n:0, c:0, li:x.li}; by[x.lesson].n++; if(x.pick !== null && x.order[x.pick] === x.a) by[x.lesson].c++; });
  const rows = Object.entries(by).sort((a, b) => (a[1].c/a[1].n) - (b[1].c/b[1].n));
  hdr.hidden = r.mode !== 'exam';
  if(r.mode === 'exam'){ hdr.textContent = timeUp ? 'Time expired' : 'Submitted'; hdr.classList.remove('low'); }
  if(r.mode === 'exam'){ const best = load('bestExam', 0); if(pct > best) save('bestExam', pct); }
  app.innerHTML = `
  <div class="stack">
    <section class="panel stack">
      <p class="eyebrow">Debrief · ${esc(r.label)}${timeUp ? ' · time expired, auto-submitted' : ''}</p>
      <div class="score"><span class="big">${pct}%</span><span>${right.length} of ${graded.length} correct${used !== null ? ` · ${fmt(used)} used` : ''}</span>${r.mode === 'exam' ? `<span class="pass ${pct >= 70 ? 'y' : 'n'}">${pct >= 70 ? 'Above 70%' : 'Below 70%'}</span>` : ''}</div>
      <div class="row">
        ${missed.length ? `<button class="btn primary" id="retry">Practice the ${missed.length} missed</button>` : ''}
        <button class="btn ghost" id="again">${r.mode === 'exam' ? 'New exam' : 'New session'}</button>
        <button class="btn ghost" id="home">Back to setup</button>
      </div>
    </section>
    <section class="panel stack"><h3>By lesson</h3>
      <div class="tablebox"><table class="byl"><thead><tr><th>Lesson</th><th class="num">Correct</th><th class="num">Score</th></tr></thead><tbody>
      ${rows.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="num">${v.c}/${v.n}</td><td class="num">${Math.round(v.c/v.n*100)}%</td></tr>`).join('')}
      </tbody></table></div>
    </section>
    ${missed.length ? `<section class="panel stack"><h3>Missed questions</h3>${missed.map(x => `
      <div class="miss"><div class="tags"><span class="tag">${esc(x.lesson)}</span><span class="tag ${x.type}">${x.type === 'def' ? 'Definition' : 'Scenario'}</span></div>
        <p style="font-weight:600">${esc(x.q)}</p>
        <p class="ans">${x.pick === null ? '<span class="n">Not answered</span>' : `Your answer: <span class="n">${esc(x.o[x.order[x.pick]])}</span>`}<br>Correct: <span class="y">${esc(x.o[x.a])}</span></p>
        <p class="muted" style="font-size:.95rem">${esc(x.e)}</p>
        <p class="csob">${esc(x.csob)}</p></div>`).join('')}</section>` : `<section class="panel"><p>Clean sweep. No missed questions.</p></section>`}
  </div>`;
  window.scrollTo(0,0);
  const $ = s => app.querySelector(s);
  if($('#retry')) $('#retry').onclick = () => startPractice(missed.map(x => ALL.find(a => a.id === x.id)), 'Missed-question review');
  $('#again').onclick = () => r.mode === 'exam' ? startExam() : startPractice(poolFor());
  $('#home').onclick = viewSetup;
}

// keyboard: A-D / 1-4 to answer, Enter for next
document.addEventListener('keydown', e => {
  if(!run || run.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  const k = e.key.toUpperCase(); let idx = KEYS.indexOf(k); if(idx < 0 && '1234'.includes(k) && k) idx = +k - 1;
  if(idx >= 0){ const b = app.querySelector(`.choice[data-k="${idx}"]`); if(b && !b.disabled){ b.click(); e.preventDefault(); } }
  else if(e.key === 'Enter'){ const n = app.querySelector('#next'); if(n && !n.disabled && document.activeElement?.tagName !== 'BUTTON'){ n.click(); e.preventDefault(); } }
});

viewSetup();
})();
</script>

</body>
</html>
