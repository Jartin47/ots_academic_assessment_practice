<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTS Academic Assessment Practice Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single briefing column (max ~760px) — a header strip, then one working panel that swaps between setup, question and debrief views. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#d5dbe6;
  --ink:#141b2d; --muted:#56607a; --navy:#1d2b5c; --navy-ink:#ffffff;
  --accent:#2f5bd3; --accent-soft:#e3eafc; --amber:#b86e00; --amber-soft:#fdf0db;
  --good:#1f7a4d; --good-soft:#e2f4ea; --bad:#b3261e; --bad-soft:#fbe5e3;
  --display:"Saira Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d31; --surface-2:#1b2339; --line:#2b3552;
  --ink:#e7ebf5; --muted:#9aa5c0; --navy:#22305f; --navy-ink:#ffffff;
  --accent:#7d9ff5; --accent-soft:#223060; --amber:#f0aa45; --amber-soft:#3a2b12;
  --good:#5ccf93; --good-soft:#163527; --bad:#ff8a80; --bad-soft:#3d1a1a; --on-accent:#0e1322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --surface-2:#1b2339; --line:#2b3552;
  --ink:#e7ebf5; --muted:#9aa5c0; --navy:#22305f; --navy-ink:#ffffff;
  --accent:#7d9ff5; --accent-soft:#223060; --amber:#f0aa45; --amber-soft:#3a2b12;
  --good:#5ccf93; --good-soft:#163527; --bad:#ff8a80; --bad-soft:#3d1a1a; --on-accent:#0e1322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
header.strip{background:var(--navy);color:var(--navy-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 16px}
.wrap{max-width:780px;margin:0 auto}
main.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.strip .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:.02em;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;opacity:.78;letter-spacing:0;margin-top:3px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:600;color:var(--muted);margin:0 0 6px}
h2{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
p{margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;color:var(--ink);font:inherit}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode strong{font-family:var(--display);font-size:1.15rem;font-weight:700}
.mode span{font-size:.92rem;color:var(--muted)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:8px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}
.lessons label{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;cursor:pointer;font-size:.97rem;min-width:0}
.lessons input{margin-top:5px;accent-color:var(--accent)}
.lessons .n{color:var(--muted);font-family:var(--mono);font-size:.78rem;margin-left:auto;padding-left:6px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.92rem;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 18px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.link{background:none;border:0;color:var(--accent);padding:4px 2px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.mode:focus-visible,.seg button:focus-visible,.choice:focus-visible,.nav button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.timer{font-family:var(--mono);font-weight:600;font-size:1.05rem;padding:4px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--display);font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.scn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.tag.def{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.csob{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.qtext{font-size:1.18rem;font-weight:600;line-height:1.45}
.choices{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .key{font-family:var(--mono);font-weight:600;font-size:.85rem;flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:5px;background:var(--surface);border:1px solid var(--line)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.feedback{border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2)}
.feedback.ok{border-color:var(--good)}
.feedback.no{border-color:var(--bad)}
.feedback b{font-family:var(--display);letter-spacing:.03em}
.feedback.ok b{color:var(--good)} .feedback.no b{color:var(--bad)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.nav button{font-family:var(--mono);font-size:.8rem;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;position:relative}
.nav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--ink);outline-offset:1px}
.nav button.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1}
.pass{font-family:var(--display);font-weight:600;padding:3px 10px;border-radius:4px}
.pass.y{background:var(--good-soft);color:var(--good)} .pass.n{background:var(--bad-soft);color:var(--bad)}
table.byl{width:100%;border-collapse:collapse;font-size:.95rem}
table.byl th,table.byl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
table.byl td.num,table.byl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablebox{overflow-x:auto}
.miss{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.miss .ans{font-size:.95rem}
.miss .ans .y{color:var(--good);font-weight:600} .miss .ans .n{color:var(--bad);font-weight:600}
.confirm{border:1.5px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fbmeta{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.note{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.95rem}
.tag.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.weak{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.weak li{display:flex;gap:12px;justify-content:space-between;align-items:baseline;font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:8px}
.weak .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
details summary{cursor:pointer;font-family:var(--display);font-weight:600;padding:4px 0}
details[open] summary{margin-bottom:8px}
.seg{flex-wrap:wrap}
[tabindex="-1"]:focus{outline:none}
footer{color:var(--muted);font-size:.85rem;margin-top:22px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:520px){.panel{padding:16px}.qtext{font-size:1.08rem}.score .big{font-size:2.6rem}}
</style>
</head>
<body>


<header class="strip">
  <div class="wrap">
    <h1 class="brand">OTS Academic Assessment Practice Test<small>Cognitive samples of behavior (CSOBs) · OTS student readers</small></h1>
    <span id="hdrInfo" class="timer" hidden></span>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
const BANK = [{"lesson": "What Is War", "csobs": [{"c": "Identify the three enduring truths that describe the fundamental nature of war.", "t": "def", "qs": [{"q": "Which set lists Clausewitz's three enduring truths about the nature of war?", "o": ["War is an instrument of policy; war is a complex and chaotic human endeavor; war is a clash of opposing wills", "War is a duel; war is a political act; war is a contest of technology", "War is governed by fog, friction, and chance in equal measure", "War is fought at the strategic, operational, and tactical levels"], "a": 0, "e": "The reader names three enduring truths: war is an instrument of policy, war is a complex and chaotic human endeavor, and war is a clash of opposing wills."}, {"q": "The enduring truth that war \"always starts from a political condition and political motive\" is which truth?", "o": ["War is a clash of opposing wills", "War is an instrument of policy", "War is a complex and chaotic human endeavor", "War is a duel on an extensive scale"], "a": 1, "e": "Enduring Truth #1: war is an instrument of policy. The original political motive must be the first and highest consideration in the conduct of war."}, {"q": "Which enduring truth describes war as waged against \"a living, calculating, and adaptive opponent\"?", "o": ["War is an instrument of policy", "War is a complex and chaotic human endeavor", "War is a clash of opposing wills", "War is an unchanging human activity"], "a": 2, "e": "Enduring Truth #3: war is a clash of opposing wills — always the shock of two hostile bodies in collision."}]}, {"c": "Identify the two basic themes of war.", "t": "def", "qs": [{"q": "According to Clausewitz, what are the two basic themes of war?", "o": ["Policy and violence", "Its nature and its character", "Traditional and irregular", "Ends and means"], "a": 1, "e": "The two basic themes of war are its nature (unchanging) and its character (constantly changing)."}, {"q": "Which term describes the aspect of war that is unchanging and a permanent part of the human condition?", "o": ["Character of war", "Form of war", "Nature of war", "Level of war"], "a": 2, "e": "The nature of war is unchanging: a human activity using violence, or the threat of it, to achieve a political objective."}, {"q": "The \"character of war\" refers to:", "o": ["The political objective that justifies the war", "How warfare is conducted", "The passion of the people", "The unchanging violent essence of war"], "a": 1, "e": "Character describes how warfare is conducted and is in constant flux — e.g., tanks and airplanes in WWI, drones in Russia-Ukraine."}]}, {"c": "List the three factors that dominate war.", "t": "def", "qs": [{"q": "What are the three factors that dominate war?", "o": ["Fog, friction, and chance", "Policy, violence, and will", "Diplomatic, informational, and military", "Mass, maneuver, and surprise"], "a": 0, "e": "Danger and human exertion create friction, leading to the factors that dominate war: fog, friction, and chance."}, {"q": "\"The accumulation of thousands of little things that force plans to go awry\" defines:", "o": ["Fog", "Chance", "Friction", "Clash of wills"], "a": 2, "e": "Friction is the accumulation of little things that force plans to go awry, as in Operation Barbarossa."}, {"q": "Which factor that dominates war is defined as \"the imperfect knowledge within warfare\"?", "o": ["Friction", "Fog", "Chance", "Character"], "a": 1, "e": "Fog is the imperfect knowledge within warfare — how hard it is to see and understand what is happening once battle starts."}]}, {"c": "Differentiate between the traditional and irregular forms of warfare.", "t": "scn", "qs": [{"q": "Two neighboring nation-states mobilize their armored divisions and air forces along a shared border. Each government's goal is to destroy the other's military in decisive battle and force its surrender. Combat is fought force-on-force between uniformed, conventional units. According to the lesson, which form of warfare does this conflict represent?", "o": ["Irregular warfare", "Traditional warfare", "Strategic deterrence", "Cognitive domain operations"], "a": 1, "e": "Traditional warfare is a violent struggle for domination between nation-states using force-on-force conventional capabilities to disarm the enemy (e.g., Austerlitz, 1805)."}, {"q": "An insurgent group knows it cannot defeat an occupying army in open battle. For years its fighters conduct small guerrilla raids, avoid large engagements, and work to win the support of the local population. The group's aim is to wear down the occupier's resources and will. According to the lesson, which form of warfare is the group waging?", "o": ["Traditional warfare", "Irregular warfare", "Strategic deterrence", "Decisive battle"], "a": 1, "e": "Irregular warfare is a violent struggle among state and non-state actors for legitimacy and influence over relevant populations, favoring indirect, asymmetric approaches — as the Mujahideen did against the Soviets."}, {"q": "A staff planner briefs the commander on a campaign against a much larger adversary. She explains that completely disarming the enemy is not possible, so the plan is to raise the price of the enemy's success until its political object is no longer worth the cost. The plan relies on indirect, asymmetric actions over a long period. According to the lesson, which form of warfare does her reasoning reflect?", "o": ["Irregular warfare", "Traditional warfare", "Strategic deterrence", "Decisive battle"], "a": 0, "e": "In irregular warfare, complete disarming is not always possible, so the goal is to raise the price of success through gradual exhaustion of the enemy's physical powers and will."}]}]}, {"lesson": "National Security", "csobs": [{"c": "Recognize how the US uses instruments of power to advance national interests.", "t": "def", "qs": [{"q": "What are the four instruments of national power?", "o": ["Diplomatic, Informational, Military, and Economic (DIME)", "Defense, Intelligence, Media, and Energy", "Diplomatic, Industrial, Military, and Executive", "Deterrence, Influence, Maneuver, and Engagement"], "a": 0, "e": "The instruments of national power are Diplomatic, Informational, Military, and Economic — DIME."}, {"q": "Trade policies, embargoes, tariffs, and fiscal and monetary policies are tools of which instrument of national power?", "o": ["Diplomatic", "Informational", "Military", "Economic"], "a": 3, "e": "The reader lists trade policies, fiscal and monetary policies, embargoes, tariffs, and assistance under the Economic instrument."}, {"q": "Which instrument of national power is described as \"fundamentally coercive in nature\"?", "o": ["Diplomatic", "Informational", "Military", "Economic"], "a": 2, "e": "The military instrument is coercive, generating effects through the application of force (including the threat of force)."}, {"q": "According to the reader, how should the instruments of national power be employed?", "o": ["In sequence, with the military instrument held back as a last resort", "Rarely, if ever, in isolation — they work best orchestrated together", "Separately, with each instrument matched to its own kind of problem", "Independently, so that one instrument's failure does not affect the others"], "a": 1, "e": "The instruments are interrelated and work best when used together in an orchestrated way; they should rarely, if ever, be used in isolation."}]}, {"c": "Recall the process for formulating US military strategy from national objectives.", "t": "def", "qs": [{"q": "In Lykke's strategy model, \"ends\" are:", "o": ["The resources used to accomplish objectives", "The objectives — \"what\" is to be accomplished", "The strategic concepts — \"how\" objectives are achieved", "The risks of the strategy"], "a": 1, "e": "Ends are the objectives that explain what is to be accomplished, expressed with verbs (e.g., deter war)."}, {"q": "In the ends-ways-means construct, \"ways\" are:", "o": ["The specific tangible resources such as forces and money", "The national interests", "The strategic concepts and courses of action that explain \"how\" the ends are accomplished", "The desired end state"], "a": 2, "e": "Ways are strategic concepts and courses of action — statements of \"how\" (e.g., containment, forward presence)."}, {"q": "Under the ends-ways-means construct described in the reader, the four instruments of national power are considered the:", "o": ["Ends", "Ways", "Means", "Risks"], "a": 2, "e": "National objectives are the ends, while the four instruments of power are the means, continuously evaluated and matched."}, {"q": "Who has ultimate responsibility for US national security policy and the integration of the instruments of national power?", "o": ["The Secretary of Defense", "The Chairman of the Joint Chiefs of Staff", "The President", "Congress"], "a": 2, "e": "The President has ultimate responsibility for national security policy; the National Security Strategy describes how the President plans to use the instruments of power."}]}]}, {"lesson": "US Constitution", "csobs": [{"c": "Recall the branch of government that establishes military authority.", "t": "def", "qs": [{"q": "Which branch of government does Article I, Section 8 empower to declare war and to raise and maintain armies and a navy?", "o": ["Executive branch (the President)", "Legislative branch (Congress)", "Judicial branch (the Supreme Court)", "The states, through their militias"], "a": 1, "e": "Article I establishes the Legislative Branch; Section 8 grants Congress war powers — to declare war, raise and maintain armies and a navy, and call forth the militia."}, {"q": "Article I, Section 8, Clause 11 gives Congress the power to:", "o": ["Serve as Commander in Chief of the armed forces", "Grant reprieves and pardons for federal offenses", "Declare war, grant letters of marque and reprisal", "Appoint ambassadors, judges, and other officers"], "a": 2, "e": "Clause 11: Congress shall have power to declare war, grant letters of marque and reprisal, and make rules concerning captures on land and water."}, {"q": "Which article of the Constitution establishes the Legislative Branch, which holds the bulk of enumerated powers over the armed forces?", "o": ["Article I", "Article II", "Article III", "Article IV"], "a": 0, "e": "Article I establishes Congress (Legislative Branch); Article II creates the Presidency; Article III forms the Judiciary."}]}, {"c": "List the three US Constitution governing principles.", "t": "def", "qs": [{"q": "Which three provisions does the reader's \"Three Provisions\" section name as basic to the Constitution?", "o": ["Enumerated powers, separation of powers, and federalism", "Life, liberty, and property", "Preamble, articles, and amendments", "Diplomatic, informational, and military"], "a": 0, "e": "The reader's \"Three Provisions\" section lists enumerated powers, separation of powers, and federalism."}, {"q": "The principle that the federal government \"does not have powers unless explicitly granted\" to it is:", "o": ["Federalism", "Separation of powers", "Enumerated powers", "Judicial review"], "a": 2, "e": "Enumerated powers limit the Federal Government — it has only the powers explicitly granted to the national government."}, {"q": "\"The division and sharing of power between the national and state governments\" defines:", "o": ["Separation of powers", "Federalism", "Enumerated powers", "Checks and balances"], "a": 1, "e": "Federalism divides and shares power between national and state governments; the Tenth Amendment embodies it."}, {"q": "The doctrine that vests legislative, executive, and judicial power in three separate, independent branches to prevent arbitrary government is:", "o": ["Federalism", "Enumerated powers", "Separation of powers", "Social contract"], "a": 2, "e": "Separation of powers: legislative power in Congress, executive in the President, judicial in the Supreme Court and lower courts."}, {"q": "According to the reader, which three governing principles of John Locke influenced the framers of the Constitution?", "o": ["Life, liberty, and property", "Equality, Natural Law, and the Social Contract", "Enumerated powers, separation of powers, and federalism", "Legislative, executive, and judicial power"], "a": 1, "e": "The reader's \"Origins of the Constitution\" section: John Locke's three governing principles of Equality, Natural Law, and the Social Contract, as well as his philosophy of natural rights (life, liberty, and property), became the intellectual cornerstone of American independence. Enumerated powers, separation of powers, and federalism are the reader's \"Three Provisions\"."}, {"q": "According to the reader, whose ideas on the separation of powers inspired the division of government into legislative, executive, and judicial branches?", "o": ["John Locke", "Jean-Jacques Rousseau", "Baron de Montesquieu", "James Madison"], "a": 2, "e": "Baron de Montesquieu's ideas on the separation of powers inspired the three branches. Locke contributed Equality, Natural Law, the Social Contract, and natural rights; Rousseau's social contract held that individuals exchange some freedoms for the protection of their rights."}]}, {"c": "Recall the Amendments to the US Constitution that govern military officer authority.", "t": "def", "qs": [{"q": "Which amendment prohibits quartering soldiers in any house in peacetime without the owner's consent?", "o": ["First Amendment", "Second Amendment", "Third Amendment", "Fifth Amendment"], "a": 2, "e": "The Third Amendment prevents the government from forcing homeowners to house soldiers, symbolizing civilian authority over the military."}, {"q": "Which amendment's Grand Jury Clause contains an exception for cases arising in the land or naval forces, making service members subject to court-martial?", "o": ["Fourth Amendment", "Fifth Amendment", "Sixth Amendment", "Eighth Amendment"], "a": 1, "e": "The Fifth Amendment's Grand Jury Clause excepts cases arising in the land or naval forces; members of the regular armed forces are subject to court-martial."}, {"q": "Which amendment guarantees freedom of speech, religion, press, assembly, and petition — balanced in the military with the need for good order and discipline?", "o": ["First Amendment", "Second Amendment", "Ninth Amendment", "Tenth Amendment"], "a": 0, "e": "The First Amendment; military members have more limited rights of public expression because they stand in a distinct relationship with the government."}]}]}, {"lesson": "Military Justice", "csobs": [{"c": "Identify the functions of the Uniform Code of Military Justice (UCMJ) and Manual for Courts-Martial (MCM).", "t": "def", "qs": [{"q": "A primary function of the UCMJ, passed by Congress on 5 May 1950, was to:", "o": ["Place courts-martial under the review of the federal district courts", "Consolidate the separate Army, Navy, and Coast Guard disciplinary codes", "Create the Department of the Air Force as a separate service", "Establish the Area Defense Counsel and Victims Counsel programs"], "a": 1, "e": "Congress passed the UCMJ to ensure uniform interpretation and application of military justice by consolidating the services' separate disciplinary systems."}, {"q": "The Manual for Courts-Martial (MCM) was put into effect by:", "o": ["An act of Congress passed alongside the UCMJ in 1950", "A Supreme Court ruling defining court-martial procedure", "An executive order of President Truman in 1951, giving it the full force and effect of law", "A directive from the first Secretary of the Air Force in 1947"], "a": 2, "e": "Congress gave the President authority to issue implementing instructions; Truman's 8 February 1951 executive order put the MCM into effect."}, {"q": "Which best describes the primary function of the MCM?", "o": ["To address military justice as thoroughly as possible as a working manual", "To consolidate the services' separate disciplinary codes into one law", "To prescribe the administrative discipline tools available to commanders", "To record the decisions of the military appellate courts as precedent"], "a": 0, "e": "The MCM contains the Constitution, UCMJ, court-martial authority and procedures, rules of evidence, and punitive articles with guides for writing charges."}]}, {"c": "Recognize the need for a military justice system.", "t": "def", "qs": [{"q": "Absent without leave (AWOL) is used in the reader as an example of which reason for a separate military justice system?", "o": ["Military justice worldwide", "Crimes unique to the military", "Right to counsel", "Search and seizure authority"], "a": 1, "e": "AWOL is a crime unique to the military — a civilian missing work commits no crime, but an AWOL member can endanger the mission and lives of others."}, {"q": "Why must the military justice system be worldwide in jurisdiction?", "o": ["Because military personnel deploy across state and national boundaries on short notice", "Because civilian courts refuse to hear cases involving the military", "Because the UCMJ applies to all US citizens living abroad", "Because NATO treaties require each member to keep courts-martial"], "a": 0, "e": "Commanders need a judicial system wherever units deploy; the UCMJ is worldwide in jurisdiction and applicable wherever members are stationed."}, {"q": "Which is the first argument in favor of a separate military justice system?", "o": ["Uniform punishments across the services", "Good order and discipline", "Speedier trials than civilian courts", "Protection of members' constitutional rights"], "a": 1, "e": "The first argument concerns good order and discipline, supported by crimes unique to the military, members' familiarity with military offenses, and worldwide jurisdiction."}]}, {"c": "List service members' rights within the military justice system.", "t": "def", "qs": [{"q": "Which UCMJ article advises military suspects of their right against self-incrimination?", "o": ["Article 15", "Article 31", "Article 32", "Article 92"], "a": 1, "e": "Article 31 sets out rights advisement for military suspects; the Fifth Amendment (Miranda) covers civilian suspects."}, {"q": "Which right does a member have when offered an Article 15?", "o": ["The right to have the commander recused", "The right to demand trial by court-martial in lieu of accepting the Article 15", "The right to a hearing before a civilian magistrate", "The right to have a military judge set the punishment"], "a": 1, "e": "A member may demand trial by court-martial instead of accepting the Article 15, and may consult the Area Defense Counsel first."}, {"q": "The right against self-incrimination does NOT apply to which of the following?", "o": ["Oral confessions", "Written statements", "Requests for voice or handwriting samples and bodily fluids", "Statements during interrogation as a suspect"], "a": 2, "e": "Per the reader, the right against self-incrimination does not apply to requests for voice or handwriting samples and bodily fluids."}, {"q": "Under the right to counsel, the Department of the Air Force provides free legal counsel through the:", "o": ["Staff Judge Advocate", "Area Defense Counsel", "Inspector General", "First Sergeant"], "a": 1, "e": "The DAF provides free counsel — the Area Defense Counsel — to all accused before courts-martial and those offered Article 15 punishment. Members may also hire civilian counsel at their own expense."}]}, {"c": "Identify the methods and associated tools available within the UCMJ to maintain discipline.", "t": "def", "qs": [{"q": "What are the three broad options available to commanders to maintain discipline when members do not comply with standards?", "o": ["Counseling, admonition, and reprimand", "Administrative tools, nonjudicial punishment, and judicial actions", "Summary, special, and general courts-martial", "UIFs, control rosters, and Article 15s"], "a": 1, "e": "The three broad options are administrative tools, nonjudicial punishment (Article 15), and judicial actions (courts-martial)."}, {"q": "Which administrative tool sets up an observation period for members whose duty performance is substandard, and limits reenlistment, promotion, and PCS eligibility?", "o": ["Unfavorable Information File", "Control roster", "Letter of Counseling", "Summary court-martial"], "a": 1, "e": "The control roster is an observation status — not a punishment — that gives members a chance to improve while limiting certain personnel actions."}, {"q": "Which type of court-martial tries the most serious offenses, requires an Article 32 pretrial hearing, and may impose punishment extending to death?", "o": ["Summary court-martial", "Special court-martial", "General court-martial", "Article 15 hearing"], "a": 2, "e": "The general court-martial tries the most serious offenses, is convened by a GCM Convening Authority, and requires an Article 32 hearing."}, {"q": "Which type of court-martial is for enlisted members only and normally consists of one officer?", "o": ["Summary court-martial", "Special court-martial", "General court-martial", "Article 32 hearing"], "a": 0, "e": "The summary court-martial tries minor offenses with one officer, and cannot be used to try officers."}]}, {"c": "Recall the functions of the Staff Judge Advocate, Area Defense Counsel, and the Victims Counsel.", "t": "def", "qs": [{"q": "Which legal office is the commander's legal staff and represents the Air Force and Space Force in all legal matters?", "o": ["Area Defense Counsel", "Victims Counsel", "Staff Judge Advocate", "Inspector General"], "a": 2, "e": "The SJA represents the Air Force and Space Force; its sections include military justice (prosecution), claims, and civil law."}, {"q": "The Area Defense Counsel (ADC) represents:", "o": ["The Air Force and Space Force in courts-martial", "Air Force and Space Force personnel accused of wrongdoing", "Victims of sexual assault and domestic violence", "The commander in administrative matters"], "a": 1, "e": "The ADC represents members accused of wrongdoing; its chain of command is separate from the SJA to avoid any perception of command influence."}, {"q": "The Victims Counsel (VC), started by the Air Force in 2012, advises:", "o": ["Commanders on Article 15 actions and administrative discipline", "Victims of alleged sexual assault and domestic violence", "Members filing claims against the government for damages", "Accused members preparing responses for a discharge board"], "a": 1, "e": "The VC advises victims of alleged sexual assault and domestic violence and represents them in certain court-martial matters; its chain is separate from the SJA."}]}]}, {"lesson": "What the DAF Brings to the Fight", "csobs": [{"c": "Recall the purpose of airpower and spacepower.", "t": "def", "qs": [{"q": "According to the lesson, airpower is:", "o": ["The ability to gain and maintain awareness anywhere in the world", "The ability to project military power through control and exploitation in, from, and through the air", "The ability to accomplish military objectives in, from, and to the space domain", "The ability to move personnel and equipment across the range of operations"], "a": 1, "e": "Lesson slides, \"The Role of Airpower\": airpower is the ability to project military power through control and exploitation in, from, and through the air."}, {"q": "According to the lesson, military spacepower is:", "o": ["The ability to accomplish military objectives in, from, and to the space domain", "The ability to project military power in, from, and through the air", "The ability to hold at risk or strike any target anywhere", "The ability to launch payloads to and from the space domain"], "a": 0, "e": "Lesson slides, \"The Role of Space Power\": military spacepower is the ability to accomplish military objectives in, from, and to the space domain."}, {"q": "The lesson says the employment of airpower is fundamentally different from other forms of military power. Which list reflects why?", "o": ["It goes over, not through; produces operational and strategic effects; strikes centers of gravity; wrests the initiative; sets the tempo", "It seizes and holds terrain; keeps a continuous presence; produces tactical effects; follows the ground force's tempo", "It goes through, not over; attrits fielded forces first; defends centers of gravity; reacts to the enemy's initiative", "It masses at the front line; produces mainly tactical effects; supports the scheme of maneuver; conserves tempo"], "a": 0, "e": "Lesson slides, \"The Role of Airpower\": over, not through; produce operational and strategic effects; strike centers of gravity (COG); wrest initiative from the enemy; set tempo."}, {"q": "Securing US national interests in space requires the ability to do which of the following?", "o": ["Establish permanent control of the space domain and deny access to every other nation", "Safely access, maneuver within, and exploit the space domain without prohibitive interference", "Deter attacks on satellites through terrestrial and cyberspace forces instead of space forces", "Limit military activity in the space domain to the protection of government-owned satellites"], "a": 1, "e": "Lesson slides, \"The Role of Space Power\": securing national interests in space requires safeguarding US commercial, civil, intelligence, and military entities' ability to safely access, maneuver within, and exploit the space domain without prohibitive interference."}]}, {"c": "Recall the five USAF core functions and four USSF core and enterprise functions.", "t": "def", "qs": [{"q": "Which list contains the five USAF core functions?", "o": ["Air Superiority, Global Precision Attack, Rapid Global Mobility, Global ISR, Command and Control", "Airlift, Air Refueling, Aeromedical Evacuation, Air Mobility Support, Space Support", "Space Control, Global Mission Operations, Space Access, Intelligence, Cyberspace", "Fires, Movement & Maneuver, Protection, Sustainment, Information"], "a": 0, "e": "AFDP 3-0 lists the five USAF core functions: Air Superiority, Global Precision Attack, Rapid Global Mobility, Global ISR, and Command and Control."}, {"q": "Which are the four USSF cross-cutting enterprise functions?", "o": ["Space control, global mission operations, space access, and spacelift", "Intelligence, cyberspace operations, command and control, and space domain awareness", "Orbital, electromagnetic, cyberspace, and navigation warfare", "Satellite communications, missile warning, sensing, and targeting"], "a": 1, "e": "The Space Force recognizes four enterprise functions: intelligence, cyberspace operations, command and control, and space domain awareness."}, {"q": "Which are the USSF core functions conducted in, from, and to the space domain?", "o": ["Air superiority, global strike, and mobility", "Space control, global mission operations, and space access", "Orbital segment, link segment, and terrestrial segment", "Prepare, ready, and commit"], "a": 1, "e": "The Space Force's core functions are space control, global mission operations, and space access; they are enabled by four enterprise functions."}]}, {"c": "Describe the purpose of each USAF core function and USSF core and enterprise function.", "t": "scn", "qs": [{"q": "Before a ground offensive begins, the joint force commander tasks Airmen to suppress enemy air defenses and sweep enemy fighters from the area. The goal is to let friendly forces maneuver without interference from enemy aircraft. Planners describe the effort as gaining freedom from attack and freedom to attack. According to the lesson, which USAF core function is being executed?", "o": ["Rapid Global Mobility", "Air Superiority", "Global ISR", "Command and Control"], "a": 1, "e": "Air Superiority's primary role is to achieve control of the air; offensive counterair includes SEAD, fighter escort, and fighter sweep."}, {"q": "During a contingency deployment, a KC-46 crew offloads fuel to a flight of fighters to extend their range. At the same time, a C-17 crew moves an Army brigade's equipment into the theater. A third crew flies wounded personnel to a higher level of medical care. According to the lesson, which USAF core function do these missions fall under?", "o": ["Global Precision Attack", "Air Superiority", "Rapid Global Mobility", "Global ISR"], "a": 2, "e": "Rapid Global Mobility includes airlift, air refueling, aeromedical evacuation, and air mobility support — it contributes to the joint function of movement and maneuver."}, {"q": "A Space Force unit is tasked to protect friendly satellites from attack. The same unit conducts electromagnetic warfare against an adversary's satellite links. Its objective is to contest and control the space domain so the joint force can operate. According to the lesson, which USSF core function is this unit performing?", "o": ["Space Access", "Global Mission Operations", "Space Control", "Space Domain Awareness"], "a": 2, "e": "Space control comprises activities to contest and control the space domain; its desired outcome is space superiority. Mission areas: orbital, electromagnetic, and cyberspace warfare."}, {"q": "A crew of Guardians detects a hostile missile launch from space-based sensors. They track its trajectory and send a timely warning to forces in theater. Commanders describe the support as delivering space effects that give the joint force a combat edge. According to the lesson, which USSF core function are the Guardians carrying out?", "o": ["Space Access", "Global Mission Operations", "Space Control", "Command and Control"], "a": 1, "e": "Global mission operations deliver space effects in support of military operations; missile warning and tracking is one of its five mission areas."}, {"q": "A Space Force squadron notices an unknown object maneuvering close to a US satellite. The crew works to detect, characterize, and attribute the object's activity and to predict what it will do next. Their findings are passed to commanders to inform decisions. According to the lesson, which USSF enterprise function is the squadron performing?", "o": ["Space Domain Awareness", "Intelligence", "Cyberspace Operations", "Command and Control"], "a": 0, "e": "Space domain awareness is the detection, characterization, attribution, prediction, and targeting of activities in the space domain to inform decision making."}]}, {"c": "Understand the role and purpose of doctrine to the USAF and USSF.", "t": "scn", "qs": [{"q": "A new lieutenant studies a doctrine publication before her first exercise. She asks her flight commander whether she must do exactly what the publication says in every situation. He tells her to know it well but to apply judgment to the circumstances in front of her. According to the lesson, which characteristic of doctrine is the flight commander describing?", "o": ["Directive, like policy", "Official advice, but not directive", "Personal opinion with no authority", "Binding only during wartime"], "a": 1, "e": "Doctrine is a guide to action, not fixed rules. It requires judgment in application; Airmen should be doctrinally sound, not doctrinally bound."}, {"q": "Planners from an airlift squadron and a fighter squadron are building a combined mission. They keep misreading each other's terms and assumptions about how forces should be organized and controlled. A senior officer hands both teams the same doctrine publication to work from. According to the lesson, which purpose of doctrine is the senior officer relying on?", "o": ["Setting directive rules that planners must follow", "Providing a common frame of reference and vocabulary", "Assigning forces and platforms to each mission", "Recording lessons learned from past operations"], "a": 1, "e": "A Primer on Doctrine: doctrine establishes a common frame of reference, including intellectual tools commanders use to solve military problems, and provides common terminology that conveys precision in expressing ideas."}, {"q": "A staff officer briefs a new set of rules of engagement issued for an operation. He tells the audience, \"This is now our doctrine.\" A colleague corrects him, noting that the rules are directive and may change as leadership or political conditions change. According to the lesson's readings, what are rules of engagement an example of?", "o": ["Basic doctrine", "Policy", "Tactical doctrine", "Strategy"], "a": 1, "e": "The primer distinguishes doctrine from policy: policy is directive and changes with leadership, politics, or budgets; ROE are an example of policy."}]}]}, {"lesson": "How the DAF Deploys", "csobs": [{"c": "Identify the purpose of the AFFORGEN and SPAFORGEN.", "t": "def", "qs": [{"q": "What is the Air Force Force Generation (AFFORGEN) model?", "o": ["The Air Force's sustainable, capacity-driven model for presenting forces to Joint Force Commanders", "The Air Force's process for assigning permanent duty stations and PCS moves", "The Air Force's schedule for professional military education", "The Air Force's operational scheme of maneuver for dispersing aircraft"], "a": 0, "e": "Lesson slides, \"AFFORGEN Defined\": the Air Force's sustainable, capacity-driven model for presenting forces to Joint Force Commanders, modeled to counter long-term strategic competition. (The scheme of maneuver is ACE — and ACE is not AFFORGEN.)"}, {"q": "Which statement describes a purpose of the Space Force Generation (SPAFORGEN) model?", "o": ["It manages the acquisition and fielding of new satellites, ground systems, and launch vehicles for the service", "It sets a predictable, standardized battle rhythm so forces are trained and ready to sustain capabilities and respond to crises", "It assigns Guardians to Air Force wings so that space forces deploy on the same rotation as Airmen", "It transfers day-to-day control of space forces from the combatant commands back to the Space Force"], "a": 1, "e": "Lesson slides: SPAFORGEN establishes a predictable, standardized battle rhythm ensuring forces are properly trained and ready, and better articulates risk, capacity, and readiness data to combatant commanders."}, {"q": "Why did the Air Force move from the AEF construct to AFFORGEN?", "o": ["The AEF lacked an easily understood model showing all facets of airpower and readiness impacts", "The AEF was too expensive to run alongside modernization programs", "Congress directed the Air Force to end rotational deployments", "The AEF applied only to the Space Force and not to Airmen"], "a": 0, "e": "Gen Brown said the AEF lacked an easily understood model; a 2018 review found airpower use had outpaced force generation for 18 years."}, {"q": "Why does the Space Force need its own force generation model instead of the older joint process?", "o": ["Space forces are primarily employed in place, while older models were built around physically deployable forces", "Space forces deploy more often than other forces, so the older models could not keep pace with them", "Space forces are not presented to combatant commands, so the joint models did not apply to them", "Space forces are too few to rotate, so the older models left them no time for advanced training"], "a": 0, "e": "Lesson slides, \"Need for Space-Specific Model\": the military's pre-existing force generation processes were built around physically deployable forces; space forces are primarily employed in place."}, {"q": "AFFORGEN is based on which three principles?", "o": ["Readiness, predictability, and sustainability", "Flexibility, versatility, and persistence", "Global vigilance, reach, and power", "Preparation, certification, and commitment"], "a": 0, "e": "Lesson slides, \"AFFORGEN Defined: 5Ws and H\": AFFORGEN works on three principles — readiness, predictability, sustainability."}]}, {"c": "Cite the four rotational phases of readiness in the AFFORGEN cycle and the three phases of the SPAFORGEN cycles.", "t": "def", "qs": [{"q": "What are the four readiness phases of the AFFORGEN cycle?", "o": ["Reset, Prepare, Ready, Commit", "Prepare, Ready, Commit, Recover", "Unfreeze, Change, Refreeze, Sustain", "Forming, Storming, Norming, Performing"], "a": 0, "e": "Lesson slides, \"AFFORGEN Details: Readiness Phases\": Reset, Prepare, Ready, Commit. (The assigned af.mil article calls the last phase \"Available to Commit.\")"}, {"q": "What are the three phases of the SPAFORGEN cycle?", "o": ["Reset, Prepare, Ready", "Prepare, Ready, Commit", "Plan, Prepare, Execute", "Train, Certify, Deploy"], "a": 1, "e": "Lesson slides, \"SPAFORGEN cycle\": Prepare (reconstitution, leave, individual and qualification training, PME), Ready (advanced training, exercises, validations), and Commit (fully resourced, validated, and assigned to an operational mission)."}, {"q": "In AFFORGEN, which phase is described as \"Reconnect, Reconstitute, Reintegrate\"?", "o": ["Reset", "Prepare", "Ready", "Commit"], "a": 0, "e": "Lesson slides: Reset — reconnect, reconstitute, reintegrate. Prepare builds toward peak unit readiness; Ready holds certifying events; Commit is deployed/ready."}, {"q": "How long is the AFFORGEN cycle?", "o": ["12 months of three 4-month phases", "24 months of four 6-month phases", "36 months of three 12-month phases", "18 months of six 3-month phases"], "a": 1, "e": "AFFORGEN runs on a 24-month cycle divided into four six-month readiness phases."}, {"q": "In SPAFORGEN, during which phase do force elements conduct advanced training, small and large force exercises, and squadron-level validations?", "o": ["Prepare", "Ready", "Commit", "Reset"], "a": 1, "e": "Lesson slides, \"SPAFORGEN cycle\": the Ready phase covers advanced training, small and large force employment exercises, and squadron-level validations."}]}, {"c": "Recall the importance of readiness on mission accomplishment.", "t": "def", "qs": [{"q": "How does the lesson define readiness?", "o": ["The ability to fulfill the requirements of the mission", "The number of personnel available to deploy", "The completion of all annual training requirements", "The time a unit spends in the Commit phase"], "a": 0, "e": "Lesson slides, \"Importance of Readiness\": readiness is the ability to fulfill requirements of the mission."}, {"q": "What did the Air Force's 2018 readiness deep dive find?", "o": ["Force generation had outpaced the use of airpower for 18 years", "The use of airpower had outpaced force generation for the past 18 years", "Readiness across the force was at an all-time high", "The AEF construct should be expanded to the Space Force"], "a": 1, "e": "The 2018 review found airpower use had outpaced force generation for 18 years, driving the shift to a model that balances short- and long-term readiness."}, {"q": "In AFFORGEN, which phase is marked by certifying events?", "o": ["Reset", "Prepare", "Ready", "Commit"], "a": 2, "e": "Lesson slides, \"AFFORGEN Details: Readiness Phases\": Ready — certifying events."}, {"q": "According to the lesson, which list describes how an individual Airman or Guardian maintains readiness?", "o": ["Training, medical readiness, physical fitness, personal affairs, and mental preparedness", "Upgrade training, certifying events, and large force exercises", "Reconnecting, reconstituting, and reintegrating after a deployment", "Mission planning, resourcing, and presenting forces to commanders"], "a": 0, "e": "Lesson slides, \"Your Role as an Airman or Guardian\": maintain readiness through training, medical readiness, physical fitness, personal affairs, and mental preparedness; know and plan around your deployment eligibility window."}, {"q": "According to the lesson, what is a leader's or supervisor's role in readiness?", "o": ["Monitor each member's readiness items and report shortfalls up the chain of command", "Instill a culture where readiness is a priority and give people the resources they need to be ready", "Schedule readiness training in the Prepare phase and certify it during the Ready phase", "Hold members personally accountable for readiness and document those who fall short"], "a": 1, "e": "Lesson slides, \"Your Role as a Leader & Supervisor\": ensure your people understand the importance of readiness, instill a culture where readiness is a priority, and give them the resources they need to be ready."}]}]}, {"lesson": "Principles of Joint Operations and Tenets of Airpower", "csobs": [{"c": "Discuss the Principles of Joint Operations.", "t": "scn", "qs": [{"q": "A joint force commander has fewer aircraft than her adversary. She does not spread them evenly across the theater. She concentrates the effects of her combat power at the most advantageous place and time and achieves a decisive result. According to the lesson, which principle of joint operations is she applying?", "o": ["Mass", "Maneuver", "Offensive", "Surprise"], "a": 0, "e": "Mass concentrates the effects of combat power (not necessarily the forces themselves) at the most advantageous place and time, which lets even numerically inferior forces achieve decisive results."}, {"q": "A commander has one primary effort and two secondary efforts. He gives the secondary efforts only the minimum essential combat power. Everything he saves goes to the primary effort. According to the lesson, which principle of joint operations is he applying?", "o": ["Mass", "Economy of Force", "Simplicity", "Objective"], "a": 1, "e": "Economy of force spends minimum essential combat power on secondary efforts so the maximum possible goes to primary efforts."}, {"q": "An operation includes forces from several nations along with civilian agencies. No single commander can be given authority over all of them. The partners agree to coordinate their resources toward the same goal. According to the lesson, which principle becomes paramount in this situation?", "o": ["Unity of Command", "Unity of Effort", "Legitimacy", "Perseverance"], "a": 1, "e": "Unity of command means one responsible commander for every objective. With multinational and interagency partners, where that may not be possible, unity of effort is paramount."}, {"q": "A force attacks at a time and place the enemy has not prepared for. The enemy cannot react in time. The attacker achieves success out of proportion to the effort expended. According to the lesson, which principle of joint operations does this describe?", "o": ["Offensive", "Security", "Surprise", "Maneuver"], "a": 2, "e": "Surprise strikes at a time, place, or manner for which the enemy is unprepared and yields success out of proportion to the effort expended."}, {"q": "A commander on a stability operation writes rules that prevent the excessive use of force. She weighs the need for security and military necessity against the pursuit of the operation's objectives. According to the lesson, which additional principle of joint operations is she applying?", "o": ["Restraint", "Perseverance", "Legitimacy", "Security"], "a": 0, "e": "Restraint prevents excessive use of force by balancing security, military necessity, and pursuit of the objectives. It is one of the three additional joint principles, with perseverance and legitimacy."}, {"q": "A commander refuses to wait for the enemy to act. He directs operations that seize, retain, and exploit the initiative. He describes this as the most effective and decisive way to achieve his goal. According to the lesson, which principle of joint operations is he applying?", "o": ["Objective", "Offensive", "Maneuver", "Mass"], "a": 1, "e": "Offensive means seizing, retaining, and exploiting the initiative. The reader calls it the most effective and decisive way to achieve an objective at all levels of warfare."}]}, {"c": "Summarize the Tenets of Airpower.", "t": "scn", "qs": [{"q": "An air component commander keeps responsibility for planning, directing, and coordinating air operations. Planning and coordination are delegated to subordinate echelons at dispersed locations. Front-line crews receive mission-type orders and are trusted to act on the commander's intent. According to the lesson, which tenet of airpower does this describe?", "o": ["Mission Command", "Balance", "Priority", "Synergistic Effects"], "a": 0, "e": "Mission command is an approach to C2 that empowers subordinate decision-making. Airmen execute it through centralized command, distributed control, and decentralized execution."}, {"q": "Aircraft return to the same set of targets day after day. They never occupy the terrain. The repeated visits keep the adversary from regaining the initiative. According to the lesson, which tenet of airpower does this describe?", "o": ["Concentration", "Persistence", "Priority", "Flexibility and Versatility"], "a": 1, "e": "Persistence: airpower can visit and revisit targets continuously without occupying terrain, which denies the adversary the initiative."}, {"q": "Requests for air support far exceed the aircraft available. The air component commander cannot satisfy everyone. She sends airpower where it will contribute most to the joint force commander's most critical objectives. According to the lesson, which tenet of airpower is she applying?", "o": ["Balance", "Persistence", "Priority", "Synergistic Effects"], "a": 2, "e": "Priority: because resources are limited, airpower goes where it contributes most to the most critical JFC objectives."}, {"q": "In one week, the same wing shifts quickly from one mission set to another as the joint force commander's objectives change. Its aircraft are employed effectively at the strategic, operational, and tactical levels. According to the lesson, which tenet of airpower does this describe?", "o": ["Flexibility and Versatility", "Synergistic Effects", "Mission Command", "Concentration"], "a": 0, "e": "Flexibility is shifting quickly between mission sets and JFC objectives. Versatility is employing airpower effectively at the strategic, operational, and tactical levels."}, {"q": "Before approving a strike, an air component commander weighs opportunity, necessity, effectiveness, and efficiency. He sets all of them against the risk to friendly forces. According to the lesson, which tenet of airpower is he applying?", "o": ["Priority", "Balance", "Concentration", "Mission Command"], "a": 1, "e": "Balance: the air component commander weighs opportunity, necessity, effectiveness, and efficiency against the risk to friendly forces."}, {"q": "High demand tempts a commander to parcel his aircraft out in small numbers across the theater. He refuses to dilute them. He focuses overwhelming power at the decisive time and place. According to the lesson, which tenet of airpower is he applying?", "o": ["Persistence", "Synergistic Effects", "Flexibility and Versatility", "Concentration"], "a": 3, "e": "Concentration focuses overwhelming power at the decisive time and place and guards against diluting airpower because of high demand."}]}, {"c": "Describe how the Tenets of Airpower complement the Principles of Joint Operations.", "t": "scn", "qs": [{"q": "A student asks why Airmen study two lists, the principles of joint operations and the tenets of airpower. Her instructor says the lists do not compete. One gives general guidance on applying military force, and the other gives more specific considerations. According to the lesson, how do the tenets relate to the principles?", "o": ["The tenets refine the principles' general guidance for employing airpower", "The tenets replace the principles whenever airpower is the main effort", "The tenets guide tactical actions, and the principles guide strategy", "The tenets apply to Airmen, and the principles apply to the other services"], "a": 0, "e": "The principles give general guidance on applying military force; the tenets give more specific considerations for employing airpower."}, {"q": "One air commander holds authority over all of the theater's airpower. Because of this, she can concentrate effects at the decisive point. She can also commit only the minimum needed to secondary efforts. According to the lesson, which two principles does centralized command enable?", "o": ["Mass and economy of force", "Surprise and security", "Objective and simplicity", "Maneuver and offensive"], "a": 0, "e": "The reader states that centralized command enables mass while maintaining economy of force."}, {"q": "During a campaign, airpower transitions quickly from one mission to another. Each shift places effects where they are needed and keeps the enemy off balance. An instructor says this tenet lets airpower exploit two principles at the same time. According to the lesson, which two principles does flexibility let airpower exploit?", "o": ["Security and surprise", "Mass and maneuver", "Objective and offensive", "Unity of command and simplicity"], "a": 1, "e": "The reader states that flexibility lets airpower transition between missions while exploiting mass and maneuver."}, {"q": "A commander finds that guidance pulls in different directions: mass against economy of force, and concentration against balance. No two operations she has led were identical. She must still bring Air Force capabilities together. According to the lesson, how does a commander resolve these competing demands?", "o": ["By applying the principles first and the tenets second", "By following the order in which doctrine lists them", "By applying professional judgment and experience", "By deferring to the joint force commander's staff"], "a": 2, "e": "The principles and tenets create competing demands, and no two operations are identical, so commanders apply professional judgment and experience to balance them for synergistic effects."}]}]}, {"lesson": "Change Management", "csobs": [{"c": "Recognize Lewin's Change Management Model.", "t": "def", "qs": [{"q": "What are the three stages of Kurt Lewin's change process?", "o": ["Plan, Do, Check", "Unfreezing, Changing, Refreezing", "Forming, Storming, Norming", "Observe, Orient, Act"], "a": 1, "e": "AFH 1 13.11: Lewin's three-stage process is unfreezing, changing, and refreezing."}, {"q": "In Lewin's model, \"refreezing\" means:", "o": ["Preparing people for change by creating a felt need", "Modifying technology, tasks, structure, or people", "Locking in the desired outcomes and new norms so they become permanent", "Stopping the change if resistance occurs"], "a": 2, "e": "Refreezing locks in new norms; positive reinforcement and rewarding aligned behavior help freeze the change in place."}, {"q": "According to AFH 1, the most neglected yet essential part of unfreezing is:", "o": ["Installing new equipment and restructuring work centers", "Creating an environment where people feel the need for change", "Rewarding people who adopt the change early", "Using coercion to gain compliance quickly"], "a": 1, "e": "The most neglected, yet essential, part of unfreezing is creating an environment where people feel the need for change."}]}, {"c": "Identify common resistance to change.", "t": "def", "qs": [{"q": "Which response to change involves fear of the unknown and concern about job security?", "o": ["Distrust", "Uncertainty", "Self-interest", "Over-determination"], "a": 1, "e": "Uncertainty: people may fear the unknown or see change as a threat to organizational stability and job security."}, {"q": "Which common response to change describes a rigid, mechanistic organizational structure that inhibits change?", "o": ["Different perception/no felt need to change", "Self-interest", "Over-determination", "Distrust"], "a": 2, "e": "Over-determination: organizational structure itself, such as strict procedures and lines of authority, can become a barrier to change."}, {"q": "Which list contains the five common responses to change in AFH 1?", "o": ["Distrust, uncertainty, self-interest, different perception/no felt need, over-determination", "Denial, anger, bargaining, depression, acceptance", "Avoiding, accommodating, competing, compromising, collaborating", "Education, participation, facilitation, negotiation, coercion"], "a": 0, "e": "AFH 1 13.9 lists distrust, uncertainty, self-interest, different perception/no felt need to change, and over-determination."}]}, {"c": "List the methods leaders use to reduce and manage resistance to change.", "t": "def", "qs": [{"q": "Which list names the methods AFH 1 gives for reducing perceived resistance to change?", "o": ["Education and communication; participation and involvement; facilitation and support; negotiation and agreement; coercion", "Unfreezing; changing; refreezing; evaluating; reinforcing results", "Lean; Six Sigma; business process reengineering; Theory of Constraints", "Counseling; admonition; reprimand; control roster; unfavorable information file"], "a": 0, "e": "AFH 1 13.10 lists education and communication, participation and involvement, facilitation and support, negotiation and agreement, and coercion."}, {"q": "Which method of reducing resistance AFH 1 says is NOT recommended because it can cause long-term negative consequences?", "o": ["Participation and involvement", "Facilitation and support", "Coercion", "Education and communication"], "a": 2, "e": "Coercion forces acceptance, can damage attitudes, and requires constant leadership oversight; coerced compliance is not recommended."}, {"q": "Involving those affected in designing and implementing the change to generate ownership and commitment describes which method?", "o": ["Negotiation and agreement", "Participation and involvement", "Facilitation and support", "Coercion"], "a": 1, "e": "Participation and involvement reduces resistance by actively involving those affected, generating ownership and commitment."}]}]}, {"lesson": "Team Building", "csobs": [{"c": "Remember the four stages of team growth.", "t": "def", "qs": [{"q": "What are the four stages of team building in AFH 1?", "o": ["Forming, storming, norming, performing", "Unfreezing, changing, refreezing, sustaining", "Prepare, ready, commit, reset", "Observe, orient, decide, act"], "a": 0, "e": "AFH 1 14.2: the four stages most often experienced by teams are forming, storming, norming, and performing."}, {"q": "Which stage is \"the initial period of uncertainty in which individuals try to determine their place on a team\"?", "o": ["Forming", "Storming", "Norming", "Performing"], "a": 0, "e": "Forming is the transition from individual to member status, when members cautiously explore boundaries and a leader's guidance may be tested."}, {"q": "In which stage do members establish cohesiveness and commitment, accept team ground rules, and become more cooperative?", "o": ["Forming", "Storming", "Norming", "Performing"], "a": 2, "e": "In norming, members reconcile competing loyalties, accept norms and roles, and emotional conflict is reduced."}, {"q": "Which stage does AFH 1 call \"probably the most difficult,\" when conflicts arise and members resist the team's influence?", "o": ["Forming", "Storming", "Norming", "Performing"], "a": 1, "e": "Storming is probably the most difficult stage, as members realize the task is harder than expected and argue about what to do."}]}, {"c": "Describe leader and follower actions that contribute to effective teams.", "t": "scn", "qs": [{"q": "A captain is placed in charge of a newly created project team. The members are polite but unsure of the team's purpose and how it fits into the squadron. She takes clear charge, runs structured meetings, and sets expectations to make the mission compelling. According to the lesson, which leader role is the captain filling?", "o": ["The Director", "The Coach", "The Collaborator", "The Visionary"], "a": 0, "e": "In forming, the leader is \"the Director\" — giving clear direction, structure, and a compelling mission to earn buy-in."}, {"q": "A project team has begun to experience friction. Two members argue openly about how to approach the task, and others voice frustration with the team's leadership. The team lead listens with empathy, gives members space to raise concerns, and teaches them how to work as a team while keeping final authority. According to the lesson, which leader role is the team lead filling?", "o": ["The Director", "The Coach", "The Collaborator", "The Visionary"], "a": 1, "e": "This is storming. The leader is \"the Coach,\" controlling chaos while listening and teaching members how to function as a team."}, {"q": "A long-standing team is high-functioning and its members trust one another. They welcome constructive criticism and manage most of their own work. Their leader now spends her time looking at outside trends, developing future leaders within the team, and promoting continual improvement. According to the lesson, which leader role is she filling?", "o": ["The Director", "The Coach", "The Collaborator", "The Visionary"], "a": 3, "e": "In performing, the leader is \"the Visionary\" — focusing on external factors, growing leaders, and sustaining improvement."}, {"q": "A team has moved past its early conflicts. Members are solidifying behind the team's goals, and the work is becoming more streamlined. The team lead eases her control, delegates responsibilities, and brings members into problem-solving and higher-level decisions. According to the lesson, which leader role is she filling?", "o": ["The Director", "The Coach", "The Collaborator", "The Visionary"], "a": 2, "e": "In norming, the leader is \"the Collaborator\" — letting off the reins, delegating responsibilities, building members' confidence, and involving the team in problem-solving, conflict resolution, and high-level decisions."},{"q": "A team member keeps trying to outshine his teammates to gain extra credit from the commander. His behavior creates unhelpful competition and hints at a power struggle within the team. The team lead meets with the group and restates each member's specific duties. According to the lesson, which leader action is the team lead taking to restore cooperation?", "o": ["Rewarding the high performer publicly", "Reemphasizing roles and responsibilities", "Removing the member from the team", "Avoiding the issue to protect morale"], "a": 1, "e": "AFH 1 says \"all-starring\" behavior may signal a power struggle; leaders should reemphasize roles and responsibilities to remove barriers to cooperation."}, {"q": "A staff sergeant disagrees with her team's plan. Instead of complaining to coworkers outside the team, she raises her concerns directly with the right people during the team meeting. She says the same thing inside the group that she says outside of it. According to the lesson, which element of a healthy team is she strengthening through her actions?", "o": ["Trust", "Cohesiveness", "Role clarity", "Shared leadership"], "a": 0, "e": "AFH 1 (Zoglio): nothing reduces trust faster than saying one thing inside the group and another outside; direct communication enhances trust, which is at the core of healthy teams."}]}]}, {"lesson": "Conflict Management", "csobs": [{"c": "Describe sources of conflict (factors).", "t": "scn", "qs": [{"q": "A squadron changes its duty schedule, but the email announcing the change reaches only some of the members. Several people act on the outdated schedule, and two flights end up blaming each other for a missed tasking. The information each side had was incomplete and misinterpreted. According to the lesson, which source of conflict is most evident?", "o": ["Structural Factors", "Communication Factors", "Personal Behavior Factors", "Distributive Factors"], "a": 1, "e": "AFH 1 14.4: communication factors — the crux is usually miscommunication; misinterpreted, inaccurate, or incomplete information leads to frustration and stress."}, {"q": "A squadron has grown quickly over the past year. Three sections now compete for the same few vehicles and a limited budget. Tension is also rising between the line personnel and the staff. According to the lesson, which source of conflict does this situation represent?", "o": ["Communication Factors", "Structural Factors", "Personal Behavior Factors", "Integrative Factors"], "a": 1, "e": "Structural factors include organization size, scarce or high-demand resources, and line-staff distinctions."}, {"q": "Two NCOs in the same work center constantly disagree about how the work should be prioritized. They have received the same information and have the resources they need. Their disputes come from differences in their goals, values, perceptions, and personalities. According to the lesson, which source of conflict does this represent?", "o": ["Structural Factors", "Personal Behavior Factors", "Communication Factors", "Distributive Factors"], "a": 1, "e": "Personal behavior factors arise from differences in goals, perceptions, values, and personalities. Aligning personal values with Air Force values reduces conflict."}]}, {"c": "Distinguish between distributive and integrative approaches to negotiations.", "t": "scn", "qs": [{"q": "Two squadron commanders must divide a fixed number of training range slots. Each argues that any slot gained by the other squadron is a slot lost to his own. Both hold back information, and the talks grow competitive and distrustful. According to the lesson, which approach to negotiation are the commanders using?", "o": ["Integrative Negotiation", "Distributive Negotiation", "Interest-Based Negotiation", "Cooperative Negotiation"], "a": 1, "e": "Distributive negotiation assumes limited, fixed resources — a zero-sum game where competition guides the talks and distrust can result."}, {"q": "Two section chiefs both request more time on a training range. As they talk, they learn that one needs the range in the morning and the other needs it only at night. Both end up with more time than they first asked for, and their working relationship improves. According to the lesson, which approach to negotiation does this outcome reflect?", "o": ["Distributive Negotiation", "Integrative Negotiation", "Positional Negotiation", "Zero-Sum Negotiation"], "a": 1, "e": "Integrative negotiation does not see resources as necessarily fixed, allowing mutually beneficial cooperation that also protects relationships."}, {"q": "A contracting officer prepares for talks with a long-term partner unit. She assumes the resources are not fixed and looks for options that benefit both sides. She also wants to protect the relationship for future work together. According to the lesson, which approach to negotiation is she planning to use?", "o": ["Distributive Negotiation", "Integrative Negotiation", "Positional Negotiation", "Zero-Sum Negotiation"], "a": 1, "e": "Integrative still involves value claiming at some point, but it is not necessarily zero-sum. Military negotiators use it to achieve solutions and protect relationships."}]}, {"c": "Infer which problem solving approach to use to best manage conflict in a given scenario.", "t": "scn", "qs": [{"q": "An aircraft declares an emergency during a night sortie. The senior officer on duty has clear authority over the response, time is critical, and the outcome matters far more than anyone's feelings. He gives direct orders and expects immediate compliance. According to the lesson, which approach to managing conflict is he using?", "o": ["Evade", "Comply", "Insist", "Settle"], "a": 2, "e": "Insist fits when the task is very important, you have the power to ensure compliance, and time is short — e.g., a crisis. It is not usually right for durable long-term solutions."}, {"q": "A captain is asked by a peer from another unit to change a minor formatting standard on a shared product. The change matters very little to her. She values the relationship and wants to build a stronger working partnership, so she agrees to do it the peer's way. According to the lesson, which approach to managing conflict is she using?", "o": ["Insist", "Comply", "Evade", "Settle"], "a": 1, "e": "Comply fits when the task is not very important (or less important than rapport) and you want to sustain or improve the relationship. \"Yes, absolutely, let's do it your way!\""}, {"q": "Two partner units face a very important issue that affects both of their missions. The units trust each other and freely share information. Their leaders want a lasting solution and a stronger relationship, so they work together and share power in reaching the decision. According to the lesson, which approach to managing conflict are they using?", "o": ["Settle", "Insist", "Cooperative Negotiation (IBN)", "Evade"], "a": 2, "e": "IBN fits when the task is very important, the relationship matters, trust exists or should be built, information is shared, and power is shared (\"power with\")."}, {"q": "Two flight chiefs disagree over a somewhat important issue that must be resolved today. Power is about evenly split between them, and trust is neither strong nor weak. They agree to split the difference and move on. According to the lesson, which approach to managing conflict are they using?", "o": ["Settle", "Comply", "Insist", "Cooperative Negotiation (IBN)"], "a": 0, "e": "Settle is quicker and efficient but rarely optimal — \"Let's just split the difference and call it a day.\""}, {"q": "A coworker raises a minor disagreement with a lieutenant. The lieutenant has no strong interest in the issue and no need to build the relationship. He also wants more information before engaging, so he asks the coworker to come back later. According to the lesson, which approach to managing conflict is he using?", "o": ["Insist", "Evade", "Comply", "Settle"], "a": 1, "e": "Evade is passive and unassertive; it can be appropriate when the task is unimportant or when delay lets you gather information. \"Not now, can you come back later?\""}]}]}, {"lesson": "USAF and USSF Core Values", "csobs": [{"c": "Explain how the virtues relate to the USAF and USSF Core Values.", "t": "scn", "qs": [{"q": "A maintainer discovers that her own error caused a delayed launch. No one else noticed the mistake. She reports it to her supervisor anyway, takes ownership of her actions, and asks for honest feedback. According to the lesson, which core value and virtue is she demonstrating?", "o": ["Service Before Self: Loyalty", "Integrity First: Accountability", "Excellence In All We Do: Teamwork", "Service Before Self: Respect"], "a": 1, "e": "Accountability is a virtue of Integrity First: being transparent, owning the results of your actions, and doing the right thing whether or not anyone is watching."}, {"q": "A staff sergeant sees a peer about to cut a corner that would dishonor the unit. He is committed to the success of something bigger than either of them. He pulls the peer aside and helps him act with honor. According to the lesson, which virtue of Service Before Self is the staff sergeant demonstrating?", "o": ["Loyalty", "Duty", "Respect", "Humility"], "a": 0, "e": "Lesson slides, \"Service Before Self: Virtues\": Loyalty — commitment to the success and preservation of something bigger than ourselves, demonstrated by helping each other act with honor."}, {"q": "An Airman holds himself to the highest personal and professional standards. He shows self-control at work and never lets his performance slip, even when no one is checking. His supervisor describes this as the virtue of discipline. According to the lesson, which core value is this virtue associated with?", "o": ["Integrity First", "Service Before Self", "Excellence In All We Do", "Character"], "a": 2, "e": "Discipline — along with mission and teamwork — is a virtue of Excellence In All We Do."}, {"q": "During a planning meeting, a Guardian notices a serious flaw in a plan that most of the room supports. She knows that raising it may be unpopular. She speaks up anyway because it is the right thing to do. According to the lesson, which of the Guardian 4 Cs is she demonstrating?", "o": ["Connection", "Commitment", "Courage", "Character"], "a": 2, "e": "Lesson slides, \"Guardian 4 Cs: Courage\": do what needs to be done, say what needs to be said, hold to our convictions. Commitments: be steadfast and stand up for what is right."}, {"q": "A senior airman consistently treats every cowor
