ker with dignity and values each as an individual. He does this whether or not a supervisor is present. Over time the behavior has become a habit that shows he truly values service. According to the lesson, what does the Air Force call a desired behavior like this that demonstrates a core value?", "o": ["A virtue", "A standard", "A commitment", "A creed"], "a": 0, "e": "Lesson slides, \"Virtues\": desired behaviors and characteristics that demonstrate one truly values Integrity, Service, and Excellence; consistent practice results in habits of honorable thought and action, which lay the foundation for professionalism and character."}]}, {"c": "Describe the USAF and USSF Core Values and their related virtues.", "t": "scn", "qs": [{"q": "A new Airman tells his supervisor he is worried he will never be perfect at his job. The supervisor explains that the Air Force does not demand perfection. Instead, it asks Airmen to continually advance their craft, increase their knowledge, and pursue improvement and innovation. According to the lesson, which core value is the supervisor describing?", "o": ["Integrity First", "Service Before Self", "Excellence In All We Do", "Commitment"], "a": 2, "e": "Lesson slides, \"Excellence In All We Do\": it does not mean that we demand perfection; it directs us to continually advance our craft and increase our knowledge."}, {"q": "A Guardian crew commander builds a team united by a purpose greater than any one member. She embraces a variety of perspectives and treats everyone with dignity, empathy, and respect. She tells the crew they are stronger together than individually. According to the lesson, which of the Guardian 4 Cs is she living out?", "o": ["Character", "Connection", "Commitment", "Courage"], "a": 1, "e": "Lesson slides, \"Guardian 4 Cs: Connection\": common purpose greater than ourselves; embrace a variety of perspectives; treat everyone with dignity, empathy, respect."}, {"q": "A Guardian pursues advanced training and studies the space domain on her own time. She seeks candid feedback and treats setbacks as chances to learn. Her goal is to be better tomorrow than she is today. According to the lesson, which of the Guardian 4 Cs is she living out?", "o": ["Commitment", "Connection", "Character", "Courage"], "a": 0, "e": "Lesson slides, \"Guardian 4 Cs: Commitment\": pursuit of mastery of self, profession, and domain; commitments include working to be better tomorrow than today."}, {"q": "An Airman is tasked to deploy over the holidays. He gives up personal plans because his professional duties take precedence over his personal desires. He approaches the tasking with energy and a servant mindset. According to the lesson, which core value is he displaying?", "o": ["Integrity First", "Service Before Self", "Excellence In All We Do", "Connection"], "a": 1, "e": "Lesson slides, \"Service Before Self\": professional duties take precedence over personal desires. Its virtue of Duty is consistently choosing to make necessary sacrifices to accomplish the mission."}, {"q": "A Guardian acts with integrity, candor, and transparency in everything she does. She holds herself accountable to her team for her decisions, actions, and inactions. She upholds high moral and ethical standards. According to the lesson, which of the Guardian 4 Cs is she living out?", "o": ["Character", "Connection", "Commitment", "Courage"], "a": 0, "e": "Lesson slides, \"Character: Commitments\": act with integrity, honesty, candor, transparency, and dedication to the team; be accountable to the team; uphold the highest standards and live the USSF values."}]}, {"c": "Discuss the importance of the USAF and USSF Core Values to Airmen and Guardians.", "t": "scn", "qs": [{"q": "A unit has slowly developed habits of making its own rules and cutting corners. The new commander is concerned about the unit's ethical direction. She uses the core values to assess where the unit stands and to guide it back to professional conduct. According to the lesson's readings, what do the core values provide the commander in this situation?", "o": ["A standard for administrative discipline", "A gauge of the ethical climate and a path back", "A checklist for unit self-inspection", "A basis for comparing members' performance"], "a": 1, "e": "The Blue Book says core values help gauge the ethical climate and offer a path back to professional conduct."}, {"q": "A trainee hears an instructor call the core values \"the price of admission\" to the Air Force. He asks what the phrase means. The instructor explains that every member must live by them from the first day of service. According to the lesson's readings, what does the phrase say about the core values?", "o": ["They are ideals members grow into over a career", "They are the minimum standard for belonging", "They are privileges earned through years of service", "They are standards applied mainly to leaders"], "a": 1, "e": "The Blue Book describes the core values as the price of admission — what it takes to belong to the Air Force."}, {"q": "A new lieutenant asks her commander why the USAF Core Values and the USSF 4 Cs matter to every Airman and Guardian. The commander explains that they are institutional values and principles of conduct. He adds that they are fundamental and enduring, and that they give members a moral framework for military activities. According to the lesson, how are the Core Values and 4 Cs best described?", "o": ["The basis of military law", "The bedrock of leadership", "The standard for performance evaluations", "The foundation of doctrine"], "a": 1, "e": "Lesson slides, \"USAF Core Values & USSF 4 Cs\": bedrock of leadership in the Air and Space Forces; institutional values and principles of conduct; moral framework for military activities; fundamental and enduring."}, {"q": "A supervisor tells a new Airman that others in the unit must be able to rely on his word and his work. She explains that doing the right thing all the time acts as a moral compass. She says this is why the value is the single most important part of character. According to the lesson, what is Integrity First the foundation of?", "o": ["Trust", "Loyalty", "Discipline", "Excellence"], "a": 0, "e": "Lesson slides, \"Integrity First\": the single most important part of character; doing the right thing, all the time; the moral compass that keeps us on the right path; the foundation upon which trust is built."}, {"q": "A Guardian tells his crew commander that technical skill matters more than anything else. The crew commander disagrees. She explains that one of the four values comes first because it lays the foundation for trust, teamwork, and good order and discipline, and that the other three are diminished without it. According to the lesson's reading, which value is she describing?", "o": ["Character", "Connection", "Commitment", "Courage"], "a": 0, "e": "SPFH 1-1, The Guardian Commitment: \"Character is the first value because it lays the foundation for trust, teamwork, and good order and discipline. Without it, the other three values are diminished.\""}]}]}, {"lesson": "Establishing Expectations", "csobs": [{"c": "Describe the importance of establishing expectations.", "t": "scn", "qs": [{"q": "A new flight chief questions why she should spend time establishing expectations when her Airmen already know their jobs. Her superintendent explains that expectations identify goals and give the team a road map for reaching them. He adds one more reason that ties the daily work to something larger. According to the lesson, what else do expectations provide?", "o": ["A baseline for performance feedback", "A linkage to standards and the unit mission", "A record of individual accountability", "A substitute for written standards"], "a": 1, "e": "Lesson slides, \"Importance of Establishing Expectations\": expectations identify objectives/goals, provide a road map for achieving them, and provide the linkage to standards and unit mission."}, {"q": "A section has operated for months with no stated expectations. Members are unsure what matters most, tasks are frequently redone, and tension is rising. The new NCOIC decides to establish clear expectations for the section. According to the lesson, what can correctly established expectations help minimize?", "o": ["Confusion and stress", "Workload and overtime", "Supervision and feedback", "Turnover and manning gaps"], "a": 0, "e": "Lesson slides: \"Correctly established expectations can help minimize confusion and stress.\""}, {"q": "A lieutenant arrives at his first unit eager to brief his own expectations on day one. He has not yet learned what his commander expects of the flight. His flight chief advises him to wait until he has done one thing first. According to the lesson, what should the lieutenant do before communicating his own expectations?", "o": ["Understand the established expectations", "Hold individual feedback sessions", "Rewrite the flight's mission statement", "Let the NCOs set the expectations"], "a": 0, "e": "Lesson slides, \"Understand the importance of expectations\": understanding established expectations is important before you can clearly communicate your own."}, {"q": "A major has just been selected for squadron command. He schedules an appointment with his new wing commander, brings a pen and pad, and asks what she expects of him. He stays until he clearly understands what is expected. According to the lesson's reading, what is the major establishing with his new boss?", "o": ["Mutually understood expectations for success", "A baseline for his first performance feedback", "A written command philosophy for the squadron", "A shared vision statement for the wing"], "a": 0, "e": "Goldfein, Sharing Success, Owning Failure, Chapter 1: the lack of formal preparation for command suggests an even greater need for you and your new boss to establish mutually understood expectations for success. \"Do not leave the interview until you understand clearly what is expected of you.\""}, {"q": "A wing commander selects three new squadron commanders. She believes no other officers will have a greater effect on the wing's ability to accomplish the mission. Before they take command, she tells each of them exactly what success looks like in their squadron. According to the lesson's reading, which leader responsibility is she carrying out?", "o": ["Clearly laying out expectations for success", "Testing each officer for future service", "Seeking buy-in from her subordinate commanders", "Tracking her commanders' progress against milestones"], "a": 0, "e": "Goldfein, Sharing Success, Owning Failure, Chapter 1: \"Leaders who hire subordinate commanders have a responsibility to clearly lay out their expectations for success.\" Goldfein warns against treating command as a test of the individual rather than an opportunity for the organization to succeed."}]}, {"c": "Summarize the guidelines for establishing expectations.", "t": "scn", "qs": [{"q": "A new NCOIC, upon taking over a work center, holds a meeting to outline her priorities. During the meeting she explains how each of the team's daily tasks contributes to the squadron's broader mission. She also shows how her priorities tie to what senior leadership expects. According to the lesson, which guideline for establishing expectations is she demonstrating?", "o": ["Tracking Activities", "Seeking Buy-In", "Helping Subordinates Make the Connection", "Knowing When and Where They Are Needed"], "a": 2, "e": "Lesson slides: personnel must be able to see the connection between senior leadership's expectations and those you levy on them, and between your organization's mission and the USAF or USSF mission."}, {"q": "A flight commander invites her team to help set the flight's expectations. She makes sure the goals are achievable and sets a positive tone in her words and actions. She also shows that she trusts her people to meet the expectations. According to the lesson, which guideline for establishing expectations is she demonstrating?", "o": ["Seeking Buy-In", "Tracking Activities", "Communicating Clearly", "Knowing When and Where They Are Needed"], "a": 0, "e": "Lesson slides, \"Seek Buy-In\": encourage buy-in by including the team in expectation-setting, ensuring goals are achievable, setting a positive tone, and demonstrating trust. Buy-in reduces frustration, fosters agreement and commitment, and leads to ownership, pride, and mission success."}, {"q": "A supervisor is assigned a major project with a long timeline. He outlines the steps of the task and identifies milestones along the way. He then monitors progress against those milestones and captures the results. According to the lesson, which guideline for establishing expectations is he demonstrating?", "o": ["Helping Subordinates Make the Connection", "Seeking Buy-In", "Communicating Clearly", "Tracking Activities"], "a": 3, "e": "Lesson slides, \"Plan to track activities within each task\": outline the steps of the task, identify milestones, track progress, and capture results."}, {"q": "After setting expectations, a supervisor watches how her team performs. She identifies performance gaps, adjusts, and sets new expectations where they are required. Then she steps back and observes again, repeating the cycle as conditions change. According to the lesson, which guideline for establishing expectations is she demonstrating?", "o": ["Seeking Buy-In", "Knowing When and Where They Are Needed", "Helping Subordinates Make the Connection", "Tracking Activities"], "a": 1, "e": "Lesson slides, \"Know when and where expectations are needed\": a continuous process — establish expectations, observe and identify performance gaps, adjust and set new expectations, step back and observe."}, {"q": "A captain first confirms what his commander expects of the section. He then briefs his own expectations in simple terms. He provides the necessary details and leaves out information that might obscure the message. According to the lesson, which guideline for establishing expectations is he demonstrating?", "o": ["Seeking Buy-In", "Tracking Activities", "Communicating Clearly", "Helping Subordinates Make the Connection"], "a": 2, "e": "Lesson slides: expectations must be clearly communicated and understood — know what your boss expects, communicate simply, and provide necessary details while excluding information that may obscure the message."}, {"q": "An officer is selected for command, but her new boss is deployed and cannot meet with her before the change of command. She does not want to take the unit without knowing what he expects. According to the lesson's reading, what should she do?", "o": ["Send him a note asking for his thoughts on success", "Wait to discuss expectations until he returns", "Ask the outgoing commander what the boss expects", "Set her own expectations and brief him afterward"], "a": 0, "e": "Goldfein, Sharing Success, Owning Failure, Chapter 1: \"Sometimes, a face-to-face meeting is not possible prior to a command change. In these cases, send a note to your new boss and request his or her thoughts on success.\""}, {"q": "A new commander takes over a large squadron with several specialties outside her own background. She worries that asking questions will make her look uninformed. Her senior NCO tells her the troops do not expect her to be a technical expert in every area. According to the lesson's reading, what do the troops expect her to understand?", "o": ["How they fit into the big picture", "The technical details of each specialty", "The career goals of each member", "The inspection history of the unit"], "a": 0, "e": "Goldfein, Sharing Success, Owning Failure, Chapter 1: Airmen \"don't expect immediate tactical or technical expertise in every area. However, they do expect you to understand how they fit into the big picture so you can be a credible advocate.\""}, {"q": "A researcher surveys senior NCOs about what they expect from a new commander. The essays describe leadership in action, open communication, and owning mistakes. One central theme runs through all of the responses. According to the lesson's reading, what do the troops expect commanders to do every day?", "o": ["Live the core values", "Master every technical task", "Be visible on every shift", "Restate the unit's vision"], "a": 0, "e": "Goldfein, Sharing Success, Owning Failure, Chapter 1: \"If there is a central theme in all of the essays I received, it is the expectation that commanders live the core values every day.\""}]}]}, {"lesson": "Organizational Climate", "csobs": [{"c": "Contrast the difference between climate and culture.", "t": "scn", "qs": [{"q": "A new commander takes over a squadron with decades of tradition. Within a few months, members report that they feel more respected and more comfortable raising concerns. The squadron's long-held traditions, norms, and foundational beliefs have not changed. According to the lesson, what has the new commander changed?", "o": ["Organizational Culture", "Organizational Climate", "Organizational Structure", "Organizational Mission"], "a": 1, "e": "Lesson slides: climate is attitudes and perceptions, moods and feelings — short-term and adjustable. Culture is ideologies, values, and norms, foundational beliefs and established traditions — long-term and ingrained."}, {"q": "A first sergeant describes her unit to a newcomer. She talks about its ideologies, values, and norms, and about traditions that were established long before anyone currently assigned arrived. She says these beliefs are ingrained and would take a long time to change. According to the lesson, what is the first sergeant describing?", "o": ["Organizational Climate", "Organizational Culture", "Unit Morale", "Unit Readiness"], "a": 1, "e": "Lesson slides, \"Differences & Relationship\": culture is ideologies, values, and norms; long-term and ingrained; foundational beliefs; established traditions. Climate is attitudes and perceptions; short-term and adjustable; moods and feelings."}, {"q": "Soldiers in a unit wear reflective belts over their camouflage uniforms because it is an established tradition. Lately, most of the soldiers are frustrated about the practice. A leader asks how the soldiers currently and collectively feel about wearing the belts. According to the lesson, what is the leader asking about?", "o": ["Organizational Culture", "Organizational Climate", "Established Tradition", "Foundational Beliefs"], "a": 1, "e": "Lesson slides: culture — soldiers wearing reflective belts for visibility in a camouflage uniform (established tradition). Climate — how soldiers currently and collectively feel about wearing reflective belts (moods and feelings)."}, {"q": "A commander tells his staff that the unit's mood cannot be improved because it comes from the unit's deep-rooted beliefs. His superintendent disagrees. She points out that attitudes and perceptions are a product of those beliefs but are short-term and adjustable. According to the lesson, which term describes what the superintendent says can be changed?", "o": ["Organizational Culture", "Organizational Climate", "Established Tradition", "Foundational Beliefs"], "a": 1, "e": "Lesson slides: climate is a product of culture but more flexible — short-term and adjustable, while culture is long-term and ingrained."}]}, {"c": "Discuss strategies to build a positive organizational climate.", "t": "scn", "qs": [{"q": "Members of a flight tell their new commander they are afraid to suggest ideas. In the past, mistakes were met with harsh criticism, and people stopped taking risks. The building is well maintained, and safety protocols are followed. According to the lesson, which part of a positive climate needs the commander's attention?", "o": ["Physical Safety and Security", "Emotional Safety and Security", "High Standards", "Establishing Expectations"], "a": 1, "e": "Emotional safety and security focus on respect and openness and on encouragement to try new things and take calculated risks without fear of harsh repercussions."}, {"q": "A new squadron commander reviews what could most damage her unit's work environment. She concludes that one issue threatens both the physical and the emotional safety of her people more than any other. She publishes a zero-tolerance policy and enforces it. According to the lesson, which issue is she addressing?", "o": ["Safety Violations", "Harassment and Sexual Assault", "Alcohol Misuse", "Favoritism"], "a": 1, "e": "Nothing is more detrimental to a work environment than harassment and sexual assault; leaders must establish and uphold a zero-tolerance policy."}, {"q": "A team has become complacent doing the same tasks day after day, and job satisfaction is falling. The NCOIC clearly defines what is expected of each member. She then challenges the team to reach new heights and take on new challenges. According to the lesson, which part of a positive climate is she building?", "o": ["Physical Safety and Security", "Emotional Safety and Security", "High Standards", "Zero Tolerance"], "a": 2, "e": "High standards improve quality and performance and bring lasting job satisfaction; leaders should clearly define standards by establishing expectations."}, {"q": "A commander reads General Goldfein's observation that more than 95 percent of Airmen arrive at work intending to succeed. She decides her job is to remove as many barriers to that success as she can. She focuses on the kind of work environment her people walk into each day. According to the lesson, how does Goldfein say that environment should be?", "o": ["Challenging, competitive, and rewarding", "Safe, secure, and of high standards", "Open, flexible, and informal", "Structured, disciplined, and closely led"], "a": 1, "e": "Goldfein: the commander's role is to remove barriers so Airmen can achieve the success they already seek; the work area must be secure, safe, and of high standards."}]}, {"c": "Describe how to positively change an organizational climate.", "t": "scn", "qs": [{"q": "A commander receives his unit's Defense Equal Opportunity Climate Survey results, which show several negative trends. He gathers the unit and briefs both the positive and negative results. He explains the impact on the mission and what will happen next. According to the lesson, which step in implementing change is he carrying out?", "o": ["Address Your Unit", "Inspire Action", "Focus on the Little Things", "Establish Expectations"], "a": 0, "e": "Leaders should be transparent: brief results and trends, describe mission impact, give recommendations, and offer follow-up such as one-on-ones, chaplain, and EO professionals."}, {"q": "During a staff meeting, a commander casually jokes about a safety violation. Within weeks, members of the unit begin taking safety less seriously. The commander never issued any guidance that changed the unit's safety rules. According to the lesson, which principle of implementing change does this illustrate?", "o": ["Address Your Unit", "Inspire Action", "Focus on the Little Things", "Enable Action"], "a": 2, "e": "\"Focus on the Little Things\": everything a leader does — even casual comments — influences unit climate."}, {"q": "A leader wants her unit to move in the same direction. She communicates the mission, vision, and priorities often and in different ways. She empowers her subordinates to act and publicly recognizes teams that contribute. According to the lesson, which step in implementing change is she carrying out?", "o": ["Address Your Unit", "Inspire Action", "Focus on the Little Things", "Understand the Climate"], "a": 1, "e": "Inspire Action: communicate the mission, vision, and priorities; enable action by empowering and building trust; and reinforce by showing appreciation."}]}]}, {"lesson": "Inspiring Action", "csobs": [{"c": "Recognize the difference between mission and vision statements.", "t": "def", "qs": [{"q": "What is the difference between a mission statement and a vision statement?", "o": ["Mission states what the organization does; vision states why it matters", "A mission statement sets the goal; a vision statement sets how to reach it", "A vision statement lists daily tasks; a mission statement describes the future", "A mission statement is personal; a vision statement is organizational"], "a": 0, "e": "The reader: mission describes the action, while vision offers the aspiration."}, {"q": "\"Develop and sustain ready and resilient forces and their families through customer-focused programs and services\" is an example of a:", "o": ["Vision statement", "Mission statement", "Core value", "Priority"], "a": 1, "e": "This is the 42d FSS mission — it states what the organization does."}, {"q": "\"A dynamic team of innovative professionals driven and empowered to provide unrivaled customer experiences\" is an example of a:", "o": ["Mission statement", "Vision statement", "SWOT strength", "Standard"], "a": 1, "e": "This is the 42d FSS vision — an aspirational picture of the desired future state."}]}, {"c": "Recall the purpose of using the SWOT method to identify priorities.", "t": "def", "qs": [{"q": "What does SWOT stand for?", "o": ["Strategy, Workforce, Objectives, Tasks", "Strengths, Weaknesses, Opportunities, Threats", "Standards, Wins, Outcomes, Timelines", "Situation, Will, Options, Tactics"], "a": 1, "e": "SWOT = Strengths, Weaknesses, Opportunities, Threats."}, {"q": "What is the purpose of a SWOT analysis?", "o": ["To assign responsibility for poor performance within the organization", "To reveal positive forces and potential problems that need addressing", "To write the unit's mission statement and core values", "To evaluate individual performance reports and promotion potential"], "a": 1, "e": "The purpose of a SWOT analysis is to reveal positive forces working together and potential problems that need to be recognized and possibly addressed."}, {"q": "In a SWOT analysis, which factors are internal to the organization?", "o": ["Opportunities and threats", "Strengths and weaknesses", "Threats and weaknesses", "Opportunities and strengths"], "a": 1, "e": "Strengths and weaknesses are internal (S-W); opportunities and threats are broader external factors (O-T)."}]}, {"c": "Describe techniques for encouraging continued action toward a vision.", "t": "scn", "qs": [{"q": "A unit writes an inspiring vision statement at an off-site. Three months later, no one mentions it and the energy has faded. The commander begins building the vision into meetings, decisions, priorities, and performance feedback, and he models it in his own actions. According to the lesson, which technique for encouraging action toward a vision is he using?", "o": ["Rewriting the vision each quarter", "Integrating the vision into daily activities", "Posting the vision in the work center", "Delegating the vision to each section"], "a": 1, "e": "Great organizations integrate vision, mission, and values into everything they do and communicate the message frequently through modeling and sharing."}, {"q": "A new commander drafts a vision statement alone in her office and announces it at commander's call. Members feel no ownership of it. She starts over, this time collaborating with her people during development and accepting their feedback. According to the lesson, which characteristic of a good vision is she now building?", "o": ["Idealistic Yet Achievable", "Shared and Supported", "Clarity of Purpose", "Easily Understood"], "a": 1, "e": "\"Shared and supported\": leaders encourage support by collaborating during development and accepting feedback, then deliberately incorporate the vision into daily activities."}, {"q": "A squadron is choosing between two draft vision statements. One is so easy to achieve that it will not motivate anyone. The other is so unrealistic that it may discourage people. According to the lesson, which characteristic of a good vision should guide the squadron's choice?", "o": ["Easily Understood", "Idealistic Yet Achievable", "Clarity of Purpose", "Shared and Supported"], "a": 1, "e": "A good vision must inspire people to stretch their capabilities; too easy won't motivate, while unachievable may discourage."}, {"q": "Members of a flight can explain what they do and how they do it. When asked why their work matters, they have no answer. The flight commander rewrites the vision so that it answers the \"why\" behind the mission. According to the lesson, which characteristic of a good vision is she adding?", "o": ["Clarity of Purpose and Direction", "Idealistic Yet Achievable", "Shared and Supported", "Easily Understood"], "a": 0, "e": "Clarity offers insight into why the mission is important. Simon Sinek: few people know why they do it; a good vision can answer the \"why.\""}, {"q": "A new squadron commander has developed her vision. She works it into a short \"mini-speech\" that she gives whenever she meets with members of the squadron. She repeats the same few themes throughout her first months in command. According to the lesson's reading, why is this repetition critical?", "o": ["It ensures the word filters to all levels of the organization", "It gives members the chance to help shape the vision", "It keeps the vision aligned with the wing's mission", "It makes the vision easier for members to understand"], "a": 0, "e": "Goldfein, Sharing Success, Owning Failure, Chapter 2: \"Take and make every opportunity to talk to your troops about your vision and their role in it... Repetition in the early months of your command is critical to ensuring that the word filters to all levels of the organization.\""}, {"q": "A commander drafts a vision statement for his squadron. Before publishing it, he gives his senior supervisors the chance to comment on it and adjust the wording. He avoids simply issuing the vision from his office. According to the lesson's reading, which guideline for developing a vision statement is he following?", "o": ["Make It Understandable", "Make It Inclusive", "Make It Supportive", "Encourage Participation"], "a": 3, "e": "Goldfein, Sharing Success, Owning Failure, Chapter 2: \"Encourage participation — Avoid the tendency to 'issue' your vision. Allow senior supervisors to make comments and tweak the vision statement before it is published. Their buy-in will flow down through the unit.\""}, {"q": "A squadron commander reviews her draft vision statement. She remembers that her squadron executes only a portion of the wing's mission. She rewrites the statement so that it backs the goals of the group and the wing. According to the lesson's reading, which guideline for developing a vision statement is she following?", "o": ["Make It Understandable", "Make It Inclusive", "Make It Supportive", "Encourage Participation"], "a": 2, "e": "Goldfein, Sharing Success, Owning Failure, Chapter 2: \"Make it supportive — Remember that your squadron is responsible for executing a portion of the wing's mission. Your vision must support the group and wing.\""}]}]}, {"lesson": "Problem Solving", "csobs": [{"c": "Define problem-solving.", "t": "def", "qs": [{"q": "According to the reader, in its simplest form problem solving is:", "o": ["A logical, common-sense, fact-based, step-by-step approach based on a \"go and see\" philosophy", "An intuitive, experience-based judgment made quickly by the leader closest to the problem", "A rapid observe-orient-decide-act cycle built for time-critical decisions by one person", "A data-driven statistical method for reducing the variation in a repeatable process"], "a": 0, "e": "The reader defines problem solving in its simplest form as a logical, common-sense, fact-based, step-by-step approach based on a \"go and see\" philosophy."}, {"q": "What is the objective of the Practical Problem Solving Method (PPSM)?", "o": ["To standardize performance metrics and reporting across DAF work centers", "To focus Airmen's problem solving on issues affecting the mission, work centers, and people", "To speed up individual decisions in time-critical operational situations", "To identify the people and work centers responsible for recurring problems"], "a": 1, "e": "PPSM is a team-centered, systematic, common-sense approach aimed at increasing combat capability and making DAF units more effective and efficient."}, {"q": "A \"performance gap\" is defined as:", "o": ["The time that passes between each step of the OODA loop", "The difference between current and required performance", "The difference between strategic targets and tactical targets", "A break in the chain of command that delays decisions"], "a": 1, "e": "A performance gap is the difference between current performance and what performance should be — what we should be doing versus what we are doing."}]}, {"c": "Compare the 8-step Practical Problem-Solving Method to the OODA Loop Model.", "t": "scn", "qs": [{"q": "A fighter pilot is engaged in a dogfight. He must make rapid decisions on his own. There is no time for detailed analysis, planning, or a team meeting. According to the lesson, which problem-solving model best fits his situation?", "o": ["8-Step Practical Problem Solving Method", "OODA Loop", "SWOT Analysis", "Joint Planning Process"], "a": 1, "e": "The OODA loop is useful when quick action is needed by a single player with limited time for analysis, planning, and training."}, {"q": "A maintenance squadron has struggled with chronic parts delays for two years. The commander wants a team-based effort that finds the cause and produces a lasting process improvement. There is no immediate crisis driving the timeline. According to the lesson, which problem-solving model best fits this situation?", "o": ["OODA Loop", "8-Step Practical Problem Solving Method", "SWOT Analysis", "Joint Planning Process"], "a": 1, "e": "PPSM is designed for long-term, process-improvement solutions; it is less useful for short-term, high-urgency problems."}, {"q": "An instructor shows a class how the Air Force built its 8-step method from an existing four-step model. She writes \"OO-OO-D-AAA\" on the board. She explains that the first two steps observe, the next two orient, the fifth decides, and the last three act. According to the lesson, which model did the 8-step method expand?", "o": ["SWOT Analysis", "OODA Loop", "Joint Planning Process", "Lewin's Change Model"], "a": 1, "e": "The Air Force took the four OODA steps and broke them into the 8-step roadmap: OO-OO-D-AAA."}, {"q": "A process improvement team has clarified its problem and broken it down. The team now sets improvement targets and works to determine the root cause. The facilitator tells them this part of the work matches what Colonel Boyd considered the most important part of his loop. According to the lesson, which OODA phase do these two steps correspond to?", "o": ["Observe", "Orient", "Decide", "Act"], "a": 1, "e": "Steps 3 (Set Improvement Targets) and 4 (Determine Root Cause) map to Orient — which Boyd called the most important part of the loop."}]}, {"c": "Understand the steps for the 8-Step Practical Problem-Solving Method.", "t": "scn", "qs": [{"q": "A flight line team has \"fixed\" the same late-launch problem three times this year. Each time, the problem returns within a few months. A review shows the team's countermeasures were aimed at symptoms. According to the lesson, which step of the 8-step method was most likely done poorly?", "o": ["Step 1: Clarify and Validate the Problem", "Step 4: Determine Root Cause", "Step 6: See Countermeasures Through", "Step 3: Set Improvement Targets"], "a": 1, "e": "Problems recur when efforts target symptoms instead of root causes; incorrect root cause is the most common mistake in process improvement. Tools: brainstorming and the Five Whys."}, {"q": "A medical group team has successfully reduced pharmacy wait times. The members are eager to move on to their next project. Their facilitator insists they first write the new procedures into a local operating instruction and share what worked. According to the lesson, which commonly skipped step is the facilitator enforcing?", "o": ["Step 2: Break Down the Problem", "Step 8: Standardize Successful Processes", "Step 5: Develop Countermeasures", "Step 7: Confirm Results"], "a": 1, "e": "Step 8 is the most commonly skipped step. Standardizing successful countermeasures greatly reduces the risk of the problem returning."}, {"q": "A team is weighing several possible solutions to a scheduling problem. For each one, the members ask whether it will achieve the target, whether it is possible given cost and resources, and whether it will create more problems than it solves. They then build an action plan listing what, who, and when. According to the lesson, which step of the 8-step method is the team in?", "o": ["Step 2: Break Down the Problem", "Step 4: Determine Root Cause", "Step 5: Develop Countermeasures", "Step 7: Confirm Results"], "a": 2, "e": "In Step 5, alternatives are analyzed for effectiveness, feasibility, and impact, and an action plan (what, who, when) is developed."}, {"q": "A squadron superintendent leads a process improvement effort. She insists that the team's goals be balanced, specific, measurable, attainable, results-focused, and timely. She also has the team map the ideal state and the future state. According to the lesson, which step of the 8-step method is she in?", "o": ["Step 1: Clarify and Validate the Problem", "Step 3: Set Improvement Targets", "Step 6: See Countermeasures Through", "Step 8: Standardize Successful Processes"], "a": 1, "e": "Step 3: targets should be challenging but achievable and have B-SMART characteristics; ideal-state and future-state mapping help."}, {"q": "Before committing resources, a team asks whether solving an issue will contribute to the wing's strategic goals. The members confirm there is a performance gap. Two of them go and see the issue for themselves, and then the team writes it down in specific, measurable terms. According to the lesson, which step of the 8-step method is the team in?", "o": ["Step 1: Clarify and Validate the Problem", "Step 2: Break Down the Problem", "Step 5: Develop Countermeasures", "Step 7: Confirm Results"], "a": 0, "e": "Step 1 validates the problem and states it in clear, specific, objective, and measurable terms. Tools include SA&D, Voice of the Customer, and Go and See."}]}]}, {"lesson": "Critical Thinking", "csobs": [{"c": "Summarize the definition of critical thinking.", "t": "scn", "qs": [{"q": "During a heated planning meeting, an officer is asked to evaluate a proposal from a colleague she dislikes. She sets her feelings and opinions aside. She thinks carefully about the idea and judges it strictly on its merits. According to the lesson, what is the officer practicing?", "o": ["Confirmation Bias", "Critical Thinking", "System 1 Thinking", "Deflection"], "a": 1, "e": "The reader defines critical thinking as \"the process of thinking carefully about a subject or idea, without allowing feelings or opinions to affect you.\""}, {"q": "A captain is assigned a difficult problem. She raises the vital questions, gathers and assesses relevant information, and tests her conclusion against standards. She considers alternative viewpoints and their assumptions, then communicates her solution to the team. According to the lesson, what does this behavior describe?", "o": ["A Critical Thinker", "Groupthink", "Belief Perseverance", "The Halo Effect"], "a": 0, "e": "A critical thinker raises vital questions, gathers and assesses information, reaches well-reasoned conclusions tested against standards, thinks open-mindedly, and communicates effectively."}, {"q": "A lieutenant is convinced his plan is the best option. New evidence arrives showing that his original belief was wrong. He changes his assessment to fit the facts instead of twisting the facts to fit his belief. According to the lesson, what is the lieutenant demonstrating?", "o": ["Confirmation Bias", "Critical Thinking", "Belief Perseverance", "Deflection"], "a": 1, "e": "Grant: \"Confirmation bias is twisting the facts to fit your beliefs. Critical thinking is bending your beliefs to fit the facts.\""}]}, {"c": "Discuss methods for evaluating information.", "t": "scn", "qs": [{"q": "A briefer tells the audience, \"Our new process is the best in the Air Force.\" He offers no reasons or evidence to support it. A captain in the audience notes that this must be sorted out before the information can be evaluated. According to the lesson, how should the briefer's sentence be classified?", "o": ["An Argument", "A Statement (Claim)", "An Objective Fact", "An Inference"], "a": 1, "e": "The first step in evaluating information is deciding whether it is a statement (claim) or an argument providing reasons for a conclusion."}, {"q": "An airfield manager tells a visiting crew, \"The runway is too short for comfortable landings.\" The airfield data sheet lists the runway as 9,000 feet long. The crew recognizes that the manager's remark is a personal belief that cannot be verified. According to the lesson, how should the manager's remark be classified?", "o": ["An Objective Fact", "A Subjective Opinion", "An Argument", "A Conclusion"], "a": 1, "e": "A fact is objective and verifiable; an opinion is a subjective belief that cannot be verified. Objective claims are true or false independently of what people think."}, {"q": "A lieutenant reads a news article about an upcoming deployment. Everything in the article is accurate. He later learns that it left out key details that would have changed his judgment. According to the lesson, what should a critical thinker stay mindful of when evaluating information?", "o": ["Whether the author is senior in rank", "What information may have been omitted", "How widely the article was shared", "How recently the article was published"], "a": 1, "e": "Browne and Keeley: almost any information has a purpose, and its organization was selected to affect your thinking; consider what has been left out."}]}, {"c": "Explain the nine intellectual standards used in assessing one's thinking.", "t": "scn", "qs": [{"q": "A senior NCO reports to his flight commander, \"It's really hot on the flightline today.\" The commander asks, \"What is the actual temperature?\" She wants specific detail before deciding whether to adjust the work schedule. According to the lesson, which intellectual standard is the commander applying?", "o": ["Clarity", "Precision", "Breadth", "Fairness"], "a": 1, "e": "Precision refines information; \"hot\" can mean many temperatures, so detail adds precision."}, {"q": "A major is preparing to recommend a new policy. Before deciding, he deliberately seeks out how other units, career fields, and stakeholders see the issue. He also considers the implications from their points of view. According to the lesson, which intellectual standard is the major applying?", "o": ["Depth", "Breadth", "Relevance", "Accuracy"], "a": 1, "e": "Breadth addresses various interpretations of an issue, including other points of view, the concepts involved, and implications."}, {"q": "A subordinate submits a request that is so vague the supervisor cannot tell whether it is accurate or relevant. She asks him to elaborate and give an example before she considers anything else. She explains that this standard must be met first, because the others cannot be applied without it. According to the lesson, which intellectual standard is the supervisor applying?", "o": ["Logic", "Significance", "Clarity", "Depth"], "a": 2, "e": "Clarity is the gateway standard: if a statement is unclear, you cannot determine whether it is accurate, relevant, or logical."}, {"q": "A flight commander is about to finalize a decision that would benefit his own section. He pauses for a \"gut check.\" He asks himself whether ego, personal interests, or unjustified assumptions are shaping the decision. According to the lesson, which intellectual standard is he applying?", "o": ["Fairness", "Significance", "Accuracy", "Logic"], "a": 0, "e": "Fairness is a \"gut check\" to avoid personal interests, ego, and unjustified assumptions."}]}, {"c": "Explain cognitive domain operations and their relationship to disinformation.", "t": "scn", "qs": [{"q": "An adversary creates thousands of AI-generated social media posts aimed at a US audience. The posts are combined with psychological messaging and cyber tools. Their purpose is to spread false narratives and weaken public trust. According to the lesson, what is this kind of campaign called?", "o": ["Electromagnetic Warfare", "Cognitive Domain Operations", "Offensive Counterair", "Navigation Warfare"], "a": 1, "e": "Cognitive domain operations blend information, psychological warfare, and cyberwarfare, with the help of AI and other technologies, to spread propaganda across the information domain (e.g., social media)."}, {"q": "An Airman gets most of his news from a personalized feed and search results. The feed mostly shows him stories that match what he already believes. Over time he becomes more certain of his views and less willing to consider other evidence. According to the lesson, which bias do personalized feeds increase, making people more vulnerable to disinformation?", "o": ["Halo Effect", "Confirmation Bias", "Belief Perseverance", "Deflection"], "a": 1, "e": "Feeds that match our preferences increase confirmation bias; rapid messaging induces recency bias; social proofing creates echo chambers. Together they encourage reflexive \"thinking fast.\""}, {"q": "A provocative, emotional post about an incident in a unit is spreading quickly on social media. A staff sergeant feels the urge to share it right away. Instead, she slows down, checks whether it is factual, and asks for clear information before acting. According to the lesson, which mode of thinking is she using to counter disinformation?", "o": ["System 1: Fast and Intuitive", "System 2: Slow and Deliberate", "Social Proofing", "Recency Bias"], "a": 1, "e": "The reader warns against acting on half-truths or emotionally charged statements. Disinformation exploits reflexive \"thinking fast\" (System 1); slowing down to verify is deliberate System 2 thinking."}]}, {"c": "Describe the elements of reasoning that are used in the critical thinking process.", "t": "scn", "qs": [{"q": "After a terrorist attack, national leaders announce within hours that a particular group is responsible. They drew the conclusion without evaluating the assumptions behind it. The conclusion turns out to be wrong. According to the lesson, which element of reasoning did the leaders misuse?", "o": ["Concept", "Inference", "Purpose", "Point of View"], "a": 1, "e": "An inference draws a conclusion from interpreting assumptions. The reader's example (Spain, 2004) shows incorrect inferences; critical thinkers evaluate assumptions before concluding."}, {"q": "Before 11 September 2001, analysts thought of aircraft hijackings only as hostage situations. Because of that fixed idea, they could not imagine hijacked aircraft being used as weapons. The lesson describes this as being stuck in a trap. According to the lesson, which element of reasoning failed?", "o": ["Information", "Concept", "Implication", "Question"], "a": 1, "e": "Concept is called the most powerful element; uncritical thinkers get stuck in incorrect concepts — a \"conceptual trap\" — as on 11 September 2001."}, {"q": "A captain reviews an intelligence assessment before a briefing. She notices that the analyst's conclusion depends on something he accepted as true without stating it or checking it. She asks him to bring that belief into the open so it can be evaluated. According to the lesson, which element of reasoning is the captain examining?", "o": ["Assumption", "Purpose", "Implication", "Information"], "a": 0, "e": "The eight elements of reasoning are Purpose, Question, Information, Concept, Inference, Assumption, Point of View, and Implications. An assumption is something taken for granted; critical thinkers surface and evaluate assumptions before drawing inferences from them."}, {"q": "A strategic leader must decide how to protect civil liberties while maintaining security. The question has no single right answer, and it is not simply a matter of personal taste. Answering it requires reasoning skills. According to the lesson, which type of question is the leader facing?", "o": ["Question of Fact", "Question of Preference", "Question of Judgment", "Question of Information"], "a": 2, "e": "Paul's three types of questions: fact (one right answer), preference (many answers), and judgment (require reasoning) — the hardest challenge for strategic leaders. Col Guillot calls questioning the most important element."}]}, {"c": "Discuss common thinking errors that can lead to faulty thinking.", "t": "scn", "qs": [{"q": "A new Airman arrives at a unit with a reputation as a star athlete. Because of that one fact, his supervisor assumes he must also be an excellent writer and leader. She assigns him a major project without checking his skills. According to the lesson, which thinking error is the supervisor making?", "o": ["Belief Perseverance", "Halo Effect", "Deflection", "Confirmation Bias"], "a": 1, "e": "The halo effect occurs when one thing you know about a person (good or bad) shapes how you see everything else about them."}, {"q": "A commander asks a lieutenant why a report is late. The lieutenant talks at length about how busy the office has been. He never actually answers the question, and the conversation drifts away from its original intent. According to the lesson, which thinking error is this?", "o": ["Halo Effect", "Deflection", "Belief Perseverance", "Confirmation Bias"], "a": 1, "e": "Deflection is answering a question with something that doesn't really answer it, causing the conversation to veer from its original intent."}, {"q": "A major champions a plan for months. After it is executed, the data clearly shows the plan failed. He still refuses to change his mind about it. According to the lesson, which cognitive bias is the major showing?", "o": ["Halo Effect", "Belief Perseverance", "Deflection", "Confirmation Bias"], "a": 1, "e": "Belief perseverance is the difficulty of changing your mind even when proven wrong; critical thinking requires treating judgments as tentative and contextual."}, {"q": "A flight commander must fill a key position quickly. She makes a snap decision based on gut feeling and past patterns, without any deliberate analysis. The decision backfires. According to the lesson, which mode of thinking was she relying on?", "o": ["System 1: Fast and Intuitive", "System 2: Slow and Deliberate", "Critical Thinking", "Reflective Thinking"], "a": 0, "e": "System 1 is fast and intuitive, which allows rapid responses but can lead to biases and errors. System 2 is slow, deliberate, and logical. \"Slow down!\""}]}]}, {"lesson": "Followership", "csobs": [{"c": "Summarize the five basic styles of followership.", "t": "scn", "qs": [{"q": "An Airman in a supply section does exactly what she is told and then stops. She shows no initiative and rarely thinks critically about her tasks. She takes little responsibility for the outcome and waits for the next instruction. According to the lesson, which followership style does she represent?", "o": ["Sheep", "Yes Person", "Alienated Follower", "Survivor"], "a": 0, "e": "\"Sheep\" are passive and uncritical, lacking initiative and a sense of responsibility — they perform the tasks given and stop (low critical thinking, passive participation)."}, {"q": "A sharp NCO was passed over for a position he wanted. Since then he has distanced himself from the mission and does only the minimum. He still thinks critically and often offers insightful, cynical criticism of unit decisions, but he does not act on it. According to the lesson, which followership style does he represent?", "o": ["Effective Follower", "Alienated Follower", "Yes Person", "Sheep"], "a": 1, "e": "Alienated followers think critically and independently but fulfill their roles passively; something \"turned them off,\" and they often slide into disgruntled acquiescence."}, {"q": "A lieutenant is lively and always busy. He energetically agrees with everything the commander says and depends on the boss for direction and inspiration. He never offers an independent idea or a dissenting view. According to the lesson, which followership style does he represent?", "o": ["Yes Person", "Effective Follower", "Survivor", "Alienated Follower"], "a": 0, "e": "\"Yes People\" are livelier (active) but unenterprising and dependent on the leader for inspiration — sometimes aggressively deferential, even servile (low critical thinking, active)."}, {"q": "A civilian employee is six months from retirement. He attends only mandatory events and finishes tasks exactly on time so he will not be given more work. He reads what the boss wants and goes along with every decision to stay out of trouble. According to the lesson, which followership style does he represent?", "o": ["Sheep", "Survivor", "Effective Follower", "Alienated Follower"], "a": 1, "e": "Survivors sit in the center of Kelley's model as \"shape-shifters\" who do the minimum to stay out of trouble and assess what the leader wants (\"R.O.A.D.\" — Retired on Active Duty)."}, {"q": "A captain thinks critically about every tasking and actively leans into the mission. When she disagrees, she dissents with courage and then supports the decision. She shares credit with her team and admits her own mistakes. According to the lesson, which followership style does she represent?", "o": ["Yes Person", "Effective Follower", "Alienated Follower", "Survivor"], "a": 1, "e": "Effective followers are highly participative critical thinkers who courageously dissent when necessary, share credit, admit mistakes, and exercise superior judgment."}]}, {"c": "Distinguish between the characteristics of an effective follower.", "t": "scn", "qs": [{"q": "A flight commander evaluates two of his NCOs as followers using Kelley's model. One thinks independently but stays passive. The other is highly active but never questions anything. He concludes that neither is fully effective because each is strong in only one of the two areas. According to the lesson, which two dimensions determine follower effectiveness?", "o": ["Performance Initiative and Relationship Initiative", "Critical Thinking and Participation", "Loyalty and Competence", "Independence and Obedience"], "a": 1, "e": "Kelley's two dimensions are critical thinking and participation. Effective followers are high on both."}, {"q": "A staff sergeant believes her commander's plan has a serious flaw. She tells him the unpleasant truth in a timely, honest way because it serves the organization. She also asks him for the same honest feedback about her own work. According to the lesson, which follower competency is she demonstrating?", "o": ["Seeing Oneself as a Resource", "Communicating Courageously", "Embracing Change", "Doing the Job"], "a": 1, "e": "Communicating courageously means giving honest, timely feedback — telling unpleasant truths to serve the organization and seeking the same from others."}, {"q": "A Guardian's unit is going through a major reorganization. She constantly looks for ways to reduce waste and improve processes. She leads by example and acts as an agent for improvement while others resist. According to the lesson, which follower competency is she demonstrating?", "o": ["Embracing Change", "Identifying with the Leader", "Building Trust", "Communicating Courageously"], "a": 0, "e": "Embracing change: followers committed to constant improvement and waste reduction who act as change agents."}, {"q": "A technical sergeant is a highly productive and creative workhorse. His job performance is exceptional. He rarely invests in building relationships or in understanding his boss's perspective. According to the lesson's model of performance initiative and relationship initiative, which type of follower is he?", "o": ["Politician", "Contributor", "Subordinate", "Partner"], "a": 1, "e": "Contributors are high in performance initiative but low in relationship initiative. Partners blend exceptional performance with healthy relationships."}]}, {"c": "Explain the correlation between followership and leadership.", "t": "scn", "qs": [{"q": "A newly commissioned lieutenant questions why her training spends time on followership when she is preparing to lead. Her instructor points out that officers follow far more often than they lead. He adds that those who follow effectively are usually the ones who move into formal leadership positions. According to the lesson, how is effective followership related to leadership?", "o": ["It is a separate skill set from leadership", "It is a prerequisite for effective leadership", "It matters most in the first years of a career", "It is replaced by leadership as rank increases"], "a": 1, "e": "The reader titles it \"Dynamic Followership: The Prerequisite for Effective Leadership\"; those able to follow effectively usually transition to formal leadership over time."}, {"q": "A squadron commander surrounds himself with \"yes people\" because they are comfortable to work with. He rarely challenges them or helps them grow. Over time, his staff stops bringing him independent ideas. According to the lesson, which leader responsibility is the commander neglecting?", "o": ["Follower Development", "Mission Planning", "Resource Management", "Performance Reporting"], "a": 0, "e": "Kelley cautions that some leaders embrace \"yes people\"; follower development is a leader's utmost responsibility."}, {"q": "A major strongly disagrees with his commander's decision. He closes the office door and argues his case in private. When the commander holds to the decision, the major supports it in public and does not blame the boss when it proves unpopular. According to the lesson, what does the major's conduct show about followership?", "o": ["Good followership enables good leadership", "Good followers keep their disagreements to themselves", "Good followers take their dissent to their peers", "Good followership means agreeing in public and private"], "a": 0, "e": "Meilinger argues good followership enables good leadership — disagree privately, don't blame the boss for unpopular decisions, and support rather than undermine."}]}]}, {"lesson": "Full-Range Leadership", "csobs": [{"c": "Differentiate the characteristics of laissez-faire, transactional, and transformational leadership.", "t": "scn", "qs": [{"q": "A flight commander is rarely available to her people. She keeps delaying a decision on hiring a contractor and ignores her subordinates' professional military education requirements. When issues come up, she avoids taking a stand. According to the lesson, which leadership behavior is she displaying?", "o": ["Management by Exception: Passive", "Laissez-Faire", "Contingent Reward", "Management by Exception: Active"], "a": 1, "e": "Laissez-faire is \"hands-off\" non-leadership: absence, avoiding decisions, abdicating responsibility, and not developing followers. It is linked to the lowest performance."}, {"q": "A supervisor needs an inspection-preparation task finished by Thursday. He promises his Airmen an afternoon off if they complete it on time. They meet the deadline, and he follows through on the reward. According to the lesson, which leadership behavior is he displaying?", "o": ["Laissez-Faire", "Contingent Reward", "Idealized Influence", "Management by Exception: Passive"], "a": 1, "e": "Contingent reward is a constructive transaction: a reward exchanged for meeting agreed-upon performance."}, {"q": "A captain follows an \"if it ain't broke, don't fix it\" philosophy with his section. He does not monitor the work or correct small deviations. He steps in only after two careless Airmen cause an accident. According to the lesson, which leadership behavior is he displaying?", "o": ["Management by Exception: Active", "Management by Exception: Passive", "Contingent Reward", "Laissez-Faire"], "a": 1, "e": "MBE-P: the leader waits for problems before acting. It breeds low trust, fear, and complacency and is dangerous in high-risk military settings."}, {"q": "A colonel builds personal relationships with the people in her group. She raises their motivation and morality and helps them reach their fullest potential. Her people accomplish more than they originally intended. According to the lesson, which leadership approach is she using?", "o": ["Transactional", "Laissez-Faire", "Transformational", "Management by Exception"], "a": 2, "e": "Transformational leadership builds personal relationships that raise followers' motivation and morality and helps them reach their fullest potential — empirically the most effective style."}, {"q": "A master sergeant actively monitors his team for deviations from standards. When an Airman fails to salute an officer, he corrects the Airman immediately. He does not wait for a problem to grow before acting. According to the lesson, which leadership behavior is he displaying?", "o": ["Management by Exception: Active", "Management by Exception: Passive", "Contingent Reward", "Laissez-Faire"], "a": 0, "e": "MBE-A is a corrective transaction in which the leader actively monitors and promptly corrects deviations. It is useful when safety is a factor, but overuse can become micromanagement."}]}, {"c": "Describe how to apply Full-Range Leadership.", "t": "scn", "qs": [{"q": "A captain stays an extra hour after duty to help an Airman with a college course. He listens attentively to her concerns and learns what she wants from her career. He then tailors his coaching to her individual needs and goals. According to the lesson, which transformational behavior is he applying?", "o": ["Idealized Influence", "Inspirational Motivation", "Intellectual Stimulation", "Individualized Consideration"], "a": 3, "e": "Individualized consideration means coaching, mentoring, active listening, and treating each follower as an individual with different needs and aspirations."}, {"q": "A maintenance officer notices his team keeps using the same workaround for a recurring problem. He asks them to question their assumptions and reframe the problem. He encourages new approaches and focuses on what went wrong, not on who is to blame. According to the lesson, which transformational behavior is he applying?", "o": ["Intellectual Stimulation", "Individualized Consideration", "Inspirational Motivation", "Idealized Influence"], "a": 0, "e": "Intellectual stimulation fosters creativity and innovation by questioning assumptions and reframing problems; leaders focus on the \"what\" of a problem, not \"who\" to blame."}, {"q": "Before a major inspection, a squadron commander holds a commander's call. She describes a compelling vision of what the unit can achieve. With enthusiasm and optimism, she expresses confidence that the squadron will exceed expectations. According to the lesson, which transformational behavior is she applying?", "o": ["Inspirational Motivation", "Individualized Consideration", "Intellectual Stimulation", "Idealized Influence"], "a": 0, "e": "Inspirational motivation uses enthusiasm, optimism, and a shared vision to energize followers to exert extra effort."}, {"q": "An officer consistently \"walks the talk.\" She upholds high ethical standards and puts the group's needs ahead of her own. Her people admire and trust her and try to follow her example. According to the lesson, which transformational behavior is she applying?", "o": ["Idealized Influence", "Intellectual Stimulation", "Individualized Consideration", "Inspirational Motivation"], "a": 0, "e": "Idealized influence: leaders project themselves as positive role models who \"do the right thing\" and place group interests over personal ones. It aligns closely with the Air Force core values."}, {"q": "A new flight commander wants to apply the Full-Range Leadership Model. She relies mainly on the behaviors linked to the highest performance. She uses constructive rewards and active correction when standards require them, and she avoids being a hands-off, absent leader. According to the lesson, which approach is she treating as the most effective?", "o": ["Laissez-Faire", "Transactional", "Transformational", "Management by Exception: Passive"], "a": 2, "e": "Transformational is most effective, transactional is necessary in military settings and not negative, and laissez-faire should be avoided. Leaders flex across the full range."}]}]}, {"lesson": "Professional and Unprofessional Relationships", "csobs": [{"c": "Describe professional and unprofessional relationships.", "t": "scn", "qs": [{"q": "A lieutenant seeks out a senior NCO from another squadron as a mentor. She also plays on the unit's intramural softball team with members of various ranks. Her conduct reflects the standards expected of military members and adds to unit morale. According to the lesson, how are these relationships characterized?", "o": ["Unprofessional Relationships", "Professional Relationships", "Fraternization", "Undue Familiarity"], "a": 1, "e": "Professional relationships reflect the conduct standards expected of military members. Mentoring and participation in unit events, intramural sports, and similar activities are encouraged."}, {"q": "A supervisor regularly goes to lunch and plays golf with one of his subordinates. Coworkers begin to believe that subordinate receives the best assignments. The supervisor insists he has never shown favoritism. According to the lesson, how is this relationship characterized?", "o": ["Professional Relationship", "Unprofessional Relationship", "Mentorship", "Fraternization"], "a": 1, "e": "A relationship is prohibited if it causes an actual or reasonable perception of favoritism, partiality, or unfairness — even the appearance of a buddy-boss situation can create problems."}, {"q": "A captain directs the work of a contractor employee on a base support contract. The two develop a personal relationship that compromises the integrity of the captain's supervisory authority. The captain argues that the policy covers only relationships between military members. According to the lesson, how is this relationship characterized?", "o": ["Professional Relationship", "Unprofessional Relationship", "Fraternization", "A Private Matter"], "a": 1, "e": "Unprofessional relationships can exist between officers, between enlisted members, between officers and enlisted members, between military personnel and civilian employees, or between military members and contractor personnel. Members have a duty to maintain professional relationships with contractor personnel, particularly those they supervise or direct. Fraternization applies only between an officer and an enlisted member."}]}, {"c": "Summarize the policy on professional and unprofessional relationships.", "t": "scn", "qs": [{"q": "A recruiter shares drinks with a recruit at a casual dinner and drives him home in his personal vehicle. A month after the recruit finishes technical training, the recruiter invites him to play golf. The recruiter argues that the rules ended on the day the recruit enlisted. According to the lesson, how does policy treat these activities?", "o": ["Permitted after enlistment", "Prohibited", "Permitted when off duty", "Encouraged as mentorship"], "a": 1, "e": "Recruiter/trainer prohibitions include social drinking, private vehicles, and personal sporting activities, from first contact until the later of six months after initial skills training or completing initial entry training at the first assignment."}, {"q": "A technical sergeant runs a side business outside of duty hours. He approaches Airmen who are junior to him in his flight and asks them to buy his products. He says the sales are fine because they happen off duty. According to the lesson, how does policy treat these solicited sales?", "o": ["Permitted when off duty", "Prohibited, on or off duty", "Permitted if prices are fair", "Restricted for officers only"], "a": 1, "e": "Limitation on solicited sales: members shall not knowingly solicit or make solicited sales to junior members or their families, on or off duty."}, {"q": "A commander learns that an unprofessional relationship in her unit is degrading morale. She knows she must act quickly. She wants to begin with the least severe step that is often effective before considering stronger action. According to the lesson, which action is often an effective first step?", "o": ["Court-Martial", "Counseling", "Administrative Discharge", "Nonjudicial Punishment"], "a": 1, "e": "Commanders must act swiftly; counseling is often an effective first step. If it fails, commanders may lawfully order the relationship to cease. More serious cases may warrant NJP or court-martial."}]}, {"c": "Summarize the general and specific prohibitions relating to unprofessional relationships for officers.", "t": "scn", "qs": [{"q": "A second lieutenant begins dating a staff sergeant who belongs to a different service. He argues that the relationship is allowed because they are not in the same chain of command. His commander disagrees and cites the UCMJ. According to the lesson, what is the lieutenant's relationship an example of?", "o": ["A Professional Relationship", "Fraternization", "Mentorship", "A Permitted Exception"], "a": 1, "e": "Fraternization (UCMJ Art. 134) extends to members of different services and components. Officers are specifically prohibited from dating or having sexual relations with enlisted members."}, {"q": "A captain is short on money for a car payment. He borrows $500 from an Airman in his squadron and repays it with interest the following month. He believes that repaying the loan in full settles the matter. According to the lesson, how do the prohibitions for officers treat this loan?", "o": ["Permitted because it was repaid", "Prohibited", "Permitted with commander approval", "Permitted under $1,000"], "a": 1, "e": "Specific prohibition: officers will not lend to, borrow from, or become indebted to enlisted members, with an exception only for infrequent, small, non-interest-bearing loans in exigent circumstances."}, {"q": "An officer and an enlisted member engage in a relationship that amounts to fraternization. Both took part willingly. Their commander reviews who can be held accountable for the offense of fraternization itself. According to the lesson, who is held primarily responsible?", "o": ["The Enlisted Member", "The Officer", "Both Equally", "Neither Member"], "a": 1, "e": "The officer is held primarily responsible and is the only one subject to discipline for fraternization; a consenting enlisted member can be disciplined under Article 92 for violating the instruction."}, {"q": "During a deployment, living space at a forward location is extremely limited. An officer must temporarily share quarters with enlisted members to accomplish the military operation. The commander has assessed that the arrangement is a military necessity. According to the lesson, how do the prohibitions for officers treat this arrangement?", "o": ["Never permitted", "Permitted when required for a military operation", "Permitted only with senior NCOs", "Permitted only with Secretary-level approval"], "a": 1, "e": "Officers will not share living accommodations with enlisted members except when required to accomplish a military operation; commanders assess the military necessity."}]}, {"c": "Summarize the effects of unprofessional relationships on unit cohesiveness.", "t": "scn", "qs": [{"q": "A flight commander becomes \"one of the guys\" with his Airmen. After he leaves, his successor tries to enforce standards. The Airmen answer her with mumbling instead of \"yes, sir.\" According to the lesson, which effect of undue familiarity does this show?", "o": ["Perceived favoritism in assignments", "Loss of respect for authority", "Reduced mission productivity", "Erosion of trust among peers"], "a": 1, "e": "Kansala: when a superior steps out of the leadership role through a boss-buddy relationship, subordinates lose respect and others' leadership authority is undermined."}, {"q": "In combat, a leader must give an order that carries substantial risk. There is no time for subordinates to wonder about compliance, loyalty, or the leader's motives. Colonel Kansala argues this is where professional relationships matter most. According to the lesson, what must subordinates be able to accept without question?", "o": ["The superior's integrity", "The superior's competence", "The superior's rank", "The superior's experience"], "a": 0, "e": "In combat there isn't time to worry about compliance, loyalty, or the leader's motives — the superior's integrity must be accepted without question."}, {"q": "Two members of a unit are in an unprofessional relationship that includes sexual activity. Others in the unit know about it and begin to question decisions made in the work center. The commander treats the situation as especially serious. According to the lesson, what do such relationships have increased potential to degrade?", "o": ["Unit cohesion and respect for authority", "Duty performance and promotion fairness", "Operational security and information sharing", "Family readiness and retention"], "a": 0, "e": "Sexual relationships fall under the same policy, but those that are unprofessional have increased potential to significantly degrade unit cohesion, respect for authority, and the mission."}]}]}, {"lesson": "Military Planning Fundamentals", "csobs": [{"c": "Explain why the military uses a formal planning process.", "t": "scn", "qs": [{"q": "In Operation EAGLE CLAW, planners built an overly complex rescue plan. It had insufficient rehearsals, weak weather contingencies, and no redundancy in helicopters, and it failed at Desert One. A student argues that a structured planning process could not have guaranteed success. According to the lesson, what would a formal planning process have forced?", "o": ["A simpler chain of command", "A more realistic assessment of risk", "A larger helicopter force", "A single-service operation"], "a": 1, "e": "No framework guarantees success, but a structured process minimizes risk and maximizes the chance of success by forcing realistic assessment of challenges and risks."}, {"q": "A support officer tells her supervisor that the Joint Planning Process does not matter to her because she is not a planner. Her supervisor disagrees. He explains that the process forces officers to explore alternatives, challenge assumptions, and justify their reasoning. According to the lesson, what does the process build in officers of any career field?", "o": ["Creativity and critical thinking", "Technical and tactical proficiency", "Joint qualification and credentials", "Conformity with doctrine"], "a": 0, "e": "The reader calls JPP a powerful tool for fostering creativity and critical thinking in officers regardless of career field."}, {"q": "The failure of Operation EAGLE CLAW exposed serious flaws in interservice cooperation and command structure. Congress responded with a major reform. The reform mandated \"jointness\" across the US military. According to the lesson, which reform was this?", "o": ["National Security Act of 1947", "Goldwater-Nichols Act of 1986", "Uniform Code of Military Justice", "War Powers Resolution"], "a": 1, "e": "EAGLE CLAW exposed flaws in interservice cooperation and command structure, leading directly to the Goldwater-Nichols Act of 1986."}]}, {"c": "Summarize the seven steps of the Joint Planning Process (JPP).", "t": "scn", "qs": [{"q": "A planning team has just been tasked to respond to a crisis. Its first action is to assemble the team and write a clear, concise, fact-based problem statement. The statement addresses who, what, where, when, why, and how. According to the lesson, which step of the Joint Planning Process is the team in?", "o": ["Mission Analysis", "Planning Initiation", "COA Development", "Plan or Order Development"], "a": 1, "e": "Step 1, Planning Initiation, yields a well-defined problem statement and a planning team."}, {"q": "Planners identify specified and implied tasks and map the constraints and restraints. They separate facts from assumptions, analyze centers of gravity, and develop the commander's critical information requirements. Their work ends with a brief and a restated mission statement. According to the lesson, which step of the Joint Planning Process is this?", "o": ["COA Comparison", "Mission Analysis", "COA Approval", "Planning Initiation"], "a": 1, "e": "Step 2, Mission Analysis, determines the command's true task and purpose and ends with the Mission Analysis Brief and the restated mission statement."}, {"q": "The commander has selected a course of action. The staff now uses the commander's estimate to build the concept of operations. They refine it into an operations order for subordinate commanders. According to the lesson, which step of the Joint Planning Process is this?", "o": ["COA Approval", "COA Analysis and Wargaming", "Plan or Order Development", "Mission Analysis"], "a": 2, "e": "Step 7, Plan or Order Development, produces the CONOPS and the Operations Order (OPORD)."}, {"q": "A planning team has finished wargaming its courses of action. The staff has compared them and recommended one. The team now briefs the commander, who selects the course of action the force will execute. According to the lesson, which step of the Joint Planning Process is this?", "o": ["COA Comparison", "COA Approval", "COA Development", "Plan or Order Development"], "a": 1, "e": "The seven JPP steps, in order: Planning Initiation, Mission Analysis, COA Development, COA Analysis & Wargaming, COA Comparison, COA Approval, and Plan or Order Development. In COA Approval, the commander selects the COA."}]}, {"c": "Describe the attributes of a quality course of action (COA).", "t": "scn", "qs": [{"q": "A staff proposes a course of action that would accomplish the objective. The unit, however, lacks the aircraft to carry it out. There is also not enough time to execute it. According to the lesson, which attribute of a quality course of action does it fail?", "o": ["Suitable", "Feasible", "Acceptable", "Distinguishable"], "a": 1, "e": "Feasible asks: is the COA executable within available time and space, with enough resources and the necessary skills?"}, {"q": "A planning team presents three courses of action. The second is nearly identical to the first, with only minor wording differences. It offers the commander no unique approach. According to the lesson, which attribute of a quality course of action does the second one fail?", "o": ["Complete", "Suitable", "Distinguishable", "Feasible"], "a": 2, "e": "Distinguishable asks how the COA differs from the others and whether it offers a unique approach."}, {"q": "A proposed course of action would likely seize the objective quickly. It would also cause heavy civilian casualties and violate the commander's restraints. The staff concludes the benefit is not worth the risk. According to the lesson, which attribute of a quality course of action does it fail?", "o": ["Acceptable", "Complete", "Distinguishable", "Feasible"], "a": 0, "e": "Acceptable weighs negative consequences — is the benefit worth the risk, and does it respect constraints and restraints?"}, {"q": "A course of action briefs well and would accomplish the mission. It has no time estimates and no concept for sustainment. It also lacks mission success criteria. According to the lesson, which attribute of a quality course of action is missing?", "o": ["Suitable", "Complete", "Acceptable", "Distinguishable"], "a": 1, "e": "Complete requires objectives, effects, tasks, time estimates, deployment/employment/sustainment concepts, and success criteria."}]}, {"c": "S
