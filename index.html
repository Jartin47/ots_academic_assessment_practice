ummarize the different methods used to evaluate COAs.", "t": "scn", "qs": [{"q": "A planning team runs a tabletop exercise. A Blue Team executes each friendly course of action while a Red Team reacts and counters. The exercise follows an action, reaction, counteraction sequence against the adversary's most likely and most dangerous options. According to the lesson, which method of evaluating courses of action is this?", "o": ["COA Comparison", "Wargaming", "Mission Analysis", "Commander's Estimate"], "a": 1, "e": "Wargaming is the primary mechanism of COA analysis: friendly COAs are evaluated against the most likely and most dangerous adversary COAs."}, {"q": "After the wargame, the staff rates each course of action against criteria set during mission analysis. They compare the options head-to-head in an evaluation matrix. They then recommend the one most likely to succeed. According to the lesson, which method of evaluating courses of action is this?", "o": ["Wargaming", "COA Comparison", "COA Development", "Planning Initiation"], "a": 1, "e": "COA Comparison systematically rates COAs (often pairwise in an evaluation matrix) and recommends the COA with the highest probability of success that is acceptable."}, {"q": "During a wargame, a planning team discovers a major flaw in its first course of action. The team lead stops the wargame. The team revises the course of action and starts the wargame again from the beginning. According to the lesson, which requirement of effective wargaming does this reflect?", "o": ["A Fair Environment", "An Iterative Approach", "Human Decision-Making", "Well-Developed COAs"], "a": 1, "e": "Leave the door open to refine COAs: stop, revise, and restart the wargame. The process is iterative."}]}, {"c": "Recall the purpose of wargaming.", "t": "def", "qs": [{"q": "What is the purpose of wargaming in the JPP?", "o": ["To rate each COA against the evaluation criteria and recommend one to the commander", "To reveal each COA's strengths and weaknesses against a thinking adversary", "To write the Operations Order and assign tasks to subordinate commanders", "To define the problem and separate the facts from the planning assumptions"], "a": 1, "e": "Wargaming provides a shared understanding of the OE and lets the team experience the consequences of its actions — including fog and friction — against a thinking adversary."}, {"q": "Which of the following is required for a wargame to be effective, per the reader?", "o": ["Developed COAs, human decisions, fairness, iteration", "Approved COAs, computer adjudication, scripted moves, one pass", "Evaluation criteria, a decision matrix, pairwise ratings, a recommendation", "A problem statement, specified tasks, constraints, assumptions"], "a": 0, "e": "An effective wargame requires well-developed COAs, human decision-making, a fair environment, and an iterative approach."}, {"q": "In wargaming, friendly COAs are evaluated against which adversary COAs?", "o": ["Only the most dangerous", "The most likely and most dangerous", "The most likely and least dangerous", "Every COA the adversary could choose"], "a": 1, "e": "Planners evaluate each friendly COA against the most likely and most dangerous adversary COAs using action–reaction–counteraction."}]}]}];

<script>
(function(){
'use strict';
// ---------- data: every question belongs to one CSOB ----------
function hash(s){ let h = 5381; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const ALL = [], CSOBS = [], BYID = {};
BANK.forEach((L, li) => L.csobs.forEach(c => {
  const cs = {key: 'c' + hash(L.lesson + '|' + c.c), li, lesson: L.lesson, text: c.c, type: c.t, qs: []};
  CSOBS.push(cs);
  c.qs.forEach(q => {
    const o = {id: 'k' + hash(q.q), li, lesson: L.lesson, ck: cs.key, csob: c.c, type: c.t, q: q.q, o: q.o, a: q.a, e: q.e};
    cs.qs.push(o); ALL.push(o); BYID[o.id] = o;
  });
}));
const NAMES = BANK.map(L => L.lesson);
const EXAM_N = 50, EXAM_MIN = 90, PASS_PCT = 70;
const app = document.getElementById('app');
const hdr = document.getElementById('hdrInfo');

// ---------- storage (this browser only; everything still works without it) ----------
function load(k, d){
  try{
    let v = localStorage.getItem('otsq-' + k);
    if(v === null) v = localStorage.getItem('as400q-' + k); // data saved by the earlier version
    if(v === null) return d;
    const r = JSON.parse(v); return r === null ? d : r;
  }catch(e){ return d; }
}
function save(k, v){ try{ localStorage.setItem('otsq-' + k, JSON.stringify(v)); }catch(e){} }

let setup = (() => { const s = load('setup2', {}); return {
  mode: s.mode === 'exam' ? 'exam' : 'practice',
  lessons: Array.isArray(s.lessons) ? s.lessons.filter(n => NAMES.includes(n)) : NAMES.slice(),
  type: ['all','def','scn'].includes(s.type) ? s.type : 'all',
  count: ['10','25','all'].includes(s.count) ? s.count : 'all'
}; })();
let seen = load('seen', {});   // question id -> times served
let stats = load('stats', {}); // CSOB key -> {n answered, c correct}
let exams = load('exams', []); // [{t, c, n}]
let run = null;                // active attempt
let res = null;                // last graded attempt, for the debrief
let timerId = null;
let askReset = false;

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rnd(n){ // unbiased integer in [0, n)
  try{ const lim = Math.floor(4294967296 / n) * n, b = new Uint32Array(1); do{ crypto.getRandomValues(b); }while(b[0] >= lim); return b[0] % n; }
  catch(e){ return Math.floor(Math.random() * n); } }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const times = q => seen[q.id] || 0;
function fresh(a){ return shuffle(a).sort((x, y) => times(x) - times(y)); } // random, least-served first
function markSeen(qs){ qs.forEach(q => { seen[q.id] = (seen[q.id] || 0) + 1; }); save('seen', seen); }
const KEYS = ['A','B','C','D','E','F'];
const typeName = t => t === 'def' ? 'Definition' : 'Scenario';
const isRight = x => x.pick !== null && x.order[x.pick] === x.a;
const passed = (c, n) => n > 0 && c * 100 >= PASS_PCT * n;
const pctStr = (c, n) => n ? String(Math.floor(c * 1000 / n) / 10) : '0'; // rounds down, so 69.9 never reads as 70
function fmt(s){ s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(x).padStart(2, '0'); }
function prep(q){ return Object.assign({}, q, {order: shuffle(q.o.map((_, i) => i)), pick: null, flag: false}); }
function bump(q, ok){ const s = stats[q.ck] = stats[q.ck] || {n: 0, c: 0}; s.n++; if(ok) s.c++; }
function render(html, focus){
  app.innerHTML = html;
  const el = focus && app.querySelector(focus);
  if(el){ try{ el.focus({preventScroll: true}); }catch(e){ el.focus(); } }
}

// ---------- drawing questions ----------
function poolFor(){
  return ALL.filter(q => setup.lessons.includes(q.lesson) && (setup.type === 'all' || q.type === setup.type));
}
// practice: n questions, least-served first, spread evenly across the CSOBs in the pool
function drawFresh(pool, n){
  if(n >= pool.length) return shuffle(pool);
  const groups = {}; pool.forEach(q => (groups[q.ck] = groups[q.ck] || []).push(q));
  const lists = shuffle(Object.keys(groups)).map(k => fresh(groups[k]));
  const round = []; // interleave so each CSOB contributes in turn
  for(let i = 0; round.length < pool.length; i++) lists.forEach(l => { if(i < l.length) round.push(l[i]); });
  const minT = Math.min(...pool.map(times)), picked = [];
  for(let t = minT; picked.length < n; t++) round.filter(q => times(q) === t).forEach(q => { if(picked.length < n) picked.push(q); });
  return shuffle(picked);
}
// Any set shorter than the full pool aims for 80% scenario / 20% definition. If the pool is short of
// one type (for example, lessons that only have definition CSOBs), the other type fills the gap.
const SCN_SHARE = 0.8;
function mixCounts(pool, n){
  const scn = pool.filter(q => q.type === 'scn'), def = pool.filter(q => q.type === 'def');
  n = Math.min(n, pool.length);
  const nDef = Math.min(def.length, Math.max(n - scn.length, n - Math.round(n * SCN_SHARE)));
  return {scn, def, nScn: n - nDef, nDef};
}
function drawMix(pool, n){
  if(n >= pool.length) return shuffle(pool);
  const m = mixCounts(pool, n);
  return shuffle(drawFresh(m.scn, m.nScn).concat(drawFresh(m.def, m.nDef)));
}
// exam: the same 80/20 mix across the whole bank, spread over the CSOBs, with every lesson represented.
// A lesson that the scenario questions did not reach (definition-only lessons, mainly) gets one of the
// definition slots first; the rest of the definition slots go to the least-served definition questions.
function examDraw(){
  const m = mixCounts(ALL, EXAM_N);
  const scn = drawFresh(m.scn, m.nScn), def = [];
  const covered = new Set(scn.map(q => q.lesson));
  NAMES.forEach(name => {
    if(covered.has(name) || def.length >= m.nDef) return;
    const q = fresh(m.def.filter(q => q.lesson === name))[0];
    if(q){ def.push(q); covered.add(name); }
  });
  const used = new Set(def.map(q => q.id));
  drawFresh(m.def.filter(q => !used.has(q.id)), m.nDef - def.length).forEach(q => def.push(q));
  return shuffle(scn.concat(def));
}
const ratio = cs => stats[cs.key].c / stats[cs.key].n;
function weakCsobs(){
  return CSOBS.filter(cs => stats[cs.key] && stats[cs.key].n > 0 && !passed(stats[cs.key].c, stats[cs.key].n))
    .sort((a, b) => ratio(a) - ratio(b) || stats[b.key].n - stats[a.key].n);
}

// ---------- saving and resuming an attempt ----------
function saveRun(){
  if(!run || run.done){ save('run', null); return; }
  save('run', {mode: run.mode, label: run.label, i: run.i, end: run.end || null, qs: run.qs.map(q => [q.id, q.order, q.pick, q.flag ? 1 : 0])});
}
function restoreRun(){
  const s = load('run', null);
  if(!s || !Array.isArray(s.qs) || !s.qs.length) return null;
  const qs = [];
  for(const row of s.qs){
    const q = BYID[row[0]], order = row[1];
    if(!q || !Array.isArray(order) || order.length !== q.o.length) return null; // question bank changed
    qs.push(Object.assign({}, q, {order, pick: row[2] === null || row[2] === undefined ? null : +row[2], flag: !!row[3]}));
  }
  const exam = s.mode === 'exam';
  if(exam && !s.end) return null;
  return {mode: exam ? 'exam' : 'practice', label: s.label || (exam ? 'Timed exam' : 'Practice'), i: Math.min(Math.max(0, s.i | 0), qs.length - 1), end: s.end, qs, confirm: false, resumed: true};
}
window.addEventListener('beforeunload', e => {
  if(run && !run.done && (run.mode === 'exam' || run.qs.some(x => x.pick !== null))){ e.preventDefault(); e.returnValue = ''; }
});

// ---------- setup view ----------
function viewSetup(focus){
  stopTimer(); hdr.hidden = true; run = null; save('run', null);
  const pool = poolFor();
  const counts = NAMES.map(n => ALL.filter(q => q.lesson === n).length);
  const lessonPct = name => { let n = 0, c = 0; CSOBS.forEach(cs => { const s = stats[cs.key]; if(cs.lesson === name && s){ n += s.n; c += s.c; } }); return n ? Math.floor(c * 100 / n) : null; };
  const isExam = setup.mode === 'exam';
  const em = mixCounts(ALL, EXAM_N);
  const pn = Math.min(pool.length, setup.count === 'all' ? pool.length : +setup.count), pm = mixCounts(pool, pn);
  const mixText = m => [m.nScn ? `${m.nScn} scenario` : '', m.nDef ? `${m.nDef} definition` : ''].filter(Boolean).join(', ');
  const weak = weakCsobs();
  const best = exams.reduce((m, e) => Math.max(m, e.c / e.n), 0), last = exams[exams.length - 1];
  const oldBest = exams.length ? 0 : load('bestExam', 0);
  const hasRecord = exams.length || oldBest || Object.keys(stats).length;
  render(`
  <div class="stack">
    <section class="panel stack">
      <div><p class="eyebrow">Mission setup</p><h2>Choose how you want to study</h2>
      <p class="muted">${ALL.length} questions written to ${CSOBS.length} CSOBs across ${BANK.length} lessons.</p></div>
      <div class="modes" role="group" aria-label="Quiz mode">
        <button class="mode" id="m-practice" aria-pressed="${!isExam}"><strong>Practice</strong><span>Pick lessons. Instant feedback, the explanation and the CSOB after every answer.</span></button>
        <button class="mode" id="m-exam" aria-pressed="${isExam}"><strong>Timed exam</strong><span>${EXAM_N} questions from every lesson, about 80% scenario and 20% definition. ${EXAM_MIN}-minute clock, graded at the end. ${PASS_PCT}% to pass.</span></button>
      </div>
    </section>
    <section class="panel stack" ${isExam ? 'hidden' : ''}>
      <fieldset>
        <legend class="bar" style="width:100%"><h3>Lessons</h3><span class="row"><button class="btn link" id="selAll">Select all</button><button class="btn link" id="selNone">Clear</button></span></legend>
        <div class="lessons">${NAMES.map((name, i) => { const p = lessonPct(name); return `<label for="ls-${i}"><input type="checkbox" id="ls-${i}" data-li="${i}" ${setup.lessons.includes(name) ? 'checked' : ''}><span>${esc(name)}</span><span class="n">${counts[i]}${p === null ? '' : ` · ${p}%`}</span></label>`; }).join('')}</div>
        <p class="muted" style="font-size:.85rem;margin-top:8px">Number = questions in the lesson. Percent = your running score on it in this browser.</p>
      </fieldset>
      <div class="row" style="justify-content:space-between">
        <div class="row"><span class="muted">Question type</span>
          <span class="seg" role="group" aria-label="Question type">${[['all','All'],['def','Definition'],['scn','Scenario']].map(([v, t]) => `<button data-type="${v}" aria-pressed="${setup.type === v}">${t}</button>`).join('')}</span></div>
        <div class="row"><span class="muted">Length</span>
          <span class="seg" role="group" aria-label="Number of questions">${[['10','10'],['25','25'],['all','All']].map(([v, t]) => `<button data-count="${v}" aria-pressed="${setup.count === v}">${t}</button>`).join('')}</span></div>
      </div>
    </section>
    <section class="panel bar">
      <p id="summary" class="muted">${isExam ? `${EXAM_N} questions · ${EXAM_MIN} minutes · ${mixText(em)}` : pn < pool.length ? `${pn} of ${pool.length} available questions · ${mixText(pm)}` : `All ${pool.length} available questions`}</p>
      <button class="btn primary" id="start" ${!isExam && !pool.length ? 'disabled' : ''}>${isExam ? 'Start exam' : 'Start practice'}</button>
    </section>
    ${hasRecord ? `<section class="panel stack">
      <div class="bar"><h3>Your record</h3>${askReset
        ? `<span class="row"><span class="muted" style="font-size:.9rem">Erase all scores and history?</span><button class="btn link" id="resetYes">Erase</button><button class="btn link" id="resetNo">Keep</button></span>`
        : `<button class="btn link" id="reset">Reset history</button>`}</div>
      ${exams.length ? `<p>Best exam <b>${pctStr(Math.round(best * 1000), 1000)}%</b> · Last exam <b>${pctStr(last.c, last.n)}%</b> <span class="pass ${passed(last.c, last.n) ? 'y' : 'n'}">${passed(last.c, last.n) ? 'Pass' : 'Below 70%'}</span> · ${exams.length} exam${exams.length > 1 ? 's' : ''} taken</p>`
        : oldBest ? `<p>Best exam <b>${oldBest}%</b></p>` : `<p class="muted">No timed exams taken yet.</p>`}
      ${weak.length ? `<div class="stack" style="gap:10px"><p class="eyebrow" style="margin:0">CSOBs below ${PASS_PCT}%</p>
        <ul class="weak">${weak.slice(0, 5).map(cs => `<li><span>${esc(cs.text)}<br><span class="muted" style="font-size:.85rem">${esc(cs.lesson)}</span></span><span class="n">${stats[cs.key].c}/${stats[cs.key].n}</span></li>`).join('')}</ul>
        <div class="row"><button class="btn ghost" id="weakGo">Practice ${weak.length === 1 ? 'this CSOB' : `all ${weak.length} weak CSOBs`}</button></div></div>`
        : Object.keys(stats).length ? `<p class="muted">No CSOB is below ${PASS_PCT}% right now.</p>` : ''}
    </section>` : ''}
  </div>
  <footer>Questions are written to the CSOBs in the OTS student readers, drawing on AFH 1 and the assigned readings where a CSOB depends on them. Answer order is shuffled on every attempt. Scores and unfinished attempts are saved in this browser only.</footer>`, focus);
  const $ = s => app.querySelector(s);
  const persist = () => save('setup2', setup);
  $('#m-practice').onclick = () => { setup.mode = 'practice'; persist(); viewSetup('#m-practice'); };
  $('#m-exam').onclick = () => { setup.mode = 'exam'; persist(); viewSetup('#m-exam'); };
  app.querySelectorAll('[data-li]').forEach(cb => cb.onchange = () => {
    const name = NAMES[+cb.dataset.li];
    setup.lessons = cb.checked ? NAMES.filter(n => n === name || setup.lessons.includes(n)) : setup.lessons.filter(n => n !== name);
    persist(); viewSetup('#' + cb.id);
  });
  $('#selAll').onclick = e => { e.preventDefault(); setup.lessons = NAMES.slice(); persist(); viewSetup('#selAll'); };
  $('#selNone').onclick = e => { e.preventDefault(); setup.lessons = []; persist(); viewSetup('#selNone'); };
  app.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { setup.type = b.dataset.type; persist(); viewSetup(`[data-type="${setup.type}"]`); });
  app.querySelectorAll('[data-count]').forEach(b => b.onclick = () => { setup.count = b.dataset.count; persist(); viewSetup(`[data-count="${setup.count}"]`); });
  $('#start').onclick = () => isExam ? startExam() : startPractice(pool);
  if($('#weakGo')) $('#weakGo').onclick = () => { const keys = new Set(weak.map(c => c.key)); startPractice(ALL.filter(q => keys.has(q.ck)), 'Weak-CSOB practice', 25); };
  if($('#reset')) $('#reset').onclick = () => { askReset = true; viewSetup('#resetNo'); };
  if($('#resetNo')) $('#resetNo').onclick = () => { askReset = false; viewSetup('#reset'); };
  if($('#resetYes')) $('#resetYes').onclick = () => {
    askReset = false; seen = {}; stats = {}; exams = [];
    save('seen', seen); save('stats', stats); save('exams', exams); save('bestExam', 0);
    viewSetup('#start');
  };
}

function startPractice(pool, label, limit){
  const n = limit || (!label && setup.count !== 'all' ? +setup.count : pool.length);
  const qs = drawMix(pool, n);
  markSeen(qs);
  run = {mode: 'practice', qs: qs.map(prep), i: 0, label: label || 'Practice'};
  saveRun(); viewQuestion('#qtext'); window.scrollTo(0, 0);
}
function startExam(){
  const drawn = examDraw(); markSeen(drawn);
  run = {mode: 'exam', qs: drawn.map(prep), i: 0, label: 'Timed exam', end: Date.now() + EXAM_MIN * 60000, confirm: false};
  saveRun(); startTimer(); viewQuestion('#qtext'); window.scrollTo(0, 0);
}

function startTimer(){
  stopTimer(); hdr.hidden = false;
  const tick = () => {
    if(!run || run.mode !== 'exam' || run.done){ stopTimer(); return; }
    const left = Math.round((run.end - Date.now()) / 1000);
    hdr.textContent = fmt(left) + ' left';
    hdr.classList.toggle('low', left <= 600);
    if(left <= 0) finish(true);
  };
  tick(); if(run && !run.done) timerId = setInterval(tick, 1000);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

// ---------- question view ----------
// The lesson and CSOB stay hidden until the question is answered (practice) or the exam is graded.
function viewQuestion(focus){
  const r = run, q = r.qs[r.i], n = r.qs.length, exam = r.mode === 'exam';
  const answered = q.pick !== null, showFb = !exam && answered;
  const done = r.qs.filter(x => x.pick !== null).length;
  const note = r.resumed ? `<p class="note" role="status">Picked up where you left off.${exam ? ' The clock kept running while you were away.' : ''}</p>` : '';
  r.resumed = false;
  render(`
  <div class="stack">
    ${note}
    <div class="stack" style="gap:8px">
      <div class="bar"><p class="eyebrow" style="margin:0">${esc(r.label)} · Question ${r.i + 1} of ${n}</p>
        <span class="muted" style="font-size:.9rem">${exam ? `${done} answered` : `${r.qs.filter(isRight).length} correct so far`}</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${(exam ? done : r.i + (answered ? 1 : 0)) / n * 100}%"></i></div>
    </div>
    <article class="panel stack">
      <p class="qtext" id="qtext" tabindex="-1">${esc(q.q)}</p>
      <ul class="choices" role="list" aria-labelledby="qtext">
        ${q.order.map((oi, k) => {
          let cls = '';
          if(showFb){ if(oi === q.a) cls = 'right'; else if(k === q.pick) cls = 'wrong'; }
          else if(k === q.pick) cls = 'sel';
          return `<li><button class="choice ${cls}" data-k="${k}" ${showFb ? 'disabled' : ''} aria-pressed="${k === q.pick}"><span class="key">${KEYS[k]}</span><span>${esc(q.o[oi])}</span></button></li>`;
        }).join('')}
      </ul>
      ${showFb ? (() => { const ok = isRight(q); return `<div class="feedback ${ok ? 'ok' : 'no'}" role="status"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${ok ? '' : `The answer is ${KEYS[q.order.indexOf(q.a)]}. `}${esc(q.e)}
        <div class="fbmeta"><div class="tags"><span class="tag">${esc(q.lesson)}</span><span class="tag ${q.type}">${typeName(q.type)}</span></div>
        <p class="csob"><span class="eyebrow" style="font-size:.7rem">CSOB</span><br>${esc(q.csob)}</p></div></div>`; })() : ''}
      <div class="bar">
        <div class="row">
          ${exam ? `<button class="btn ghost" id="prev" ${r.i === 0 ? 'disabled' : ''}>Previous</button><button class="btn ghost" id="flag" aria-pressed="${q.flag}">${q.flag ? 'Unflag' : 'Flag for review'}</button>` : `<button class="btn ghost" id="quit">End session</button>`}
        </div>
        <div class="row">
          ${exam ? (r.i < n - 1 ? `<button class="btn primary" id="next">Next</button>` : `<button class="btn primary" id="submit">Submit exam</button>`)
                 : `<button class="btn primary" id="next" ${answered ? '' : 'disabled'}>${r.i < n - 1 ? 'Next question' : 'See results'}</button>`}
        </div>
      </div>
      ${exam && r.confirm ? confirmBox() : ''}
    </article>
    ${exam ? `<section class="panel stack"><div class="bar"><h3>Question map</h3><button class="btn link" id="submit2">Submit exam</button></div><div class="nav">${r.qs.map((x, i) => `<button data-go="${i}" class="${x.pick !== null ? 'ans' : ''} ${i === r.i ? 'cur' : ''} ${x.flag ? 'flag' : ''}" aria-label="Question ${i + 1}${x.pick !== null ? ', answered' : ''}${x.flag ? ', flagged' : ''}"${i === r.i ? ' aria-current="true"' : ''}>${i + 1}</button>`).join('')}</div><p class="muted" style="font-size:.88rem">Shaded = answered · dot = flagged. You can change answers until you submit. Your progress is saved if this page closes.</p></section>` : ''}
  </div>`, focus);
  const $ = s => app.querySelector(s);
  const go = i => { r.i = i; r.confirm = false; saveRun(); viewQuestion('#qtext'); };
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if(!exam && q.pick !== null) return;
    q.pick = +b.dataset.k;
    if(!exam){ bump(q, isRight(q)); save('stats', stats); }
    saveRun(); viewQuestion(exam ? `.choice[data-k="${q.pick}"]` : '#next');
  });
  if($('#next')) $('#next').onclick = () => { if(r.i < n - 1){ go(r.i + 1); window.scrollTo(0, 0); } else finish(false); };
  if($('#prev')) $('#prev').onclick = () => { go(r.i - 1); window.scrollTo(0, 0); };
  if($('#flag')) $('#flag').onclick = () => { q.flag = !q.flag; saveRun(); viewQuestion('#flag'); };
  if($('#quit')) $('#quit').onclick = () => { if(r.qs.some(x => x.pick !== null)) finish(false, true); else viewSetup('#start'); };
  [$('#submit'), $('#submit2')].forEach(b => b && (b.onclick = () => { r.confirm = true; viewQuestion('#cancelSubmit'); app.querySelector('.confirm').scrollIntoView({block: 'center'}); }));
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
  if($('#cancelSubmit')) $('#cancelSubmit').onclick = () => { r.confirm = false; viewQuestion($('#submit') ? '#submit' : '#submit2'); };
  if($('#doSubmit')) $('#doSubmit').onclick = () => finish(false);
}
function confirmBox(){
  const r = run, un = r.qs.filter(x => x.pick === null).length, fl = r.qs.filter(x => x.flag).length;
  return `<div class="confirm" role="alertdialog" aria-label="Confirm submission"><p><b>Submit your exam?</b> ${un ? `${un} question${un > 1 ? 's are' : ' is'} unanswered and will be marked wrong.` : 'All questions are answered.'}${fl ? ` ${fl} flagged for review.` : ''}</p><div class="row"><button class="btn primary" id="doSubmit">Submit and grade</button><button class="btn ghost" id="cancelSubmit">Keep working</button></div></div>`;
}

// ---------- grading and debrief ----------
function finish(timeUp, early){
  const r = run; r.done = true; stopTimer(); save('run', null);
  const exam = r.mode === 'exam';
  const graded = early ? r.qs.filter(x => x.pick !== null) : r.qs;
  const right = graded.filter(isRight);
  if(exam){ // practice answers were scored as they were given
    graded.forEach(x => bump(x, isRight(x))); save('stats', stats);
    exams.push({t: Date.now(), c: right.length, n: graded.length}); exams = exams.slice(-30); save('exams', exams);
  }
  res = {r, exam, timeUp, graded, right,
    missed: graded.filter(x => !isRight(x)), flagged: graded.filter(x => x.flag),
    used: exam ? Math.min(EXAM_MIN * 60, Math.round((Date.now() - (r.end - EXAM_MIN * 60000)) / 1000)) : null};
  hdr.hidden = !exam;
  if(exam){ hdr.textContent = timeUp ? 'Time expired' : 'Submitted'; hdr.classList.remove('low'); }
  viewResults(res.missed.length ? 'missed' : 'all', '#resH');
  window.scrollTo(0, 0);
}
function viewResults(filter, focus){
  const {r, exam, timeUp, graded, right, missed, flagged, used} = res;
  const tally = keyOf => { const by = {}; graded.forEach(x => { const k = keyOf(x); const v = by[k.id] = by[k.id] || {n: 0, c: 0, name: k.name, sub: k.sub}; v.n++; if(isRight(x)) v.c++; }); return Object.values(by).sort((a, b) => a.c / a.n - b.c / b.n || a.name.localeCompare(b.name)); };
  const byLesson = tally(x => ({id: x.lesson, name: x.lesson}));
  const byCsob = tally(x => ({id: x.ck, name: x.csob, sub: x.lesson}));
  const table = (rows, head) => `<div class="tablebox"><table class="byl"><thead><tr><th>${head}</th><th class="num">Correct</th><th class="num">Score</th></tr></thead><tbody>
    ${rows.map(v => `<tr><td>${esc(v.name)}${v.sub ? `<br><span class="muted" style="font-size:.85rem">${esc(v.sub)}</span>` : ''}</td><td class="num">${v.c}/${v.n}</td><td class="num">${pctStr(v.c, v.n)}%</td></tr>`).join('')}
    </tbody></table></div>`;
  const tabs = [['missed', 'Missed', missed], ['flagged', 'Flagged', flagged], ['all', 'All', graded]].filter(t => t[0] === 'all' || t[2].length);
  const list = (tabs.find(t => t[0] === filter) || tabs[tabs.length - 1])[2];
  const card = x => { const ok = isRight(x); return `
    <div class="miss"><div class="tags"><span class="tag ${ok ? 'good' : 'bad'}">${ok ? 'Correct' : x.pick === null ? 'Not answered' : 'Missed'}</span>${x.flag ? '<span class="tag scn">Flagged</span>' : ''}<span class="tag">${esc(x.lesson)}</span><span class="tag ${x.type}">${typeName(x.type)}</span></div>
      <p style="font-weight:600">${esc(x.q)}</p>
      <p class="ans">${x.pick === null ? '<span class="n">Not answered</span>' : `Your answer: <span class="${ok ? 'y' : 'n'}">${esc(x.o[x.order[x.pick]])}</span>`}${ok ? '' : `<br>Correct: <span class="y">${esc(x.o[x.a])}</span>`}</p>
      <p class="muted" style="font-size:.95rem">${esc(x.e)}</p>
      <p class="csob"><span class="eyebrow" style="font-size:.7rem">CSOB</span><br>${esc(x.csob)}</p></div>`; };
  const ok = passed(right.length, graded.length);
  render(`
  <div class="stack">
    <section class="panel stack">
      <p class="eyebrow" id="resH" tabindex="-1">Debrief · ${esc(r.label)}${timeUp ? ' · time expired, auto-submitted' : ''}</p>
      <div class="score"><span class="big">${pctStr(right.length, graded.length)}%</span><span>${right.length} of ${graded.length} correct${used !== null ? ` · ${fmt(used)} used` : ''}</span>${exam ? `<span class="pass ${ok ? 'y' : 'n'}">${ok ? `Pass · ${PASS_PCT}% minimum` : `Below the ${PASS_PCT}% minimum`}</span>` : ''}</div>
      <div class="row">
        ${missed.length ? `<button class="btn primary" id="retry">Practice the ${missed.length} missed</button>` : ''}
        <button class="btn ghost" id="again">${exam ? 'New exam' : 'New session'}</button>
        <button class="btn ghost" id="home">Back to setup</button>
      </div>
    </section>
    <section class="panel stack"><h3>By lesson</h3>${table(byLesson, 'Lesson')}
      <details><summary>By CSOB (${byCsob.length})</summary>${table(byCsob, 'CSOB')}</details>
    </section>
    <section class="panel stack">
      <div class="bar"><h3>Review questions</h3>
        <span class="seg" role="group" aria-label="Which questions to review">${tabs.map(t => `<button data-f="${t[0]}" aria-pressed="${t[2] === list}">${t[1]} (${t[2].length})</button>`).join('')}</span></div>
      ${!missed.length ? `<p>Clean sweep. No missed questions.</p>` : ''}
      ${list.map(card).join('')}
    </section>
  </div>`, focus);
  const $ = s => app.querySelector(s);
  if($('#retry')) $('#retry').onclick = () => startPractice(missed.map(x => BYID[x.id]), 'Missed-question review');
  $('#again').onclick = () => exam ? startExam() : startPractice(poolFor());
  $('#home').onclick = () => viewSetup('#start');
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => viewResults(b.dataset.f, `[data-f="${b.dataset.f}"]`));
}

// keyboard: A-D / 1-4 to answer, Enter for next
document.addEventListener('keydown', e => {
  if(!run || run.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  const k = e.key.toUpperCase(); let idx = k.length === 1 ? 'ABCD'.indexOf(k) : -1; if(idx < 0 && k.length === 1 && '1234'.includes(k)) idx = +k - 1;
  if(idx >= 0){ const b = app.querySelector(`.choice[data-k="${idx}"]`); if(b && !b.disabled){ b.click(); e.preventDefault(); } }
  else if(e.key === 'Enter'){ const n = app.querySelector('#next'); if(n && !n.disabled && document.activeElement?.tagName !== 'BUTTON'){ n.click(); e.preventDefault(); } }
});

// ---------- start: pick an unfinished attempt back up, or show setup ----------
run = restoreRun();
if(run && run.mode === 'exam'){ if(Date.now() >= run.end) finish(true); else { startTimer(); viewQuestion('#qtext'); } }
else if(run) viewQuestion('#qtext');
else viewSetup();
})();
</script>

</body>
</html>
