<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTS Academic Assessment Practice Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single briefing column (max ~760px) — a header strip, then one working panel that swaps between setup, question and debrief views. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#d5dbe6;
  --ink:#141b2d; --muted:#56607a; --navy:#1d2b5c; --navy-ink:#ffffff;
  --accent:#2f5bd3; --accent-soft:#e3eafc; --amber:#b86e00; --amber-soft:#fdf0db;
  --good:#1f7a4d; --good-soft:#e2f4ea; --bad:#b3261e; --bad-soft:#fbe5e3;
  --display:"Saira Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d31; --surface-2:#1b2339; --line:#2b3552;
  --ink:#e7ebf5; --muted:#9aa5c0; --navy:#22305f; --navy-ink:#ffffff;
  --accent:#7d9ff5; --accent-soft:#223060; --amber:#f0aa45; --amber-soft:#3a2b12;
  --good:#5ccf93; --good-soft:#163527; --bad:#ff8a80; --bad-soft:#3d1a1a; --on-accent:#0e1322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --surface-2:#1b2339; --line:#2b3552;
  --ink:#e7ebf5; --muted:#9aa5c0; --navy:#22305f; --navy-ink:#ffffff;
  --accent:#7d9ff5; --accent-soft:#223060; --amber:#f0aa45; --amber-soft:#3a2b12;
  --good:#5ccf93; --good-soft:#163527; --bad:#ff8a80; --bad-soft:#3d1a1a; --on-accent:#0e1322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
header.strip{background:var(--navy);color:var(--navy-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 16px}
.wrap{max-width:780px;margin:0 auto}
main.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.strip .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:.02em;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;opacity:.78;letter-spacing:0;margin-top:3px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:600;color:var(--muted);margin:0 0 6px}
h2{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
p{margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;color:var(--ink);font:inherit}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode strong{font-family:var(--display);font-size:1.15rem;font-weight:700}
.mode span{font-size:.92rem;color:var(--muted)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:8px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}
.lessons label{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;cursor:pointer;font-size:.97rem;min-width:0}
.lessons input{margin-top:5px;accent-color:var(--accent)}
.lessons .n{color:var(--muted);font-family:var(--mono);font-size:.78rem;margin-left:auto;padding-left:6px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.92rem;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 18px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.link{background:none;border:0;color:var(--accent);padding:4px 2px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.mode:focus-visible,.seg button:focus-visible,.choice:focus-visible,.nav button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.timer{font-family:var(--mono);font-weight:600;font-size:1.05rem;padding:4px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--display);font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.scn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.tag.def{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.csob{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.qtext{font-size:1.18rem;font-weight:600;line-height:1.45}
.choices{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .key{font-family:var(--mono);font-weight:600;font-size:.85rem;flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:5px;background:var(--surface);border:1px solid var(--line)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.feedback{border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2)}
.feedback.ok{border-color:var(--good)}
.feedback.no{border-color:var(--bad)}
.feedback b{font-family:var(--display);letter-spacing:.03em}
.feedback.ok b{color:var(--good)} .feedback.no b{color:var(--bad)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.nav button{font-family:var(--mono);font-size:.8rem;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;position:relative}
.nav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.nav button.cur{outline:2px solid var(--ink);outline-offset:1px}
.nav button.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1}
.pass{font-family:var(--display);font-weight:600;padding:3px 10px;border-radius:4px}
.pass.y{background:var(--good-soft);color:var(--good)} .pass.n{background:var(--bad-soft);color:var(--bad)}
table.byl{width:100%;border-collapse:collapse;font-size:.95rem}
table.byl th,table.byl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
table.byl td.num,table.byl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablebox{overflow-x:auto}
.miss{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.miss .ans{font-size:.95rem}
.miss .ans .y{color:var(--good);font-weight:600} .miss .ans .n{color:var(--bad);font-weight:600}
.confirm{border:1.5px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
footer{color:var(--muted);font-size:.85rem;margin-top:22px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:520px){.panel{padding:16px}.qtext{font-size:1.08rem}.score .big{font-size:2.6rem}}
</style>
</head>

  <div class="wrap">
    <h1 class="brand">OTS Academic Assessment Practice Test<small>Cognitive samples of behavior · AY25–26 student readers</small></h1>
    <span id="hdrInfo" class="timer" hidden></span>
  </div>
</header>

<script>
const BANK = [{"lesson": "What Is War", "csobs": [{"c": "Identify the three enduring truths that describe the fundamental nature of war.", "t": "def", "qs": [{"q": "Which set lists Clausewitz's three enduring truths about the nature of war?", "o": ["War is an instrument of policy; war is a complex and chaotic human endeavor; war is a clash of opposing wills", "War is a duel; war is a political act; war is a contest of technology", "War is governed by fog, friction, and chance in equal measure", "War is fought at the strategic, operational, and tactical levels"], "a": 0, "e": "The reader names three enduring truths: war is an instrument of policy, war is a complex and chaotic human endeavor, and war is a clash of opposing wills."}, {"q": "The enduring truth that war \"always starts from a political condition and political motive\" is which truth?", "o": ["War is a clash of opposing wills", "War is an instrument of policy", "War is a complex and chaotic human endeavor", "War is a duel on an extensive scale"], "a": 1, "e": "Enduring Truth #1: war is an instrument of policy. The original political motive must be the first and highest consideration in the conduct of war."}, {"q": "Which enduring truth describes war as waged against \"a living, calculating, and adaptive opponent\"?", "o": ["War is an instrument of policy", "War is a complex and chaotic human endeavor", "War is a clash of opposing wills", "War is the continuation of commerce"], "a": 2, "e": "Enduring Truth #3: war is a clash of opposing wills — always the shock of two hostile bodies in collision."}]}, {"c": "Identify the two basic themes of war.", "t": "def", "qs": [{"q": "According to Clausewitz, what are the two basic themes of war?", "o": ["Policy and violence", "Its nature and its character", "Traditional and irregular", "Ends and means"], "a": 1, "e": "The two basic themes of war are its nature (unchanging) and its character (constantly changing)."}, {"q": "Which term describes the aspect of war that is unchanging and a permanent part of the human condition?", "o": ["Character of war", "Form of war", "Nature of war", "Level of war"], "a": 2, "e": "The nature of war is unchanging: a human activity using violence, or the threat of it, to achieve a political objective."}, {"q": "The \"character of war\" refers to:", "o": ["The political objective that justifies the war", "How warfare is conducted", "The passion of the people", "The unchanging violent essence of war"], "a": 1, "e": "Character describes how warfare is conducted and is in constant flux — e.g., tanks and airplanes in WWI, drones in Russia-Ukraine."}]}, {"c": "List the three factors that dominate war.", "t": "def", "qs": [{"q": "What are the three factors that dominate war?", "o": ["Fog, friction, and chance", "Policy, violence, and will", "Diplomatic, informational, and military", "Mass, maneuver, and surprise"], "a": 0, "e": "Danger and human exertion create friction, leading to the factors that dominate war: fog, friction, and chance."}, {"q": "\"The accumulation of thousands of little things that force plans to go awry\" defines:", "o": ["Fog", "Chance", "Friction", "Clash of wills"], "a": 2, "e": "Friction is the accumulation of little things that force plans to go awry, as in Operation Barbarossa."}, {"q": "Which factor that dominates war is defined as \"the imperfect knowledge within warfare\"?", "o": ["Friction", "Fog", "Chance", "Character"], "a": 1, "e": "Fog is the imperfect knowledge within warfare — how hard it is to see and understand what is happening once battle starts."}]}, {"c": "Differentiate between the traditional and irregular forms of warfare.", "t": "scn", "qs": [{"q": "Two nation-states mass armored divisions and air forces against each other, each seeking to destroy the other's military and force surrender in decisive battle. Which form of warfare is this?", "o": ["Irregular warfare, because it is violent", "Traditional warfare, because it is a force-on-force struggle for domination between nation-states", "Irregular warfare, because it seeks to weary out the enemy", "Hybrid warfare, which the reader identifies as the third form"], "a": 1, "e": "Traditional warfare is a violent struggle for domination between nation-states using force-on-force conventional capabilities to disarm the enemy (e.g., Austerlitz, 1805)."}, {"q": "A non-state insurgent group cannot defeat a superior conventional army in open battle, so it uses guerrilla raids over years to drain the occupier's resources and win support of the local population. This is best described as:", "o": ["Traditional warfare aimed at disarming the enemy through decisive battle", "Irregular warfare using indirect and asymmetric approaches to weary out the enemy", "Traditional warfare conducted at the tactical level of war", "Strategic deterrence through the threat of conventional force"], "a": 1, "e": "Irregular warfare is a violent struggle among state and non-state actors for legitimacy and influence over relevant populations, favoring indirect, asymmetric approaches — as the Mujahideen did against the Soviets."}, {"q": "A planner states: \"We can't completely disarm this adversary. Our goal is to raise the price of their success until their political object is no longer worth it.\" This reasoning aligns with which form of warfare?", "o": ["Irregular warfare", "Traditional warfare", "Both equally — the forms are identical", "Neither — this describes the operational level of war"], "a": 0, "e": "In irregular warfare, complete disarming is not always possible, so the goal is to raise the price of success through gradual exhaustion of the enemy's physical powers and will."}]}]}, {"lesson": "National Security", "csobs": [{"c": "Recognize how the US uses instruments of power to advance national interests.", "t": "def", "qs": [{"q": "What are the four instruments of national power?", "o": ["Diplomatic, Informational, Military, and Economic (DIME)", "Defense, Intelligence, Media, and Energy", "Diplomatic, Industrial, Military, and Executive", "Deterrence, Influence, Maneuver, and Engagement"], "a": 0, "e": "The instruments of national power are Diplomatic, Informational, Military, and Economic — DIME."}, {"q": "Trade policies, embargoes, tariffs, and fiscal and monetary policies are tools of which instrument of national power?", "o": ["Diplomatic", "Informational", "Military", "Economic"], "a": 3, "e": "The reader lists trade policies, fiscal and monetary policies, embargoes, tariffs, and assistance under the Economic instrument."}, {"q": "Which instrument of national power is described as \"fundamentally coercive in nature\"?", "o": ["Diplomatic", "Informational", "Military", "Economic"], "a": 2, "e": "The military instrument is coercive, generating effects through the application of force (including the threat of force)."}, {"q": "According to the reader, how should the instruments of national power be employed?", "o": ["One at a time, starting with the military", "Rarely, if ever, in isolation — they work best orchestrated together", "Only the diplomatic instrument in peacetime", "Independently by each department without coordination"], "a": 1, "e": "The instruments are interrelated and work best when used together in an orchestrated way; they should rarely, if ever, be used in isolation."}]}, {"c": "Recall the process for formulating US military strategy from national objectives.", "t": "def", "qs": [{"q": "In Lykke's strategy model, \"ends\" are:", "o": ["The resources used to accomplish objectives", "The objectives — \"what\" is to be accomplished", "The strategic concepts — \"how\" objectives are achieved", "The risks of the strategy"], "a": 1, "e": "Ends are the objectives that explain what is to be accomplished, expressed with verbs (e.g., deter war)."}, {"q": "In the ends-ways-means construct, \"ways\" are:", "o": ["The specific tangible resources such as forces and money", "The national interests", "The strategic concepts and courses of action that explain \"how\" the ends are accomplished", "The desired end state"], "a": 2, "e": "Ways are strategic concepts and courses of action — statements of \"how\" (e.g., containment, forward presence)."}, {"q": "Under the ends-ways-means construct described in the reader, the four instruments of national power are considered the:", "o": ["Ends", "Ways", "Means", "Risks"], "a": 2, "e": "National objectives are the ends, while the four instruments of power are the means, continuously evaluated and matched."}, {"q": "Who has ultimate responsibility for US national security policy and the integration of the instruments of national power?", "o": ["The Secretary of Defense", "The Chairman of the Joint Chiefs of Staff", "The President", "Congress"], "a": 2, "e": "The President has ultimate responsibility for national security policy; the National Security Strategy describes how the President plans to use the instruments of power."}]}]}, {"lesson": "US Constitution", "csobs": [{"c": "Recall the branch of government that establishes military authority.", "t": "def", "qs": [{"q": "Which branch of government does Article I, Section 8 empower to declare war and to raise and maintain armies and a navy?", "o": ["Executive branch (the President)", "Legislative branch (Congress)", "Judicial branch (the Supreme Court)", "The states, through their militias"], "a": 1, "e": "Article I establishes the Legislative Branch; Section 8 grants Congress war powers — to declare war, raise and maintain armies and a navy, and call forth the militia."}, {"q": "Article I, Section 8, Clause 11 gives Congress the power to:", "o": ["Serve as Commander in Chief of the armed forces", "Grant reprieves and pardons for federal offenses", "Declare war, grant letters of marque and reprisal", "Appoint ambassadors, judges, and other officers"], "a": 2, "e": "Clause 11: Congress shall have power to declare war, grant letters of marque and reprisal, and make rules concerning captures on land and water."}, {"q": "Which article of the Constitution establishes the Legislative Branch, which holds the bulk of enumerated powers over the armed forces?", "o": ["Article I", "Article II", "Article III", "Article IV"], "a": 0, "e": "Article I establishes Congress (Legislative Branch); Article II creates the Presidency; Article III forms the Judiciary."}]}, {"c": "List the three US Constitution governing principles.", "t": "def", "qs": [{"q": "Which three principles does the reader present as the Constitution's core governing provisions?", "o": ["Enumerated powers, separation of powers, and federalism", "Life, liberty, and property", "Preamble, articles, and amendments", "Diplomatic, informational, and military"], "a": 0, "e": "The reader's \"Three Provisions\" section lists enumerated powers, separation of powers, and federalism."}, {"q": "The principle that the federal government \"does not have powers unless explicitly granted\" to it is:", "o": ["Federalism", "Separation of powers", "Enumerated powers", "Judicial review"], "a": 2, "e": "Enumerated powers limit the Federal Government — it has only the powers explicitly granted to the national government."}, {"q": "\"The division and sharing of power between the national and state governments\" defines:", "o": ["Separation of powers", "Federalism", "Enumerated powers", "Checks and balances"], "a": 1, "e": "Federalism divides and shares power between national and state governments; the Tenth Amendment embodies it."}, {"q": "The doctrine that vests legislative, executive, and judicial power in three separate, independent branches to prevent arbitrary government is:", "o": ["Federalism", "Enumerated powers", "Separation of powers", "Social contract"], "a": 2, "e": "Separation of powers: legislative power in Congress, executive in the President, judicial in the Supreme Court and lower courts."}]}, {"c": "Recall the Amendments to the US Constitution that govern military officer authority.", "t": "def", "qs": [{"q": "Which amendment prohibits quartering soldiers in any house in peacetime without the owner's consent?", "o": ["First Amendment", "Second Amendment", "Third Amendment", "Fifth Amendment"], "a": 2, "e": "The Third Amendment prevents the government from forcing homeowners to house soldiers, symbolizing civilian authority over the military."}, {"q": "Which amendment's Grand Jury Clause contains an exception for cases arising in the land or naval forces, making service members subject to court-martial?", "o": ["Fourth Amendment", "Fifth Amendment", "Sixth Amendment", "Eighth Amendment"], "a": 1, "e": "The Fifth Amendment's Grand Jury Clause excepts cases arising in the land or naval forces; members of the regular armed forces are subject to court-martial."}, {"q": "Which amendment guarantees freedom of speech, religion, press, assembly, and petition — balanced in the military with the need for good order and discipline?", "o": ["First Amendment", "Second Amendment", "Ninth Amendment", "Tenth Amendment"], "a": 0, "e": "The First Amendment; military members have more limited rights of public expression because they stand in a distinct relationship with the government."}]}]}, {"lesson": "Military Justice", "csobs": [{"c": "Identify the functions of the Uniform Code of Military Justice (UCMJ) and Manual for Courts-Martial (MCM).", "t": "def", "qs": [{"q": "A primary function of the UCMJ, passed by Congress on 5 May 1950, was to:", "o": ["Replace the Constitution as the primary source of military law", "Consolidate the separate Army, Navy, and Coast Guard disciplinary codes", "Create the Department of the Air Force as a separate service", "Establish the Area Defense Counsel and Victims Counsel programs"], "a": 1, "e": "Congress passed the UCMJ to ensure uniform interpretation and application of military justice by consolidating the services' separate disciplinary systems."}, {"q": "The Manual for Courts-Martial (MCM) was put into effect by:", "o": ["An act of Congress passed alongside the UCMJ in 1950", "A Supreme Court ruling defining court-martial procedure", "An executive order of President Truman in 1951, giving it the full force and effect of law", "A directive from the first Secretary of the Air Force in 1947"], "a": 2, "e": "Congress gave the President authority to issue implementing instructions; Truman's 8 February 1951 executive order put the MCM into effect."}, {"q": "Which best describes the primary function of the MCM?", "o": ["To address military justice as thoroughly as possible as a working manual", "To list every Air Force Instruction that governs conduct", "To define the Air Force core functions and doctrine", "To replace the UCMJ with a simpler set of rules"], "a": 0, "e": "The MCM contains the Constitution, UCMJ, court-martial authority and procedures, rules of evidence, and punitive articles with guides for writing charges."}]}, {"c": "Recognize the need for a military justice system.", "t": "def", "qs": [{"q": "Absent without leave (AWOL) is used in the reader as an example of which reason for a separate military justice system?", "o": ["Military justice worldwide", "Crimes unique to the military", "Right to counsel", "Search and seizure authority"], "a": 1, "e": "AWOL is a crime unique to the military — a civilian missing work commits no crime, but an AWOL member can endanger the mission and lives of others."}, {"q": "Why must the military justice system be worldwide in jurisdiction?", "o": ["Because military personnel deploy across state and national boundaries on short notice", "Because civilian courts refuse to hear cases involving the military", "Because the UCMJ applies to all US citizens living abroad", "Because NATO treaties require each member to keep courts-martial"], "a": 0, "e": "Commanders need a judicial system wherever units deploy; the UCMJ is worldwide in jurisdiction and applicable wherever members are stationed."}, {"q": "Which is the first argument in favor of a separate military justice system?", "o": ["Lower cost", "Good order and discipline", "Faster trials", "Avoiding the Constitution"], "a": 1, "e": "The first argument concerns good order and discipline, supported by crimes unique to the military, members' familiarity with military offenses, and worldwide jurisdiction."}]}, {"c": "List service members' rights within the military justice system.", "t": "def", "qs": [{"q": "Which UCMJ article advises military suspects of their right against self-incrimination?", "o": ["Article 15", "Article 31", "Article 32", "Article 92"], "a": 1, "e": "Article 31 sets out rights advisement for military suspects; the Fifth Amendment (Miranda) covers civilian suspects."}, {"q": "Which right does a member have when offered an Article 15?", "o": ["The right to have the commander recused", "The right to demand trial by court-martial in lieu of accepting the Article 15", "The right to an automatic grand jury", "The right to have the punishment reviewed by Congress"], "a": 1, "e": "A member may demand trial by court-martial instead of accepting the Article 15, and may consult the Area Defense Counsel first."}, {"q": "The right against self-incrimination does NOT apply to which of the following?", "o": ["Oral confessions", "Written statements", "Requests for voice or handwriting samples and bodily fluids", "Statements during interrogation as a suspect"], "a": 2, "e": "Per the reader, the right against self-incrimination does not apply to requests for voice or handwriting samples and bodily fluids."}, {"q": "Under the right to counsel, the Department of the Air Force provides free legal counsel through the:", "o": ["Staff Judge Advocate", "Area Defense Counsel", "Inspector General", "First Sergeant"], "a": 1, "e": "The DAF provides free counsel — the Area Defense Counsel — to all accused before courts-martial and those offered Article 15 punishment. Members may also hire civilian counsel at their own expense."}]}, {"c": "Identify the methods and associated tools available within the UCMJ to maintain discipline.", "t": "def", "qs": [{"q": "What are the three broad options available to commanders to maintain discipline when members do not comply with standards?", "o": ["Counseling, admonition, and reprimand", "Administrative tools, nonjudicial punishment, and judicial actions", "Summary, special, and general courts-martial", "UIFs, control rosters, and Article 15s"], "a": 1, "e": "The three broad options are administrative tools, nonjudicial punishment (Article 15), and judicial actions (courts-martial)."}, {"q": "Which administrative tool sets up an observation period for members whose duty performance is substandard, and limits reenlistment, promotion, and PCS eligibility?", "o": ["Unfavorable Information File", "Control roster", "Letter of Counseling", "Summary court-martial"], "a": 1, "e": "The control roster is an observation status — not a punishment — that gives members a chance to improve while limiting certain personnel actions."}, {"q": "Which type of court-martial tries the most serious offenses, requires an Article 32 pretrial hearing, and may impose punishment extending to death?", "o": ["Summary court-martial", "Special court-martial", "General court-martial", "Article 15 hearing"], "a": 2, "e": "The general court-martial tries the most serious offenses, is convened by a GCM Convening Authority, and requires an Article 32 hearing."}, {"q": "Which type of court-martial is for enlisted members only and normally consists of one officer?", "o": ["Summary court-martial", "Special court-martial", "General court-martial", "Article 32 hearing"], "a": 0, "e": "The summary court-martial tries minor offenses with one officer, and cannot be used to try officers."}]}, {"c": "Recall the functions of the Staff Judge Advocate, Area Defense Counsel, and the Victims Counsel.", "t": "def", "qs": [{"q": "Which legal office is the commander's legal staff and represents the Air Force and Space Force in all legal matters?", "o": ["Area Defense Counsel", "Victims Counsel", "Staff Judge Advocate", "Inspector General"], "a": 2, "e": "The SJA represents the Air Force and Space Force; its sections include military justice (prosecution), claims, and civil law."}, {"q": "The Area Defense Counsel (ADC) represents:", "o": ["The Air Force and Space Force in courts-martial", "Air Force and Space Force personnel accused of wrongdoing", "Victims of sexual assault and domestic violence", "The commander in administrative matters"], "a": 1, "e": "The ADC represents members accused of wrongdoing; its chain of command is separate from the SJA to avoid any perception of command influence."}, {"q": "The Victims Counsel (VC), started by the Air Force in 2012, advises:", "o": ["Commanders on Article 15 actions and administrative discipline", "Victims of alleged sexual assault and domestic violence", "Members filing claims against the government for damages", "Accused members preparing responses for a discharge board"], "a": 1, "e": "The VC advises victims of alleged sexual assault and domestic violence and represents them in certain court-martial matters; its chain is separate from the SJA."}]}]}, {"lesson": "What the DAF Brings to the Fight", "csobs": [{"c": "Recall the purpose of airpower and spacepower.", "t": "def", "qs": [{"q": "According to AFH 1, airpower is:", "o": ["The totality of a nation's ability to exploit the air domain in pursuit of prosperity and national security", "The ability to project military power or influence through the control and exploitation of air and cyberspace to achieve strategic, operational, and tactical objectives", "The rapid movement of personnel and materiel to, from, or within a theater by air in support of the joint force", "The use of aircraft to support friendly ground forces through close air support and interdiction operations"], "a": 1, "e": "AFH 1 defines airpower as the ability to project military power or influence through the control and exploitation of air and cyberspace to achieve strategic, operational, and tactical objectives."}, {"q": "Military spacepower, as defined in Space Force doctrine, is:", "o": ["Achieving strategic and military objectives by controlling and exploiting space", "The launch and operation of satellites for commercial and civil purposes", "Air superiority extended above 100 km by the Space Force", "The detection and tracking of missile launches by space-based sensors"], "a": 0, "e": "Space Force capstone doctrine defines military spacepower as the ability to accomplish strategic and military objectives through the control and exploitation of the space domain."}, {"q": "According to AFH 1, what does airpower provide the nation?", "o": ["A replacement for land and maritime power in most operations", "Versatile, wide-ranging means toward achieving national objectives", "A nuclear deterrent that is used only in wartime", "A domestic law enforcement capability for homeland security"], "a": 1, "e": "Airpower provides versatile, wide-ranging means toward national objectives with the ability to deter and respond immediately to crises anywhere in the world."}]}, {"c": "Recall the five USAF core functions and four USSF core and enterprise functions.", "t": "def", "qs": [{"q": "Which list contains the five USAF core functions?", "o": ["Air Superiority, Global Precision Attack, Rapid Global Mobility, Global ISR, Command and Control", "Airlift, Air Refueling, Aeromedical Evacuation, Air Mobility Support, Space Support", "Space Control, Global Mission Operations, Space Access, Intelligence, Cyberspace", "Fires, Movement & Maneuver, Protection, Sustainment, Information"], "a": 0, "e": "AFDP 3-0 lists the five USAF core functions: Air Superiority, Global Precision Attack, Rapid Global Mobility, Global ISR, and Command and Control."}, {"q": "Which are the four USSF cross-cutting enterprise functions?", "o": ["Space control, global mission operations, space access, and spacelift", "Intelligence, cyberspace operations, command and control, and space domain awareness", "Orbital, electromagnetic, cyberspace, and navigation warfare", "Satellite communications, missile warning, sensing, and targeting"], "a": 1, "e": "The Space Force recognizes four enterprise functions: intelligence, cyberspace operations, command and control, and space domain awareness."}, {"q": "Which are the USSF core functions conducted in, from, and to the space domain?", "o": ["Air superiority, global strike, and mobility", "Space control, global mission operations, and space access", "Orbital segment, link segment, and terrestrial segment", "Prepare, ready, and commit"], "a": 1, "e": "The Space Force's core functions are space control, global mission operations, and space access; they are enabled by four enterprise functions."}]}, {"c": "Describe the purpose of each USAF core function and USSF core and enterprise function.", "t": "scn", "qs": [{"q": "Before a ground offensive, the JFC directs Airmen to suppress enemy air defenses and sweep enemy fighters so friendly forces have freedom of action without interference from enemy aircraft. Which USAF core function is being executed?", "o": ["Rapid Global Mobility", "Air Superiority", "Global ISR", "Command and Control"], "a": 1, "e": "Air Superiority's primary role is to achieve control of the air; offensive counterair includes SEAD, fighter escort, and fighter sweep."}, {"q": "A KC-46 offloads fuel to fighters, extending their range, while a C-17 moves an Army brigade's equipment into theater. These missions fall under which USAF core function?", "o": ["Global Precision Attack", "Air Superiority", "Rapid Global Mobility", "Global ISR"], "a": 2, "e": "Rapid Global Mobility includes airlift, air refueling, aeromedical evacuation, and air mobility support — it contributes to the joint function of movement and maneuver."}, {"q": "A Space Force unit protects friendly satellites and conducts electromagnetic warfare on an adversary's satellite links so US forces can operate without prohibitive interference from space. Which USSF core function is this?", "o": ["Space access", "Global mission operations", "Space control", "Space domain awareness"], "a": 2, "e": "Space control comprises activities to contest and control the space domain; its desired outcome is space superiority. Mission areas: orbital, electromagnetic, and cyberspace warfare."}, {"q": "Guardians detect a hostile missile launch, track its trajectory, and provide timely warning to forces in theater. Which USSF core function does this support?", "o": ["Space access", "Global mission operations", "Space control", "Command and control"], "a": 1, "e": "Global mission operations deliver space effects in support of military operations; missile warning and tracking is one of its five mission areas."}, {"q": "A Space Force squadron detects, characterizes, and attributes an unknown object maneuvering near a US satellite to inform commanders' decisions. Which USSF enterprise function is this?", "o": ["Space domain awareness", "Space access", "Cyberspace operations", "Satellite communications"], "a": 0, "e": "Space domain awareness is the detection, characterization, attribution, prediction, and targeting of activities in the space domain to inform decision making."}]}, {"c": "Understand the role and purpose of doctrine to the USAF and USSF.", "t": "scn", "qs": [{"q": "A new lieutenant reads a doctrine publication and asks, \"Do I have to do exactly what this says?\" Which response best reflects the doctrine primer?", "o": ["Yes — doctrine is directive, like policy", "No — doctrine is authoritative but not directive", "No — doctrine is only opinion and can be ignored", "Yes, but only during wartime"], "a": 1, "e": "Doctrine is a guide to action, not fixed rules. It requires judgment in application; Airmen should be doctrinally sound, not doctrinally bound."}, {"q": "Officers from two squadrons are planning together but keep misunderstanding each other's terms. Which purpose of doctrine would most help them?", "o": ["Doctrine sets the rules of engagement both squadrons must follow", "Doctrine provides a common frame of reference and common vocabulary for precise communication", "Doctrine dictates exactly which aircraft each squadron should use", "Doctrine replaces the commander's intent with fixed procedures"], "a": 1, "e": "Doctrine gives commanders shared intellectual tools and establishes a common vocabulary that supports precise communication."}, {"q": "A staff officer says the new rules of engagement for an operation are \"our doctrine.\" Why is this incorrect?", "o": ["Rules of engagement are tactical doctrine", "Rules of engagement are policy", "Rules of engagement are strategy", "Rules of engagement are basic doctrine"], "a": 1, "e": "The primer distinguishes doctrine from policy: policy is directive and changes with leadership, politics, or budgets; ROE are an example of policy."}]}]}, {"lesson": "How the DAF Deploys", "csobs": [{"c": "Identify the purpose of the AFFORGEN and SPAFORGEN.", "t": "def", "qs": [{"q": "What is the purpose of the Air Force Force Generation (AFFORGEN) model?", "o": ["To meet current combatant commander needs while building high-end, sustainable readiness", "To assign permanent duty stations and manage PCS moves across the force", "To schedule professional military education for officers and enlisted members", "To set the Air Force budget and allocate funding to the major commands"], "a": 0, "e": "AFFORGEN replaces the AEF construct; it meets current COCOM demand while building high-end, sustainable readiness for the future."}, {"q": "According to the CSO's C-Note 21, SPAFORGEN is described as:", "o": ["The Space Force's acquisition process", "The foundation of Space Force readiness", "The Space Force's PME program", "The launch schedule for the Space Force"], "a": 1, "e": "C-Note 21: \"The Space Force Generation model (SPAFORGEN) is the foundation of Space Force readiness.\" Force generation builds, sustains, and reconstitutes force elements."}, {"q": "Why did the Air Force move from the AEF construct to AFFORGEN?", "o": ["The AEF lacked an easily understood model showing all facets of airpower and readiness impacts", "The AEF was too expensive to run alongside modernization programs", "Congress directed the Air Force to end rotational deployments", "The AEF applied only to the Space Force and not to Airmen"], "a": 0, "e": "Gen Brown said the AEF lacked an easily understood model; a 2018 review found airpower use had outpaced force generation for 18 years."}]}, {"c": "Cite the four rotational phases of readiness in the AFFORGEN cycle and the three phases of the SPAFORGEN cycles.", "t": "def", "qs": [{"q": "What are the four phases of the AFFORGEN cycle?", "o": ["Available to Commit, Reset, Prepare, Ready", "Prepare, Ready, Commit, Recover", "Unfreeze, Change, Refreeze, Sustain", "Forming, Storming, Norming, Performing"], "a": 0, "e": "AFFORGEN is a 24-month cycle of four six-month phases: Available to Commit, Reset, Prepare, and Ready."}, {"q": "What are the three phases of the SPAFORGEN cycle?", "o": ["Reset, Prepare, Ready", "Prepare, Ready, Commit", "Plan, Prepare, Execute", "Train, Certify, Deploy"], "a": 1, "e": "SPAFORGEN's three phases: Prepare (build expertise, PME, leave), Ready (advanced training and exercises), and Commit (allocated to COCOM missions)."}, {"q": "In AFFORGEN, during which phase do Airmen return from deployment, reintegrate with families, take leave, and regain basic proficiency?", "o": ["Available to Commit", "Reset", "Prepare", "Ready"], "a": 1, "e": "Reset follows Available to Commit: reintegration, post-deployment leave, restoring qualifications, and regaining basic proficiency."}, {"q": "How long is the AFFORGEN cycle?", "o": ["12 months of three 4-month phases", "24 months of four 6-month phases", "36 months of three 12-month phases", "18 months of six 3-month phases"], "a": 1, "e": "AFFORGEN runs on a 24-month cycle divided into four six-month readiness phases."}]}, {"c": "Recall the importance of readiness on mission accomplishment.", "t": "def", "qs": [{"q": "Lt Gen Guastella warned, \"Just because they are available, doesn't necessarily mean they are ____.\"", "o": ["Deployed", "Ready", "Funded", "Qualified"], "a": 1, "e": "Availability is not the same as readiness — the force generation model deliberately builds readiness so available forces can actually accomplish the mission."}, {"q": "What did the Air Force's 2018 readiness deep dive find?", "o": ["Force generation had outpaced the use of airpower for 18 years", "The use of airpower had outpaced force generation for the past 18 years", "Readiness across the force was at an all-time high", "The AEF construct should be expanded to the Space Force"], "a": 1, "e": "The 2018 review found airpower use had outpaced force generation for 18 years, driving the shift to a model that balances short- and long-term readiness."}, {"q": "In AFFORGEN, during which phase do units from multiple wings train together in certifying events such as flag exercises to reach high-end combat readiness?", "o": ["Reset", "Prepare", "Ready", "Available to Commit"], "a": 2, "e": "In the Ready phase, units work toward readiness above the unit level for high-end combat through large force exercises and certifying events."}]}]}, {"lesson": "Change Management", "csobs": [{"c": "Recognize Lewin's Change Management Model.", "t": "def", "qs": [{"q": "What are the three stages of Kurt Lewin's change process?", "o": ["Plan, Do, Check", "Unfreezing, Changing, Refreezing", "Forming, Storming, Norming", "Observe, Orient, Act"], "a": 1, "e": "AFH 1 13.11: Lewin's three-stage process is unfreezing, changing, and refreezing."}, {"q": "In Lewin's model, \"refreezing\" means:", "o": ["Preparing people for change by creating a felt need", "Modifying technology, tasks, structure, or people", "Locking in the desired outcomes and new norms so they become permanent", "Stopping the change if resistance occurs"], "a": 2, "e": "Refreezing locks in new norms; positive reinforcement and rewarding aligned behavior help freeze the change in place."}, {"q": "According to AFH 1, the most neglected yet essential part of unfreezing is:", "o": ["Installing new equipment and restructuring work centers", "Creating an environment where people feel the need for change", "Rewarding people who adopt the change early", "Using coercion to gain compliance quickly"], "a": 1, "e": "The most neglected, yet essential, part of unfreezing is creating an environment where people feel the need for change."}]}, {"c": "Identify common resistance to change.", "t": "def", "qs": [{"q": "Which response to change involves fear of the unknown and concern about job security?", "o": ["Distrust", "Uncertainty", "Self-interest", "Over-determination"], "a": 1, "e": "Uncertainty: people may fear the unknown or see change as a threat to organizational stability and job security."}, {"q": "Which common response to change describes a rigid, mechanistic organizational structure that inhibits change?", "o": ["Different perception/no felt need to change", "Self-interest", "Over-determination", "Distrust"], "a": 2, "e": "Over-determination: organizational structure itself, such as strict procedures and lines of authority, can become a barrier to change."}, {"q": "Which list contains the five common responses to change in AFH 1?", "o": ["Distrust, uncertainty, self-interest, different perception/no felt need, over-determination", "Denial, anger, bargaining, depression, acceptance", "Avoiding, accommodating, competing, compromising, collaborating", "Education, participation, facilitation, negotiation, coercion"], "a": 0, "e": "AFH 1 13.9 lists distrust, uncertainty, self-interest, different perception/no felt need to change, and over-determination."}]}, {"c": "List the methods leaders use to reduce and manage resistance to change.", "t": "def", "qs": [{"q": "Which list names the methods AFH 1 gives for reducing perceived resistance to change?", "o": ["Education and communication; participation and involvement; facilitation and support; negotiation and agreement; coercion", "Unfreezing; changing; refreezing; evaluating; reinforcing results", "Lean; Six Sigma; business process reengineering; Theory of Constraints", "Counseling; admonition; reprimand; control roster; unfavorable information file"], "a": 0, "e": "AFH 1 13.10 lists education and communication, participation and involvement, facilitation and support, negotiation and agreement, and coercion."}, {"q": "Which method of reducing resistance AFH 1 says is NOT recommended because it can cause long-term negative consequences?", "o": ["Participation and involvement", "Facilitation and support", "Coercion", "Education and communication"], "a": 2, "e": "Coercion forces acceptance, can damage attitudes, and requires constant leadership oversight; coerced compliance is not recommended."}, {"q": "Involving those affected in designing and implementing the change to generate ownership and commitment describes which method?", "o": ["Negotiation and agreement", "Participation and involvement", "Facilitation and support", "Coercion"], "a": 1, "e": "Participation and involvement reduces resistance by actively involving those affected, generating ownership and commitment."}]}]}, {"lesson": "Team Building", "csobs": [{"c": "Remember the four stages of team growth.", "t": "def", "qs": [{"q": "What are the four stages of team building in AFH 1?", "o": ["Forming, storming, norming, performing", "Unfreezing, changing, refreezing, sustaining", "Prepare, ready, commit, reset", "Observe, orient, decide, act"], "a": 0, "e": "AFH 1 14.2: the four stages most often experienced by teams are forming, storming, norming, and performing."}, {"q": "Which stage is \"the initial period of uncertainty in which individuals try to determine their place on a team\"?", "o": ["Forming", "Storming", "Norming", "Performing"], "a": 0, "e": "Forming is the transition from individual to member status, when members cautiously explore boundaries and a leader's guidance may be tested."}, {"q": "In which stage do members establish cohesiveness and commitment, accept team ground rules, and become more cooperative?", "o": ["Forming", "Storming", "Norming", "Performing"], "a": 2, "e": "In norming, members reconcile competing loyalties, accept norms and roles, and emotional conflict is reduced."}, {"q": "Which stage does AFH 1 call \"probably the most difficult,\" when conflicts arise and members resist the team's influence?", "o": ["Forming", "Storming", "Norming", "Performing"], "a": 1, "e": "Storming is probably the most difficult stage, as members realize the task is harder than expected and argue about what to do."}]}, {"c": "Describe leader and follower actions that contribute to effective teams.", "t": "scn", "qs": [{"q": "Your newly formed project team is polite but unsure of its purpose and how it fits into the squadron. According to the Tuckman article, what should you do as the leader?", "o": ["Step back and let the team discover its own purpose and roles", "Act as \"the Director\": take clear charge, run structured meetings, set expectations", "Delegate all decisions to the team immediately to build ownership", "Focus outward on external trends and develop future leaders"], "a": 1, "e": "In forming, the leader is \"the Director\" — giving clear direction, structure, and a compelling mission to earn buy-in."}, {"q": "Two team members have started arguing openly about how to approach the task, and others are frustrated with leadership. Which leader action fits this stage?", "o": ["Act as \"the Coach\": listen empathetically, give space to voice concerns, teach teamwork", "Give the team full autonomy so they can resolve it themselves", "Ignore the conflict, since it usually works itself out over time", "Shift your focus outward to developing future leaders on the team"], "a": 0, "e": "This is storming. The leader is \"the Coach,\" controlling chaos while listening and teaching members how to function as a team."}, {"q": "Your team is high-functioning, trusts each other, and welcomes constructive criticism. What should your focus be?", "o": ["Tighten control and return to structured, directive meetings", "Act as \"the Visionary\": look outward, develop leadership talent within the team", "Re-establish team ground rules and clarify each member's role", "Step in to resolve personality conflicts before they surface"], "a": 1, "e": "In performing, the leader is \"the Visionary\" — focusing on external factors, growing leaders, and sustaining improvement."}, {"q": "One team member keeps trying to outshine others to gain extra credit, creating unhelpful competition. According to AFH 1, what should the leader do?", "o": ["Reward the member publicly to motivate others", "Reemphasize each team member's specific roles and responsibilities", "Remove the member from the team immediately", "Avoid the issue to protect morale"], "a": 1, "e": "AFH 1 says \"all-starring\" behavior may signal a power struggle; leaders should reemphasize roles and responsibilities to remove barriers to cooperation."}, {"q": "A team member hears a teammate criticize the team's plan in private conversations outside the group but say nothing in meetings. Which follower action would best build team trust?", "o": ["Join in the outside conversation so the teammate feels supported", "Speak directly to the right people in the group, not behind backs", "Withhold information from the teammate until the issue resolves", "Report the teammate to the commander for misconduct right away"], "a": 1, "e": "AFH 1 (Zoglio): nothing reduces trust faster than saying one thing inside the group and another outside; direct communication enhances trust, which is at the core of healthy teams."}]}]}, {"lesson": "Conflict Management", "csobs": [{"c": "Describe sources of conflict (factors).", "t": "scn", "qs": [{"q": "Two flights clash after a schedule change was emailed to some members but not others, and several people acted on outdated information. Which source of conflict from AFH 1 is most evident?", "o": ["Structural factors", "Communication factors", "Personal behavior factors", "Distributive factors"], "a": 1, "e": "AFH 1 14.4: communication factors — the crux is usually miscommunication; misinterpreted, inaccurate, or incomplete information leads to frustration and stress."}, {"q": "A growing squadron has three sections competing for the same limited vehicles and budget, and tension increases between line and staff personnel. Which source of conflict is this?", "o": ["Communication factors", "Structural factors", "Personal behavior factors", "Over-determination"], "a": 1, "e": "Structural factors include organization size, scarce or high-demand resources, and line-staff distinctions."}, {"q": "Two NCOs with very different values and personalities constantly disagree about how work should be prioritized. Which source of conflict does this represent, and what does AFH 1 suggest?", "o": ["Structural factors; reorganize the unit so they no longer interact", "Personal behavior factors; align personal values with the Air Force mission", "Communication factors; increase the number of emails and meetings", "Personal behavior factors; separate them permanently into different sections"], "a": 1, "e": "Personal behavior factors arise from differences in goals, perceptions, values, and personalities. Aligning personal values with Air Force values reduces conflict."}]}, {"c": "Distinguish between distributive and integrative approaches to negotiations.", "t": "scn", "qs": [{"q": "Two squadrons must divide a fixed number of training range slots. Each commander argues that any slot gained by the other is a slot lost to them, and both hold back information. Which negotiation approach is this?", "o": ["Integrative negotiation", "Distributive negotiation", "Interest-based negotiation", "Process trust"], "a": 1, "e": "Distributive negotiation assumes limited, fixed resources — a zero-sum game where competition guides the talks and distrust can result."}, {"q": "Two section chiefs discover that one needs the range in the morning and the other only needs it at night, so both get more time than originally requested while their relationship improves. This outcome reflects:", "o": ["Distributive negotiation", "Integrative negotiation", "The Insist approach", "The Evade approach"], "a": 1, "e": "Integrative negotiation does not see resources as necessarily fixed, allowing mutually beneficial cooperation that also protects relationships."}, {"q": "Which statement best distinguishes integrative from distributive negotiation?", "o": ["Integrative negotiation is always faster", "Distributive treats resources as fixed (zero-sum)", "Distributive negotiation is used only by senior leaders", "Integrative negotiation never involves claiming value"], "a": 1, "e": "Integrative still involves value claiming at some point, but it is not necessarily zero-sum. Military negotiators use it to achieve solutions and protect relationships."}]}, {"c": "Infer which problem solving approach to use to best manage conflict in a given scenario.", "t": "scn", "qs": [{"q": "During an aircraft emergency, you are the senior officer with clear authority, time is critical, and the outcome is paramount. Which approach is most appropriate?", "o": ["Evade", "Comply", "Insist", "Negotiate (IBN)"], "a": 2, "e": "Insist fits when the task is very important, you have the power to ensure compliance, and time is short — e.g., a crisis. It is not usually right for durable long-term solutions."}, {"q": "A peer from another unit asks to change a minor formatting standard on a shared product. It matters little to you, and you want to build a stronger working relationship with them. Which approach fits best?", "o": ["Insist", "Comply", "Evade", "Settle"], "a": 1, "e": "Comply fits when the task is not very important (or less important than rapport) and you want to sustain or improve the relationship. \"Yes, absolutely, let's do it your way!\""}, {"q": "You and a long-term partner unit face a very important issue. There is mutual trust, both sides freely share information, and you want to strengthen the relationship. Which approach should you use?", "o": ["Settle", "Insist", "Negotiate (IBN)", "Evade"], "a": 2, "e": "IBN fits when the task is very important, the relationship matters, trust exists or should be built, information is shared, and power is shared (\"power with\")."}, {"q": "A somewhat important issue needs resolution today. Power is about evenly split, and trust is neither strong nor weak. Which approach is most appropriate?", "o": ["Settle", "Comply", "Insist", "Negotiate (IBN)"], "a": 0, "e": "Settle is quicker and efficient but rarely optimal — \"Let's just split the difference and call it a day.\""}, {"q": "A coworker raises a minor disagreement about which you have no strong interest and no need to build the relationship, and you need more information before engaging. Which approach applies?", "o": ["Insist", "Evade", "Comply", "Negotiate"], "a": 1, "e": "Evade is passive and unassertive; it can be appropriate when the task is unimportant or when delay lets you gather information. \"Not now, can you come back later?\""}]}]}, {"lesson": "USAF and USSF Core Values", "csobs": [{"c": "Explain how the virtues relate to the USAF and USSF Core Values.", "t": "scn", "qs": [{"q": "A maintainer discovers that her own error caused a delayed launch. Although no one else noticed, she reports it to her supervisor and owns the consequences. Which core value and associated virtue is she demonstrating?", "o": ["Service Before Self — loyalty", "Integrity First — accountability", "Excellence In All We Do — teamwork", "Service Before Self — respect"], "a": 1, "e": "Accountability is a virtue of Integrity First: being transparent, owning the results of your actions, and doing the right thing whether or not anyone is watching."}, {"q": "A lieutenant disagrees with a commander's decision. He offers an alternative through the chain of command, and when the decision stands, he carries it out fully. Which virtue of Service Before Self does this reflect?", "o": ["Humility", "Loyalty", "Discipline", "Honesty"], "a": 1, "e": "The Blue Book describes loyalty as including carrying out leaders' decisions and offering alternatives through the chain of command — loyalty to the Nation first, then Air Force values, then fellow servicemembers."}, {"q": "An Airman holds himself to high personal standards, shows self-control and strong work ethic, and continuously works to improve. This virtue is associated with which core value?", "o": ["Integrity First", "Service Before Self", "Excellence In All We Do", "Connection"], "a": 2, "e": "Discipline — along with mission and teamwork — is a virtue of Excellence In All We Do."}, {"q": "A Guardian speaks up in a meeting to point out a serious flaw in a popular plan because it is the right thing to do, even though it may be unpopular. Which USSF core value is this?", "o": ["Connection", "Commitment", "Courage", "Character"], "a": 2, "e": "USSF Courage: \"Guardians do what needs to be done and say what needs to be said because it is right.\" It parallels the Air Force virtue of courage under Integrity First."}]}, {"c": "Describe the USAF and USSF Core Values and their related virtues.", "t": "scn", "qs": [{"q": "A new Airman asks you what \"Excellence In All We Do\" requires. Which answer best matches the Blue Book?", "o": ["Perfection from everyone in everything", "A commitment to continuously improve your craft and knowledge", "Putting the mission ahead of personal interests", "Doing the right thing when no one is watching"], "a": 1, "e": "The Blue Book: Excellence In All We Do \"does not mean that we demand perfection\" — it is about continuous improvement, growth, and innovation."}, {"q": "A Guardian leader builds a team that treats everyone with dignity, empathy, and respect and draws on diverse perspectives toward a common purpose. Which USSF core value is being lived out?", "o": ["Character", "Connection", "Commitment", "Courage"], "a": 1, "e": "Connection: \"We are connected by a common purpose greater than ourselves\" — treating everyone with dignity, empathy, and respect."}, {"q": "A Guardian pursues advanced training, studies the space domain on her own time, and tries to make each day better than the last. Which USSF core value does this describe?", "o": ["Commitment", "Connection", "Character", "Courage"], "a": 0, "e": "Commitment: \"We are committed to the pursuit of mastery within ourselves, our profession, and our domain\" — a lifelong journey."}, {"q": "An Airman deploys over the holidays and sacrifices personal plans because the mission requires it, while still caring for his family's needs. Which core value is he displaying?", "o": ["Integrity First", "Service Before Self", "Excellence In All We Do", "Connection"], "a": 1, "e": "Service Before Self treats service as a calling that puts the mission and others ahead of personal interests, without abandoning family or self-care. Duty is one of its virtues."}]}, {"c": "Discuss the importance of the USAF and USSF Core Values to Airmen and Guardians.", "t": "scn", "qs": [{"q": "A unit has slowly developed habits of \"making our own rules\" and cutting corners. How can the core values help the commander, according to the Blue Book?", "o": ["They have no role once a climate of corrosion has set in", "They gauge the ethical climate and offer a path back to ethical commitment", "They replace the UCMJ as the primary tool for discipline", "They apply mainly to new accessions, not established units"], "a": 1, "e": "The Blue Book says core values help gauge the ethical climate and offer a path back to professional conduct."}, {"q": "A trainee asks why the core values are called \"the price of admission.\" What is the best answer?", "o": ["They are a fee each member pays at enlistment", "They define the minimum standard of what it takes to belong to the Air Force", "They are optional goals intended mainly for senior leaders", "They are tested only when members compete for promotion"], "a": 1, "e": "The Blue Book describes the core values as the price of admission — what it takes to belong to the Air Force."}, {"q": "A Guardian argues that skill matters more than character. Based on USSF doctrine, why is character listed first among the USSF core values?", "o": ["It is alphabetical", "Character underpins the other three values", "Character applies only to officers", "Character is the easiest value to achieve"], "a": 1, "e": "USSF: character is the foundation for trust and good order and \"the most important standard to which we hold ourselves as Guardians.\""}]}]}, {"lesson": "Establishing Expectations", "csobs": [{"c": "Describe the importance of establishing expectations.", "t": "scn", "qs": [{"q": "A new flight commander takes over and spends the first weeks quietly observing without telling anyone what she expects. Morale drops and people are unsure what matters. Based on Goldfein, what did she miss?", "o": ["Nothing — commanders should wait months before setting expectations", "Those entrusted to your charge want and need to be led from day one", "She should have waited for her boss to set all expectations for the flight", "She should have changed everything immediately without explanation"], "a": 1, "e": "Col William Lord, quoted by Goldfein: \"Those entrusted to your charge want and need to be led from day 1 of your command tour.\" Clearly stated expectations are the starting point."}, {"q": "Goldfein writes that \"any dialogue on preparation for command must begin with a discussion on expectations.\" Why are expectations so important?", "o": ["They let leaders avoid giving feedback later in the assignment", "Leader and follower expectations both shape leadership development", "They are required by the UCMJ for every new commander", "They replace the need for a vision statement and priorities"], "a": 1, "e": "Goldfein: the expectations of both leader and follower play key roles in the development of leadership; clear expectations link people's efforts to the mission."}, {"q": "Two section chiefs in your unit work hard but in different directions, duplicating effort and missing your priorities. Which leader action would most directly fix this?", "o": ["Increase their workload", "Establish mutually understood expectations with each of them", "Wait for the annual performance report", "Assign blame publicly"], "a": 1, "e": "Goldfein recommends establishing mutually understood expectations with subordinate leaders (e.g., flight commanders and flight chiefs) so effort aligns with the mission."}]}, {"c": "Summarize the guidelines for establishing expectations.", "t": "scn", "qs": [{"q": "You've just been selected for command, but your new boss is deployed and unavailable to meet before you take over. What does Goldfein recommend?", "o": ["Assume you already know what the boss wants and proceed", "If you can't meet face to face, request the boss's expectations in writing", "Skip it, since the boss's expectations matter less than the troops'", "Ask your predecessor to set your goals for the first year"], "a": 1, "e": "Goldfein advises meeting your new boss face to face, and not leaving until expectations are clear; if that isn't possible, ask for their thoughts in writing."}, {"q": "Goldfein organizes expectations of command around three perspectives a new leader must consider. What are they?", "o": ["What the boss expects, what the troops expect, and what you expect", "What Congress, the President, and the SECAF expect", "What the IG, the SJA, and the First Sergeant expect", "What the past, present, and future expect"], "a": 0, "e": "Chapter 1 sections: What Does the Boss Expect? What Do the Troops Expect? What Do You Expect?"}, {"q": "Planning your first 30 days in command, which action aligns with Goldfein's guidance for setting expectations?", "o": ["Avoid publishing a philosophy so you stay flexible", "Publish a command philosophy, visit every work center and shift", "Delay meeting senior NCOs until your first inspection", "Focus only on your own career goals"], "a": 1, "e": "Goldfein's first-30-days advice includes publishing a command philosophy, meeting key leaders, visiting every work center and shift, and holding a commander's call."}]}]}, {"lesson": "Organizational Climate", "csobs": [{"c": "Contrast the difference between climate and culture.", "t": "scn", "qs": [{"q": "After a new commander arrives, members report within a few months that they feel more respected and comfortable raising concerns, although the unit's long-held traditions and core beliefs haven't changed. What has changed?", "o": ["The organizational culture", "The organizational climate", "The unit's doctrine", "The unit's mission statement"], "a": 1, "e": "Climate is members' shared perception of how it feels to work in the unit right now; leaders can influence it relatively quickly. Culture — deep-rooted values, beliefs, and assumptions — changes slowly."}, {"q": "Which statement best contrasts organizational culture with organizational climate?", "o": ["Culture is deep shared values; climate is current shared perception", "Culture and climate are the same thing and change at the same pace", "Climate is permanent and fixed; culture changes from day to day", "Culture is measured by the DEOCS; climate cannot be measured at all"], "a": 0, "e": "Culture is the enduring \"how we do things here\" built from shared values and assumptions. Climate is the shorter-term \"how it feels to work here,\" shaped directly by leadership and measured with tools like the DEOCS."}, {"q": "A commander wants a quick snapshot of how members currently perceive the unit's human relations environment. Which tool measures climate, and why does it fit?", "o": ["An Article 15, because it measures discipline", "The Defense Equal Opportunity Climate Survey (DEOCS)", "A SWOT analysis, because it measures culture", "The UIF, because it measures standards"], "a": 1, "e": "The DEOCS helps commanders orient to their organization's climate and plan improvements by revealing positive and negative factors affecting the unit."}]}, {"c": "Discuss strategies to build a positive organizational climate.", "t": "scn", "qs": [{"q": "Members of your flight say they are afraid to suggest new ideas because past mistakes were met with harsh criticism. Which aspect of a safe and secure environment needs attention?", "o": ["Physical safety and security", "Emotional safety and security", "High standards", "Structural factors"], "a": 1, "e": "Emotional safety and security focus on respect and openness and on encouragement to try new things and take calculated risks without fear of harsh repercussions."}, {"q": "According to the reader, what is the most important consideration for both the physical and emotional safety of a unit?", "o": ["Building maintenance", "Harassment and sexual assault", "Work schedules", "Uniform standards"], "a": 1, "e": "Nothing is more detrimental to a work environment than harassment and sexual assault; leaders must establish and uphold a zero-tolerance policy."}, {"q": "Your team has become complacent doing the same tasks day after day, and satisfaction is falling. Which strategy from the reader best builds a positive climate?", "o": ["Lower standards to reduce stress and improve satisfaction", "Set high, clearly defined standards and challenge your troops to reach new heights", "Avoid change so people stay comfortable in their routines", "Focus only on physical safety and leave standards as they are"], "a": 1, "e": "High standards improve quality and performance and bring lasting job satisfaction; leaders should clearly define standards by establishing expectations."}, {"q": "Goldfein says more than 95 percent of Airmen arrive at work intending to succeed. What does this imply about a commander's role in building climate?", "o": ["Commanders should closely watch for the 5 percent and punish them", "Build an environment with as few barriers as possible to that sought-after success", "Let the climate develop on its own", "Focus only on mission metrics"], "a": 1, "e": "Goldfein: the commander's role is to remove barriers so Airmen can achieve the success they already seek; the work area must be secure, safe, and of high standards."}]}, {"c": "Describe how to positively change an organizational climate.", "t": "scn", "qs": [{"q": "Your DEOCS results just came back and show several negative trends. What does the reader recommend as an initial action?", "o": ["Keep the results confidential among leadership to protect morale", "Give the unit a transparent out-brief of results, impact, and next steps", "Disband the sections with the poorest results and reassign people", "Wait a year and survey again to confirm the trends are real"], "a": 1, "e": "Leaders should be transparent: brief results and trends, describe mission impact, give recommendations, and offer follow-up such as one-on-ones, chaplain, and EO professionals."}, {"q": "A commander casually jokes in a staff meeting about a safety violation, and soon members begin taking safety less seriously. Which principle of changing climate does this illustrate?", "o": ["Address your unit", "Focus on the little things", "Inspire action", "Physical security"], "a": 1, "e": "\"Focus on the Little Things\": everything a leader does — even casual comments — influences unit climate."}, {"q": "To move the unit in the same direction, a leader communicates the mission, vision, and priorities often and in different ways, empowers subordinates, and publicly recognizes teams that contribute. Which climate-change technique is this?", "o": ["Address your unit (DEOCS out-brief)", "Inspire action (communicate, enable, reinforce)", "Focus on the little things", "Zero tolerance policy"], "a": 1, "e": "Inspire Action: communicate the mission, vision, and priorities; enable action by empowering and building trust; and reinforce by showing appreciation."}]}]}, {"lesson": "Inspiring Action", "csobs": [{"c": "Recognize the difference between mission and vision statements.", "t": "def", "qs": [{"q": "What is the difference between a mission statement and a vision statement?", "o": ["Mission states what the organization does; vision states why it matters", "They are identical", "A vision statement lists daily tasks; a mission statement describes the future", "A mission statement is personal; a vision statement is organizational"], "a": 0, "e": "The reader: mission describes the action, while vision offers the aspiration."}, {"q": "\"Develop and sustain ready and resilient forces and their families through customer-focused programs and services\" is an example of a:", "o": ["Vision statement", "Mission statement", "Core value", "Priority"], "a": 1, "e": "This is the 42d FSS mission — it states what the organization does."}, {"q": "\"A dynamic team of innovative professionals driven and empowered to provide unrivaled customer experiences\" is an example of a:", "o": ["Mission statement", "Vision statement", "SWOT strength", "Standard"], "a": 1, "e": "This is the 42d FSS vision — an aspirational picture of the desired future state."}]}, {"c": "Recall the purpose of using the SWOT method to identify priorities.", "t": "def", "qs": [{"q": "What does SWOT stand for?", "o": ["Strategy, Workforce, Objectives, Tasks", "Strengths, Weaknesses, Opportunities, Threats", "Standards, Wins, Outcomes, Timelines", "Situation, Will, Options, Tactics"], "a": 1, "e": "SWOT = Strengths, Weaknesses, Opportunities, Threats."}, {"q": "What is the purpose of a SWOT analysis?", "o": ["To assign responsibility for poor performance within the organization", "To reveal positive forces and potential problems that need addressing", "To write the unit's mission statement and core values", "To evaluate individual performance reports and promotion potential"], "a": 1, "e": "The purpose of a SWOT analysis is to reveal positive forces working together and potential problems that need to be recognized and possibly addressed."}, {"q": "In a SWOT analysis, which factors are internal to the organization?", "o": ["Opportunities and threats", "Strengths and weaknesses", "Threats and weaknesses", "Opportunities and strengths"], "a": 1, "e": "Strengths and weaknesses are internal (S-W); opportunities and threats are broader external factors (O-T)."}]}, {"c": "Describe techniques for encouraging continued action toward a vision.", "t": "scn", "qs": [{"q": "Your unit wrote an inspiring vision at an off-site, but three months later no one mentions it and energy has faded. What does the Profession of Arms Center of Excellence suggest?", "o": ["Write a new vision every quarter", "Integrate the vision into everything", "Post it on the wall and leave it", "Let each section create its own vision"], "a": 1, "e": "Great organizations integrate vision, mission, and values into everything they do and communicate the message frequently through modeling and sharing."}, {"q": "A new commander drafts a vision statement alone and announces it, but members feel no ownership. Which principle would have helped?", "o": ["Idealistic yet achievable", "Shared and supported", "Articulated in technical jargon", "Keep it confidential until finalized"], "a": 1, "e": "\"Shared and supported\": leaders encourage support by collaborating during development and accepting feedback, then deliberately incorporate the vision into daily activities."}, {"q": "A proposed vision is so easy to achieve that it won't motivate anyone, while an alternative is so unrealistic it may discourage people. Which principle should guide the final choice?", "o": ["Articulated well and easily understood", "Idealistic yet achievable", "Provides clarity of purpose", "Shared and supported"], "a": 1, "e": "A good vision must inspire people to stretch their capabilities; too easy won't motivate, while unachievable may discourage."}, {"q": "Your flight knows what it does and how, but members can't explain why their work matters. Which vision principle addresses this?", "o": ["Provides clarity of purpose and direction", "Idealistic yet achievable — stretch, but stay realistic", "Shared and supported — collaborate on the vision", "SWOT analysis — list strengths and weaknesses"], "a": 0, "e": "Clarity offers insight into why the mission is important. Simon Sinek: few people know why they do it; a good vision can answer the \"why.\""}]}]}, {"lesson": "Problem Solving", "csobs": [{"c": "Define problem-solving.", "t": "def", "qs": [{"q": "According to the reader, in its simplest form problem solving is:", "o": ["A logical, common-sense, fact-based, step-by-step approach based on a \"go and see\" philosophy", "An intuitive decision made quickly by the senior person present", "A one-time fix applied to the most visible symptoms of a problem", "An unstructured brainstorming session that lets the team vent"], "a": 0, "e": "The reader defines problem solving in its simplest form as a logical, common-sense, fact-based, step-by-step approach based on a \"go and see\" philosophy."}, {"q": "What is the objective of the Practical Problem Solving Method (PPSM)?", "o": ["To create more metrics and reporting requirements for work centers", "To focus Airmen's problem solving on issues affecting the mission, work centers, and people", "To replace the OODA loop as the decision model used in combat", "To assign responsibility for failures to the right individuals"], "a": 1, "e": "PPSM is a team-centered, systematic, common-sense approach aimed at increasing combat capability and making DAF units more effective and efficient."}, {"q": "A \"performance gap\" is defined as:", "o": ["The time that passes between each step of the OODA loop", "The difference between current and required performance", "The difference between strategic targets and tactical targets", "A break in the chain of command that delays decisions"], "a": 1, "e": "A performance gap is the difference between current performance and what performance should be — what we should be doing versus what we are doing."}]}, {"c": "Compare the 8-step Practical Problem-Solving Method to the OODA Loop Model.", "t": "scn", "qs": [{"q": "A pilot in a dogfight must make rapid decisions alone with no time for analysis or planning. Which problem-solving model fits best?", "o": ["8-Step PPSM, because it is the official Air Force process improvement model", "OODA Loop, because it suits quick action by a single player with limited time for analysis", "SWOT analysis, because it identifies threats in the environment", "Neither model applies, because combat decisions are purely instinctive"], "a": 1, "e": "The OODA loop is useful when quick action is needed by a single player with limited time for analysis, planning, and training."}, {"q": "A maintenance squadron has struggled with chronic parts delays for two years and wants a team-based, long-term fix. Which model is most appropriate?", "o": ["OODA Loop (Observe, Orient, Decide, Act)", "8-Step Practical Problem Solving Method", "Insist approach to problem solving", "Lewin's unfreeze–change–refreeze model"], "a": 1, "e": "PPSM is designed for long-term, process-improvement solutions; it is less useful for short-term, high-urgency problems."}, {"q": "How does PPSM relate to the OODA loop?", "o": ["They are unrelated models developed for different services", "PPSM expands OODA's four steps into eight (OO-OO-D-AAA)", "PPSM has four steps while OODA has eight, so OODA is more detailed", "OODA was derived from PPSM by simplifying it for combat use"], "a": 1, "e": "The Air Force took the four OODA steps and broke them into the 8-step roadmap: OO-OO-D-AAA."}, {"q": "In the OODA–PPSM overlay, \"Set Improvement Targets\" and \"Determine Root Cause\" correspond to which OODA phase?", "o": ["Obs
